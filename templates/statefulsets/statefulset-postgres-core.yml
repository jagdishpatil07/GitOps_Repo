apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  namespace: myapp

spec:
  serviceName: postgres-core
  replicas: 1

  selector:
    matchLabels:
      app: postgres-core

  template:
    metadata:
      labels:
        app: postgres-core

    spec:
      imagePullSecrets:
        - name: acr-secret

      securityContext:
        fsGroup: 999

      containers:
        - name: postgres-core

          image: revolutio.azurecr.io/revolutio_kubernetes/postgres:18-bookworm
          imagePullPolicy: Always

          command:
            - docker-entrypoint.sh
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf

          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_PASSWORD
              value: "TempTest123!"

            - name: POSTGRES_DB
              value: "postgres"

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: PG_DATABASES
              value: "platform appdb workspace"

            - name: PG_EXTENSIONS
              value: "pg_stat_statements"

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-data
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true

            - name: postgres-data
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true

            - name: postgres-data
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true

            - name: postgres-backups
              mountPath: /backups

            - name: postgres-socket
              mountPath: /var/run/postgresql

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - /var/run/postgresql
                - -p
                - "5432"
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - /var/run/postgresql
                - -p
                - "5432"
            initialDelaySeconds: 60
            periodSeconds: 20

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgresql-data-core-pvc

        - name: postgres-backups
          persistentVolumeClaim:
            claimName: postgresql-backup-core-pvc

        - name: postgres-socket
          persistentVolumeClaim:
            claimName: postgres-core-socket-pvc
