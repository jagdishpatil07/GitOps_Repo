apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  namespace: myapp
  labels:
    app: postgres-core

spec:
  serviceName: postgres-core
  replicas: 1

  selector:
    matchLabels:
      app: postgres-core

  template:
    metadata:
      labels:
        app: postgres-core

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        fsGroup: 999

      containers:
        - name: postgres-core

          image: revolutio.azurecr.io/revolutio_kubernetes/postgres:18-bookworm
          imagePullPolicy: Always

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:

            # ----------------------------------------------------------
            # PostgreSQL
            # ----------------------------------------------------------

            - name: POSTGRES_DB
              value: "postgres"

            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"

            - name: PG_DATABASES
              value: "platform appdb workspace"

            - name: PG_EXTENSIONS
              value: "pg_stat_statements"

            # ----------------------------------------------------------
            # OpenBao
            # ----------------------------------------------------------

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "postgres-core"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/postgres-core/secret_id"

            - name: OPENBAO_ENV_FILE
              value: "/var/run/openbao-env.sh"

            - name: OPENBAO_WRAPPED_ENTRYPOINT
              value: "/usr/local/bin/ensure-extensions-entrypoint.sh"

            # ----------------------------------------------------------
            # Secrets fetched from OpenBao
            # ----------------------------------------------------------

            - name: OPENBAO_SECRETS
              value: >-
                POSTGRES_PASSWORD=postgres-core/admin,
                PLATFORM_APP_PASSWORD=postgres-core/platform_app,
                APP_DB_APP_PASSWORD=postgres-core/app_db_app,
                WORKSPACE_APP_PASSWORD=postgres-core/workspace_app,
                HEALTH_CHECK_PASSWORD=postgres-core/health_check,
                PGBR_PASSWORD=postgres-core/pgbackrest,
                PGBACKREST_REPO1_CIPHER_PASS=postgres-core/pgbackrest_cipher

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"

            limits:
              cpu: "4"
              memory: "8Gi"

          # ------------------------------------------------------------
          # Storage
          # ------------------------------------------------------------

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-data
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true

            - name: postgres-data
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true

            - name: postgres-data
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true

            - name: postgres-backups
              mountPath: /backups

            - name: postgres-socket
              mountPath: /var/run/postgresql

            # ----------------------------------------------------------
            # OpenBao AppRole
            # ----------------------------------------------------------

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            # ----------------------------------------------------------
            # OpenBao TLS
            # ----------------------------------------------------------

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          # ------------------------------------------------------------
          # Readiness
          # ------------------------------------------------------------

          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  pg_isready \
                    -U health_check \
                    -d postgres \
                    -h /var/run/postgresql \
                    -p 5432 \
                    -q

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12

          # ------------------------------------------------------------
          # Liveness
          # ------------------------------------------------------------

          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - |
                  pg_isready \
                    -U health_check \
                    -d postgres \
                    -h /var/run/postgresql \
                    -p 5432 \
                    -q

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6

      # ==================================================================
      # VOLUMES
      # ==================================================================

      volumes:

        # PostgreSQL data + configuration
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgresql-data-core-pvc

        # PostgreSQL backups
        - name: postgres-backups
          persistentVolumeClaim:
            claimName: postgresql-backup-core-pvc

        # PostgreSQL socket
        - name: postgres-socket
          persistentVolumeClaim:
            claimName: postgres-core-socket-pvc

        # --------------------------------------------------------------
        # OpenBao AppRole
        #
        # Contains:
        # /openbao-approle/postgres-core/secret_id
        # --------------------------------------------------------------

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # --------------------------------------------------------------
        # OpenBao TLS certificate
        # --------------------------------------------------------------

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1
