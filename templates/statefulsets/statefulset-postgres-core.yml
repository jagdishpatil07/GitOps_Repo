apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-core
  namespace: myapp
spec:
  serviceName: postgres-core
  replicas: 1

  selector:
    matchLabels:
      app: postgres-core

  template:
    metadata:
      labels:
        app: postgres-core

    spec:
      imagePullSecrets:
        - name: acr-secret

      securityContext:
        fsGroup: 999

      containers:
        - name: postgres-core
          image: revolutio.azurecr.io/revolutio_kubernetes/postgres:18-bookworm
          imagePullPolicy: Always

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: postgres

            - name: PGDATA
              value: /var/lib/postgresql/data

            - name: PG_DATABASES
              value: "platform appdb workspace"

            - name: PG_EXTENSIONS
              value: "pg_stat_statements"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "postgres-core"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_ENV_FILE
              value: "/var/run/openbao-env.sh"

            - name: OPENBAO_WRAPPED_ENTRYPOINT
              value: "/usr/local/bin/ensure-extensions-entrypoint.sh"

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/admin,PLATFORM_APP_PASSWORD=postgres-core/platform_app,APP_DB_APP_PASSWORD=postgres-core/app_db_app,WORKSPACE_APP_PASSWORD=postgres-core/workspace_app,HEALTH_CHECK_PASSWORD=postgres-core/health_check,PGBR_PASSWORD=postgres-core/pgbackrest,PGBACKREST_REPO1_CIPHER_PASS=postgres-core/pgbackrest_cipher"

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

          volumeMounts:

            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            - name: postgres-data
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true

            - name: postgres-data
              mountPath: /etc/postgresql/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true

            - name: postgres-data
              mountPath: /etc/pgbackrest/pgbackrest.conf
              subPath: pgbackrest.conf
              readOnly: true

            - name: postgres-backups
              mountPath: /backups

            - name: postgres-socket
              mountPath: /var/run/postgresql

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - /var/run/postgresql
                - -p
                - "5432"
            initialDelaySeconds: 30
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - /var/run/postgresql
                - -p
                - "5432"
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 6

      volumes:

        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgresql-data-core-pvc

        - name: postgres-backups
          persistentVolumeClaim:
            claimName: postgresql-backup-core-pvc

        - name: postgres-socket
          persistentVolumeClaim:
            claimName: postgres-core-socket-pvc

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-postgres-core-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1
