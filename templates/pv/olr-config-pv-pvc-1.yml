apiVersion: v1
kind: PersistentVolume
metadata:
  name: olr-config-pv-1
spec:
  capacity:
    storage: 1Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  nfs:
    server: 127.0.0.1
    path: /data/nfs/olr-config

  volumeMode: Filesystem

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: olr-config-pvc-1
  namespace: myapp
spec:
  accessModes:
    - ReadWriteMany

  resources:
    requests:
      storage: 1Gi

  storageClassName: ""

  volumeName: olr-config-pv-1

  volumeMode: Filesystem
