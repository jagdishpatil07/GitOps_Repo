apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-pv-1

spec:
  capacity:
    storage: 5Gi   # ✅ Correct placement

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain   # ✅ Correct key

  storageClassName: ""

  nfs:
    server: 127.0.0.1
    path: /data/nfs/media-pvc-1

  volumeMode: Filesystem