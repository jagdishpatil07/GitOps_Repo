apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-state-bucket-pv
spec:
  storageClassName: csi-s3
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: myapp
    name: openbao-state-bucket-pvc
  csi:
    driver: ru.yandex.s3.csi
    volumeHandle: openbao-state
    volumeAttributes:
      capacity: 10Gi
      mounter: geesefs
      options: "--uid <OPENBAO_UID> --gid <OPENBAO_GID> --dir-mode 0770 --file-mode 0660"
    nodePublishSecretRef:
      name: csi-s3-secret
      namespace: kube-system
    nodeStageSecretRef:
      name: csi-s3-secret
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-state-bucket-pvc
  namespace: myapp
spec:
  storageClassName: csi-s3
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
  volumeName: openbao-state-bucket-pv
---
