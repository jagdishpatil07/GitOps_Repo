
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-bucket-pv-shared
spec:
  storageClassName: csi-s3
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: myapp
    name: media-bucket-pvc-shared
  csi:
    driver: ru.yandex.s3.csi
    volumeHandle: media
    volumeAttributes:
      capacity: 10Gi
      mounter: geesefs
      options: "--uid 70070 --gid 70070 --dir-mode 0770 --file-mode 0660 --stat-cache-ttl 5s"
    nodePublishSecretRef:
      name: csi-s3-secret
      namespace: kube-system
    nodeStageSecretRef:
      name: csi-s3-secret
      namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-bucket-pvc-shared
  namespace: myapp
spec:
  storageClassName: csi-s3
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
  volumeName: media-bucket-pv-shared
---
