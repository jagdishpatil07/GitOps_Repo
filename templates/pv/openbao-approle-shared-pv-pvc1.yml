apiVersion: v1
kind: PersistentVolume
metadata:
  name: openbao-approle-shared-pv-1
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 127.0.0.1
    path: /data/nfs/openbao-approle-shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-approle-shared-pvc-1
  namespace: myapp
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: openbao-approle-shared-pv-1
  resources:
    requests:
      storage: 5Gi
