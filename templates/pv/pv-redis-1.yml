apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv-1

spec:
  capacity:
    storage: 5Gi

  accessModes:
    - ReadWriteOnce   # ✅ Redis uses RWO

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  nfs:
    server: 127.0.0.1
    path: /data/nfs/redis-pvc-1

  volumeMode: Filesystem