apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-data-core-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
  nfs:
    server: 127.0.0.1
    path: /data/nfs/postgresql-data-core

