apiVersion: v1
kind: PersistentVolume
metadata:
  name: platform-migrator-state-pv-1
spec:
  capacity:
    storage: 1Gi

  accessModes:
    - ReadWriteMany

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  nfs:
    server: 127.0.0.1
    path: /data/nfs/platform-migrator-state

  volumeMode: Filesystem

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-migrator-state-pvc
  namespace: myapp

spec:
  accessModes:
    - ReadWriteMany

  resources:
    requests:
      storage: 1Gi

  storageClassName: ""

  volumeName: platform-migrator-state-pv-1

  volumeMode: Filesystem
