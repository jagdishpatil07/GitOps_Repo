apiVersion: v1
kind: ConfigMap
metadata:
  name: envs-production-web
  namespace: myapp

data:

  # ============================================================
  # Django / Application
  # ============================================================

  DJANGO_SUPERUSER_USERNAME: "revolutio_admin"
  DJANGO_SUPERUSER_EMAIL: "contact@acies.holdings"

  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_ADMIN_URL: "nxB0AWFHi204T2g7VxhVxJ5UYKMBQIjl/"
  DJANGO_SETTINGS_MODULE: "config.settings.local"

  DJANGO_SESSION_COOKIE_SAMESITE: "Lax"
  DJANGO_SESSION_COOKIE_AGE: "86400"

  DJANGO_ACCOUNT_ALLOW_REGISTRATION: "true"

  ACCOUNT_DEFAULT_HTTP_PROTOCOL: "https"

  PLATFORM_DOMAIN_NAME: "4.240.124.84:30007"

  KUBERNETES_ENV: "true"

  LDAP_ACTIVATED: "false"

  OPERATION_TYPE: "application_run"

  SCHEDULER_AUTOSTART: "true"

  CLEAR_CACHE_ON_STARTUP: "true"

  PUBLISH_STATIC: "1"
  RUN_BOOTSTRAP: "1"


  # ============================================================
  # Web / Runtime
  # ============================================================

  WEB_WORKERS: "3"

  WORKERS: "9"

  DATA_UPLOAD_QUEUES: "1"

  COMPUTATION_QUEUES: "2"

  MPLCONFIGDIR: "/opt/temp"

  NUMBA_CACHE_DIR: "/tmp"

  PDF_MAX_STRING_LENGTH: "10000000"


  # ============================================================
  # PostgreSQL
  # ============================================================

  POSTGRES_USER: "platform_app"
  POSTGRES_HOST: "pgbouncer1-new"
  POSTGRES_DB: "Platform_DB"
  POSTGRES_PORT: "5432"
  DATABASE_TYPE: "PostgreSQL"


  # ============================================================
  # Redis
  # Password MUST come from OpenBao
  # ============================================================

  REDIS_HOST: "redis"
  REDIS_PORT: "6379"


  # ============================================================
  # RabbitMQ
  # ============================================================

  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "guest"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "guest"


  # ============================================================
  # CDN
  # ============================================================

  CDN_CUSTOM_DOMAIN: ""
  CDN_CUSTOM_LOCATION: "static"


  # ============================================================
  # CORS / Server
  # ============================================================

  CORS_ALLOWED_ORIGIN_REGEXES: '^https?://4\.240\.124\.84:30007$'

  SERVER_NAME: "4.240.124.84 *.4.240.124.84/"


  # ============================================================
  # CouchDB
  # ============================================================

  COUCHDB_PROTOCOL: "http"
  COUCHDB_HOST: "couchdb"
  COUCHDB_PORT: "5984"
  COUCHDB_USER: "couchdb"

  # COUCHDB_PASSWORD is NOT here.
  # Put it in Secret/OpenBao if Web requires it.


  # ============================================================
  # Kafka
  # ============================================================

  KAFKA_CONNECT_URL: "http://connect:8083"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"


  # ============================================================
  # DataHub
  # ============================================================

  DATAHUB_API_BASE_URL: "http://datahub-api:5003/datahub-api"


  # ============================================================
  # Public API
  # ============================================================

  PUBLIC_API_RATE_LIMIT: "1000"
  PUBLIC_API_RATE_WINDOW: "1"


  # ============================================================
  # Upload limits
  # ============================================================

  MAX_PLATFORM_FILE_UPLOAD_MB: "50"

  UPLOAD_APP_PACKAGE_MAX_SIZE_MB: "100"

  UPLOAD_APP_DATA_PACKAGE_MAX_SIZE_MB: "100"


  # ============================================================
  # Oracle
  # ============================================================

  ORACLE_NFS_SERVER: "10.7.0.14"

  ORACLE_HOST: "10.7.0.14"

  ORACLE_PORT: "1521"

  ORACLE_CDB: "FREE"

  OLR_TOPIC_PREFIX: "olr"

  ORACLE_NFS_CLIENT_CIDR: "10.4.0.4/32"

  # ORACLE_SYS_PWD is secret.
  # It must NOT be stored in this ConfigMap.


  # ============================================================
  # Internal gRPC
  # ============================================================

  INTERNAL_GRPC_TARGET: "internal-grpc:50051"

  # INTERNAL_SERVICE_TOKEN is secret.
  # It must NOT be stored in this ConfigMap.


  # ============================================================
  # Observability
  # ============================================================

  OTEL_ENABLED: "true"

  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"

  OTEL_SERVICE_NAME_PREFIX: "revolutio"

  OTEL_DEPLOYMENT_ENVIRONMENT: "dev"

  OTEL_TRACE_SAMPLE_RATIO_DEFAULT: "1.0"

  OTEL_BSP_SCHEDULE_DELAY_MS: "5000"

  OTEL_BSP_EXPORT_TIMEOUT_MS: "5000"

  OTEL_BSP_MAX_QUEUE_SIZE: "2048"

  OTEL_EXPORTER_OTLP_TIMEOUT: "2"

  OBS_CONFIG_CACHE_TTL_S: "60"

  RRWEB_ENABLED_DEFAULT: "false"

  RRWEB_BATCH_INTERVAL_MS: "5000"

  RRWEB_MAX_BATCH_KB: "8192"

  WEB_VITALS_ENABLED_DEFAULT: "true"


  # ============================================================
  # ClickHouse
  # ============================================================

  CLICKHOUSE_OBS_DB: "revolutio_observability"

  CLICKHOUSE_ENDPOINT: "tcp://clickhouse:9000"

  CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"

  CLICKHOUSE_WRITER_USER: "otel_writer"

  CLICKHOUSE_READER_USER: "obs_reader"

  OTEL_CLICKHOUSE_TTL: "720h"

  RRWEB_RETENTION_DAYS: "7"

  BENCH_RETENTION_DAYS: "365"


  # ============================================================
  # Observability resource limits
  # ============================================================

  CLICKHOUSE_MEM_LIMIT: "3g"

  OTEL_COLLECTOR_MEM_LIMIT: "768m"

  OBS_API_MEM_LIMIT: "512m"

  OBS_UI_MEM_LIMIT: "128m"

  PGBOUNCER_EXPORTER_MEM_LIMIT: "64m"

  BENCH_RUNNER_MEM_LIMIT: "512m"


  # ============================================================
  # OpenTelemetry Collector
  # ============================================================

  OTEL_COLLECTOR_LOG_LEVEL: "warn"

  OTEL_MEMORY_LIMIT_MIB: "512"

  OTEL_MEMORY_SPIKE_MIB: "128"

  OTEL_MAX_RECV_MSG_MIB: "8"

  OTEL_HOSTMETRICS_INTERVAL: "30s"

  OTEL_DOCKER_STATS_INTERVAL: "60s"

  OTEL_DOCKER_STATS_TIMEOUT: "45s"

  OTEL_DOCKER_ENDPOINT: "tcp://docker-socket-proxy:2375"

  OTEL_DB_METRICS_INTERVAL: "60s"

  OTEL_POSTGRES_ENDPOINT: "postgres-core:5432"

  OTEL_REDIS_ENDPOINT: "redis:6379"

  OTEL_KEYDB_ENDPOINT: "keydb:6379"

  OTEL_PG_STATEMENTS_INTERVAL: "120s"

  OTEL_PG_STATEMENTS_TOP_N: "20"

  OTEL_METRICS_ENABLED: "true"

  OTEL_METRIC_EXPORT_INTERVAL_MS: "30000"

  OTEL_PROM_SCRAPE_INTERVAL: "30s"

  OTEL_PGBOUNCER_EXPORTER_ENDPOINT: "pgbouncer-exporter:9127"

  OTEL_INTERNAL_DB_EXPORTER_ENDPOINT: "internal-db-exporter:9128"

  OTEL_INTERNAL_DB_SCRAPE_INTERVAL: "60s"

  OTEL_INTERNAL_DB_SCRAPE_TIMEOUT: "30s"

  DATABASE_EXPORTER_INTERVAL: "60"

  DATABASE_EXPORTER_STATEMENT_TOP_N: "20"

  OTEL_KONG_METRICS_ENDPOINT: "kong:8100"


  # ============================================================
  # Observability API / throttling
  # ============================================================

  OBS_AUTO_THROTTLE_ENABLED: "true"

  OBS_THROTTLE_SPAN_SHARE_PCT: "50"

  OBS_THROTTLE_MIN_SPANS: "100000"

  OBS_THROTTLE_WINDOW_MIN: "15"

  OBS_THROTTLE_RATIO: "0.2"

  OBS_THROTTLE_COOLDOWN_MIN: "60"

  OBS_RETENTION_SWEEP_HOURS: "6"

  OBS_API_MAX_RANGE_DAYS: "30"

  OBS_API_MAX_PAGE_SIZE: "200"

  OBS_API_QUERY_TIMEOUT_S: "60"

  OBS_OUTLIER_MEDIAN_MULTIPLIER: "5.0"

  OBS_OUTLIER_MIN_DURATION_MS: "500"


  # ============================================================
  # Observability archive
  # ============================================================

  OBS_ARCHIVE_SINK: "local"

  OBS_ARCHIVE_PREFIX: "obs"


  # ============================================================
  # OpenTelemetry tail sampling
  # ============================================================

  OTEL_TAIL_DECISION_WAIT: "10s"

  OTEL_TAIL_NUM_TRACES: "50000"

  OTEL_TAIL_EXPECTED_NEW_TPS: "200"

  OTEL_TAIL_LATENCY_MS: "2000"

  OTEL_TAIL_PROBABILISTIC_PCT: "100"


  # ============================================================
  # OpenTelemetry batch / queue
  # ============================================================

  OTEL_BATCH_TIMEOUT: "5s"

  OTEL_BATCH_SIZE: "8192"

  OTEL_BATCH_MAX_SIZE: "16384"

  OTEL_SENDING_QUEUE_SIZE: "5000"


  # ============================================================
  # Web Builder
  # ============================================================

  WEB_BUILDER_DB: "WorkspaceDB"

  WEB_BUILDER_DB_USER: "workspace_app"

  WEB_BUILDER_DB_HOST: "postgres-core"


  # ============================================================
  # PostgreSQL backup
  # ============================================================

  PGBR_ENABLED: "false"

  BACKUP_ENABLED: "true"

  BACKUP_INTERVAL_SECONDS: "86400"

  BACKUP_RETENTION_DAYS: "7"
