apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: myapp

data:
  nginx.conf: |
    #load_module modules/ngx_http_headers_more_filter_module.so;
    worker_processes auto;

    events
    {
      worker_connections 1024;
    }

    error_log /var/log/nginx/error.log info;
    pid /var/run/nginx.pid;

    http
    {
      server_tokens off;

      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;

      sendfile on;
      keepalive_timeout 10;

      gzip on;
      gzip_comp_level 2;
      gzip_min_length 1000;
      gzip_proxied expired no-cache no-store private auth;
      gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon;

      include /etc/nginx/conf.d/*.conf;
      include /etc/nginx/conf.d/blockuseragents.rules;

      upstream revolutio_web
      {
        server web:5000;
      }

      upstream revolutio_saml
      {
        server saml:9000;
      }

      server
      {
        if ($blockedagent)
        {
          return 403;
        }

        listen 8080;

        # SSL settings disabled
        #ssl_certificate /etc/nginx/ssl.crt;
        #ssl_certificate_key /etc/nginx/ssl.key;
        #ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

        client_max_body_size 500M;
        client_body_buffer_size 500M;
        client_header_buffer_size 50M;
        client_body_timeout 10;
        client_header_timeout 10;
        large_client_header_buffers 2 60M;

        types
        {
          application/javascript mjs;
        }

        #location /static/
        #{
        #  alias /var/www/revolutio/static/;

        #  error_page 403 = /403/;
        #  error_page 404 = /404/;
        #  error_page 400 = /400/;
        #  error_page 500 = /500/;
        #  error_page 503 = /503/;
        #  error_page 502 = /502/;
        #}

        location /media/
        {
          alias /var/www/revolutio/media/;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
        }

        location /asset/
        {
          alias /var/www/asset/;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
        }

        location /ws/
        {
          proxy_pass http://revolutio_web;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_set_header Host $http_host;
        }

        location /accounts/saml/
        {
          proxy_pass http://revolutio_saml;

          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Cookie $http_cookie;

          proxy_redirect off;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_request_buffering off;

          proxy_read_timeout 1800;
          proxy_connect_timeout 1800;
          proxy_send_timeout 1800;

          proxy_hide_header X-Powered-By;
          proxy_hide_header Server;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
        }

        location /
        {
          proxy_pass http://revolutio_web;

          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_max_temp_file_size 0;
          proxy_read_timeout 10000;
          proxy_connect_timeout 1800;
          proxy_send_timeout 1800;
          send_timeout 1800;

          proxy_hide_header X-Powered-By;
          proxy_hide_header Server;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;

          if ($request_method ~ ^(OPTIONS)$)
          {
            return 403;
          }

          if ($request_method !~ ^(GET|HEAD|POST)$)
          {
            return 405;
          }
        }
      }
    }

  mime.types: |
    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        image/gif gif;
        image/jpeg jpeg jpg;
        application/javascript js;
        application/json json;
        image/png png;
        image/svg+xml svg;
    }

  blockuseragents.rules: |
    map $http_user_agent $blockedagent {
        default         0;
        ~*malicious     1;
        ~*bot           1;
        ~*backdoor      1;
        ~*crawler       1;
        ~*bandit        1;
    }
