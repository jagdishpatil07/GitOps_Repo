apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: myapp

data:

  nginx.conf: |
    #load_module modules/ngx_http_headers_more_filter_module.so;

    worker_processes auto;

    events
    {
      worker_connections 1024;
    }

    error_log /var/log/nginx/error.log info;

    pid /var/run/nginx.pid;

    http
    {
      server_tokens off;

      include /etc/nginx/mime.types;

      default_type application/octet-stream;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;

      sendfile on;

      tcp_nopush on;

      tcp_nodelay on;

      keepalive_timeout 65;

      gzip on;

      gzip_comp_level 2;

      gzip_min_length 1000;

      gzip_proxied expired no-cache no-store private auth;

      gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/x-icon;

      include /etc/nginx/conf.d/*.conf;

      include /etc/nginx/conf.d/blockuseragents.rules;
    }


  mime.types: |
    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        image/gif gif;
        image/jpeg jpeg jpg;
        application/javascript js;
        application/json json;
        image/png png;
        image/svg+xml svg;
        image/webp webp;
        image/x-icon ico;
        image/bmp bmp;
        image/tiff tif tiff;
        font/woff woff;
        font/woff2 woff2;
        application/pdf pdf;
        application/zip zip;
        application/gzip gz;
        application/octet-stream bin exe;
        application/vnd.ms-fontobject eot;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
        application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
    }


  blockuseragents.rules: |
    map $http_user_agent $blockedagent {
        default         0;
        ~*malicious     1;
        ~*bot           1;
        ~*backdoor      1;
        ~*crawler       1;
        ~*bandit        1;
    }


  nginx.tmpl: |
    {{/*
      Rendered by docker-gen into /etc/nginx/conf.d/default.conf every time a
      container starts/stops/dies (see the `docker-gen -watch` command in
      docker-compose-nginx.yaml). Each optional backend (everything except the
      core "web" app) only gets an upstream + location block when a container
      for that compose service actually exists, so nginx never fails to start
      or reload just because some service isn't running.

      TLS is keyed off the cert files rather than a flag: mount a pair into
      /etc/ssl/revolutio and you get HTTPS on 443 with 8080 redirecting to it;
      leave the directory empty (the local-development default) and the app is
      served over plain HTTP on 8080.
    */}}
    {{ $ssl := and (exists "/etc/ssl/revolutio/ssl.crt") (exists "/etc/ssl/revolutio/ssl.key") }}
    {{ $serverName := or $.Env.SERVER_NAME "_" }}
    {{ $web := false }}
    {{ $saml := false }}
    {{ $webBuilder := false }}
    {{ $webBuilderApi := false }}
    {{ $dashboardApi := false }}
    {{ $dashboardApp := false }}
    {{ $datahubApi := false }}
    {{ $datahubApp := false }}
    {{ $kong := false }}
    {{ $observabilityApi := false }}
    {{ $vantageUi := false }}

    {{ range $c := . }}
    {{ $svc := index $c.Labels "com.docker.compose.service" }}

    {{ if eq $svc "web" }}{{ $web = true }}{{ end }}
    {{ if eq $svc "saml" }}{{ $saml = true }}{{ end }}
    {{ if eq $svc "web-builder" }}{{ $webBuilder = true }}{{ end }}
    {{ if eq $svc "web-builder-api" }}{{ $webBuilderApi = true }}{{ end }}
    {{ if eq $svc "dashboard-api" }}{{ $dashboardApi = true }}{{ end }}
    {{ if eq $svc "dashboardapp" }}{{ $dashboardApp = true }}{{ end }}
    {{ if eq $svc "datahub-api" }}{{ $datahubApi = true }}{{ end }}
    {{ if eq $svc "datahubapp" }}{{ $datahubApp = true }}{{ end }}
    {{ if eq $svc "kong" }}{{ $kong = true }}{{ end }}
    {{ if eq $svc "observability-api" }}{{ $observabilityApi = true }}{{ end }}
    {{ if eq $svc "vantage-ui" }}{{ $vantageUi = true }}{{ end }}

    {{ end }}

    {{ if $web }}
    upstream revolutio_web {
      server web:5000;
      keepalive 32;
    }
    {{ end }}

    {{ if $saml }}
    upstream revolutio_saml {
      server saml:9000;
    }
    {{ end }}

    {{ if $webBuilder }}
    upstream revolutio_web_builder {
      server web-builder:3000;
    }
    {{ end }}

    {{ if $webBuilderApi }}
    upstream revolutio_web_builder_api {
      server web-builder-api:5001;
    }
    {{ end }}

    {{ if $dashboardApi }}
    upstream micro_dashboard_api {
      server dashboard-api:5002;
    }
    {{ end }}

    {{ if $dashboardApp }}
    upstream revolutio_dashboard {
      server dashboardapp:3002;
    }
    {{ end }}

    {{ if $datahubApi }}
    upstream micro_datahub_api {
      server datahub-api:5003;
    }
    {{ end }}

    {{ if $datahubApp }}
    upstream revolutio_datahub {
      server datahubapp:3003;
    }
    {{ end }}

    {{ if $kong }}
    upstream micro_datahub_kong {
      server kong:8002;
    }
    {{ end }}

    {{ if $observabilityApi }}
    upstream observability_api {
      server observability-api:5004;
    }
    {{ end }}

    {{ if $vantageUi }}
    upstream vantage_ui {
      server vantage-ui:3004;
    }
    {{ end }}


    {{ if $ssl }}
    server {
      listen 8080;

      location = /healthy {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        return 301 https://$host$request_uri;
      }
    }
    {{ end }}


    server
    {
      if ($blockedagent)
      {
        return 403;
      }

    {{ if $ssl }}
      listen 443 ssl;
      server_name {{ $serverName }};

      ssl_certificate /etc/ssl/revolutio/ssl.crt;
      ssl_certificate_key /etc/ssl/revolutio/ssl.key;

      ssl_protocols TLSv1.2 TLSv1.3;

      ssl_session_timeout 1d ;

      ssl_session_cache shared:MozSSL:10m; # about 40000 sessions

      ssl_session_tickets off;

      ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256: ECDHE-RSA-AES128-GCM-SHA256: ECDHE-ECDSA-AES256-GCM-SHA384: ECDHE-RSA-AES256-GCM-SHA384: ECDHE-ECDSA-CHACHA20-POLY1305: ECDHE-RSA-CHACHA20-POLY1305';

      ssl_prefer_server_ciphers off;

      add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

    {{ else }}
      listen 8080;
      server_name _;
    {{ end }}


      location = /healthy {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }


      # security headers

      add_header X-XSS-Protection "1; mode=block";

      add_header X-Frame-Options "SAMEORIGIN";

      add_header X-Content-Type-Options "nosniff";

      add_header Referrer-Policy "same-origin";

      add_header 'Permissions-Policy' 'camera=(), geolocation=(), microphone=()';

      add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; connect-src 'self'" always;

      add_header 'Cross-Origin-Embedder-Policy' 'require-corp';

      add_header 'Cross-Origin-Opener-Policy' 'same-origin';

      add_header Cross-Origin-Resource-Policy 'same-origin' always;


      # Client buffer settings

      client_max_body_size 500M;

      client_body_buffer_size 500M;

      client_header_buffer_size 50M;

      client_body_timeout 10;

      client_header_timeout 10;

      large_client_header_buffers 2 600M;

      include mime.types;

      types
      {
        application/javascript mjs;
      }


      location /static/ {
          alias /var/www/revolutio/static/;

          expires 1y;

          add_header Cache-Control "public, max-age=31536000" always;

          add_header X-Content-Type-Options "nosniff" always;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
      }


      location /media/ {
          alias /var/www/revolutio/media/;

          add_header Cache-Control "no-cache, no-store";

          add_header Pragma "no-cache" always;

          add_header Expires "0" always;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
      }


      location /asset/ {
          alias /var/www/asset/;

          expires 1y;

          add_header Cache-Control "public, max-age=31536000" always;

          add_header X-Content-Type-Options "nosniff" always;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
      }


      {{ if $saml }}
      location /accounts/saml/ {
          proxy_pass http://revolutio_saml;

          proxy_set_header Host $http_host;

          proxy_set_header X-Real-IP $remote_addr;

          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_set_header X-Forwarded-Proto $scheme;

          proxy_redirect off;

          proxy_http_version 1.1;

          proxy_buffering off;

          proxy_request_buffering off;

          proxy_read_timeout 1800;

          proxy_connect_timeout 1800;

          proxy_send_timeout 1800;

          proxy_hide_header X-Powered-By;

          proxy_hide_header Server;

          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
      }
      {{ end }}


      {{ if $web }}
      location /ws/ {
        proxy_pass http://revolutio_web;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $http_host;
      }

      {{ else }}

      location /ws/ {
        default_type text/plain;

        return 503 "revolutio web service is not currently running\n";
      }

      {{ end }}


      {{ if $webBuilder }}
      location /web-builder/ {
        proxy_pass http://revolutio_web_builder;

        proxy_set_header Connection keep-alive;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        proxy_max_temp_file_size 0;
      }
      {{ end }}


      {{ if $webBuilderApi }}
      location /web-builder-api/ {
        proxy_pass http://revolutio_web_builder_api;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        add_header Cache-Control "no-cache, no-store";

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;

        proxy_max_temp_file_size 0;
      }
      {{ end }}


      {{ if $vantageUi }}
      location /vantage/ {
        proxy_pass http://vantage_ui;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        proxy_max_temp_file_size 0;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

        add_header X-Content-Type-Options "nosniff" always;

        add_header X-Frame-Options "SAMEORIGIN" always;

        {{ if $ssl }}add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" always;{{ end }}
      }
      {{ end }}


      {{ if $observabilityApi }}
      location /vantage-api/ {
        proxy_pass http://observability_api;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        proxy_max_temp_file_size 0;

        # Twice the app's own 2MB trace cap; the app rejects anything bigger anyway.

        client_max_body_size 4M;

        # JSON only; nosniff stops a browser rendering a response as markup.

        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

        add_header X-Content-Type-Options "nosniff" always;

        add_header Cache-Control "no-cache, no-store";

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;
      }
      {{ end }}


      {{ if $dashboardApi }}
      location /dashboard-api/ {
        proxy_pass http://micro_dashboard_api;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        proxy_max_temp_file_size 0;

        add_header Cache-Control "no-cache, no-store";

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;
      }
      {{ end }}


      {{ if $datahubApi }}
      location /datahub-api/ws/ {
          proxy_pass http://micro_datahub_api;

          proxy_http_version 1.1;

          proxy_set_header Upgrade $http_upgrade;

          proxy_set_header Connection "upgrade";

          proxy_read_timeout 3600s;

          proxy_buffering off;
      }

      location /datahub-api/ {
        proxy_pass http://micro_datahub_api;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        proxy_max_temp_file_size 0;

        add_header Cache-Control "no-cache, no-store";

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;
      }
      {{ end }}


      {{ if $dashboardApp }}
      location /dashboard/ {
        proxy_pass http://revolutio_dashboard;

        proxy_set_header Connection keep-alive;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        proxy_max_temp_file_size 0;
      }
      {{ end }}


      {{ if $datahubApp }}
      location ^~ /datahub/ {
        proxy_pass http://revolutio_datahub/datahub/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ^~ /datahub/assets/ {
        proxy_pass http://revolutio_datahub/datahub/assets/;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000" always;

        add_header X-Content-Type-Options "nosniff" always;

        proxy_http_version 1.1;

        proxy_buffering off;

        proxy_request_buffering off;

        gzip off;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
      }
      {{ end }}


      {{ if $web }}
      location /
      {
        proxy_pass http://revolutio_web;

        proxy_set_header Host $http_host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_max_temp_file_size 0;

        proxy_read_timeout 10000;

        proxy_connect_timeout 1800;

        proxy_send_timeout 1800;

        send_timeout 1800;

        proxy_hide_header X-Powered-By;

        proxy_hide_header Server;

        error_page 403  = /403/;

        error_page 404 = /404/;

        error_page 400 = /400/;

        error_page 500 = /500/;

        error_page 503 = /503/;

        error_page 502 = /502/;

        proxy_http_version 1.1;

        proxy_set_header Connection "";

        if ($request_method ~ ^(OPTIONS)$ )
        {
          return 403;
        }

        if ($request_method !~ ^(GET|HEAD|POST)$ )
        {
          return 405;
        }
      }

      {{ else }}

      location / {
        default_type text/plain;

        return 503 "Revolutio is not currently running\n";
      }

      {{ end }}
    }
