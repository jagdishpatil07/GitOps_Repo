apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: myapp

data:
  nginx.conf: |
   #load_module modules/ngx_http_headers_more_filter_module.so;
worker_processes auto;
events
{
  worker_connections 1024;
}

error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

http
{

  # Include all the headers necessary
  server_tokens off;
  #more_set_headers "Server:revolutio-server";
  # Closes header

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  #tcp_nopush     on;

  keepalive_timeout 10;

  gzip on;
  gzip_comp_level 2;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon;

  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/conf.d/blockuseragents.rules;

  #limit_conn_zone $binary_remote_addr zone=limitperip:10m;
  #limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;

  upstream revolutio_web
  {
    server web:5000;
  }

 #server {
 #   listen 80;
 #   return 301 https://$host$request_uri;
 # }

  server
  {

    if ($blockedagent)
    {
      return 403;
    }

    # Put in all the allowed hosts separated by |
    if ( $host !~* ^(4.240.124.84)$ ) {
        return 403;
    }
    if ( $http_host !~* ^(4.240.124.84:30007|4.240.124.84:8080)) {
        return 403;
    }
    listen 443 ssl;

    # ssl seetings and certificate
    #ssl on;
    #ssl_certificate /etc/ssl/ssl.crt;
    #ssl_certificate_key /etc/ssl/ssl.key;
    ssl_certificate /etc/nginx/ssl.crt;
    ssl_certificate_key /etc/nginx/ssl.key;
    ssl_protocols TLSV1.2 TLSv1.3;
    ssl_session_timeout 1d ;
    ssl_session_cache shared:MozSSL:10m; # about 40000 sessions
    ssl_session_tickets off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-R#SA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;


    # security headers
    add_header X-XSS-Protection "1; mode=block";
    #add_header X-Frame-Options "SAMEORIGIN";
    #add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
    #add_header Cache-Control "max-age=63072000";
    # disabled CSP settings and it messes with our JS
    # add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' http: https: data:";


    # Client buffer settings
    #keepalive_timeout 10;
    client_max_body_size 500M;
    client_body_buffer_size 500M;
    client_header_buffer_size 50M;
    client_body_timeout 10;
    client_header_timeout 10;
    large_client_header_buffers 2 60M;
    #limit_conn limitperip 100;

    # OCSP stapling
    #ssl_stapling on;
    #ssl_stapling_verify on;
    include mime.types;
    types
    {
      application/javascript mjs;
    }

    location /static/ {
        # autoindex on
        alias /var/www/revolutio/static/;
        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
    }
    location /media/ {
        # autoindex on;
        alias /var/www/revolutio/media/;
        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
    }
    location /asset/ {
        # autoindex on;
        alias /var/www/asset/;
        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
    }
    location /ws/ {
      proxy_pass http://revolutio_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_set_header Host $http_host;
    }
    location /
    {
      proxy_pass http://revolutio_web;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_max_temp_file_size 0;
      proxy_read_timeout 10000;
      proxy_connect_timeout 1800;
      proxy_send_timeout 1800;
      send_timeout 1800;
      # if ssl is being used
      proxy_hide_header X-Powered-By;
      proxy_hide_header Server;
      error_page 403  = /403/;
      error_page 404 = /404/;
      error_page 400 = /400/;
      error_page 500 = /500/;
      error_page 503 = /503/;
      error_page 502 = /502/;


      if ($request_method ~ ^(OPTIONS)$ )
      {
        return 403;
      }

      if ($request_method !~ ^(GET|HEAD|POST)$ )
      {
        return 405;
      }


    }

  }
}
  mime.types: |
    

