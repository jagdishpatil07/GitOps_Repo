apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: myapp

data:
  blockuseragents.rules: |
    map $http_user_agent $blockedagent {
            default         0;
            ~*malicious     1;
            ~*bot           1;
            ~*backdoor      1;
            ~*crawler       1;
            ~*bandit        1;
    }

  default.conf: |
    upstream revolutio_web {
      server web:5000;
      keepalive 32;
    }

    upstream revolutio_saml {
      server saml:9000;
    }

    #upstream revolutio_web_builder {
    #  server web-builder:3000;
    #}

    #upstream revolutio_web_builder_api {
    #  server web-builder-api:5001;
    #}

    #upstream micro_dashboard_api {
    #  server dashboard-api:5002;
    #}

    upstream revolutio_dashboard {
      server dashboardapp:3002;
    }

    #upstream micro_datahub_api {
    #  server datahub-api:5003;
    #}

    upstream revolutio_datahub {
      server datahubapp:3003;
    }

    #upstream micro_datahub_kong {
     # server kong:8002;
    #}

    #upstream observability_api {
     # server observability-api:5004;
    #}

    #upstream vantage_ui {
    #  server vantage-ui:3004;
    #}

    server {
      listen 8080;

      server_name _;

      location = /healthy {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        return 301 https://$host$request_uri;
      }
    }

    server {
      listen 443 ssl;

      server_name _;

      if ($blockedagent) {
        return 403;
      }

      ssl_certificate /etc/ssl/revolutio/ssl.crt;
      ssl_certificate_key /etc/ssl/revolutio/ssl.key;

      ssl_protocols TLSv1.2 TLSv1.3;

      ssl_session_timeout 1d;
      ssl_session_cache shared:MozSSL:10m;
      ssl_session_tickets off;

      ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

      ssl_prefer_server_ciphers off;

      add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

      location = /healthy {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      add_header X-XSS-Protection "1; mode=block";
      add_header X-Frame-Options "SAMEORIGIN";
      add_header X-Content-Type-Options "nosniff";
      add_header Referrer-Policy "same-origin";
      add_header Permissions-Policy "camera=(), geolocation=(), microphone=()";
      add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; connect-src 'self'" always;
      add_header Cross-Origin-Embedder-Policy "require-corp";
      add_header Cross-Origin-Opener-Policy "same-origin";
      add_header Cross-Origin-Resource-Policy "same-origin" always;

      client_max_body_size 500M;
      client_body_buffer_size 500M;
      client_header_buffer_size 50M;
      client_body_timeout 10;
      client_header_timeout 10;
      large_client_header_buffers 2 600M;

      types {
        application/javascript mjs;
      }

      location /static/ {
        alias /var/www/revolutio/static/;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
      }

      location /media/ {
        alias /var/www/revolutio/media/;

        add_header Cache-Control "no-cache, no-store";
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
      }

      location /asset/ {
        alias /var/www/asset/;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
      }

      location /accounts/saml/ {
        proxy_pass http://revolutio_saml;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 1800;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;
      }

      location /ws/ {
        proxy_pass http://revolutio_web;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
      }

      location /dashboard-api/ {
        proxy_pass http://micro_dashboard_api;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_max_temp_file_size 0;

        add_header Cache-Control "no-cache, no-store";
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
      }

      location /datahub-api/ws/ {
        proxy_pass http://micro_datahub_api;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_buffering off;
      }

      location /datahub-api/ {
        proxy_pass http://micro_datahub_api;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_max_temp_file_size 0;

        add_header Cache-Control "no-cache, no-store";
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
      }

      location /dashboard/ {
        proxy_pass http://revolutio_dashboard;

        proxy_set_header Connection keep-alive;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_max_temp_file_size 0;
      }

      location ^~ /datahub/ {
        proxy_pass http://revolutio_datahub/datahub/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location ^~ /datahub/assets/ {
        proxy_pass http://revolutio_datahub/datahub/assets/;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;

        gzip off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://revolutio_web;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_max_temp_file_size 0;

        proxy_read_timeout 10000;
        proxy_connect_timeout 1800;
        proxy_send_timeout 1800;
        send_timeout 1800;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        error_page 403 = /403/;
        error_page 404 = /404/;
        error_page 400 = /400/;
        error_page 500 = /500/;
        error_page 503 = /503/;
        error_page 502 = /502/;

        proxy_http_version 1.1;

        proxy_set_header Connection "";

        if ($request_method ~ ^(OPTIONS)$) {
          return 403;
        }

        if ($request_method !~ ^(GET|HEAD|POST)$) {
          return 405;
        }
      }
    }
