apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: myapp

data:

  nginx.conf: |
    #load_module modules/ngx_http_headers_more_filter_module.so;

    worker_processes auto;

    events {
      worker_connections 1024;
    }

    error_log /var/log/nginx/error.log info;
    pid /var/run/nginx.pid;

    http {

      server_tokens off;
      # Keep this commented unless headers-more module is available
      # more_set_headers "Server:Server";
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      include /etc/nginx/conf.d/*.conf;
      include /etc/nginx/conf.d/blockuseragents.rules;

      # Keep commented unless modules are required
      #include /etc/nginx/modules-enabled/*;

      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent [$connection_requests] "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

      access_log /var/log/nginx/access.log main;

      sendfile on;

      keepalive_timeout 10;

      gzip on;
      gzip_comp_level 2;
      gzip_min_length 1000;
      gzip_proxied any;
      gzip_proxied expired no-cache no-store private auth;

      gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/x-icon;

      # limit_conn_zone $binary_remote_addr zone=limitperip:10m;
      # limit_req_zone $binary_remote_addr zone=ratelimit:10m rate=5r/s;


      ############################################################
      # UPSTREAMS
      ############################################################

      upstream revolutio_web {
        server web:5000;
      }

      #upstream micro_dashboard_api {
      #  server dashboard-api:5002;
      #}

      #upstream micro_datahub_api {
      #  server kong:8002;
      #}

      #upstream datahub_api_upstream {
      #  server datahub-api:5003;
      #  keepalive 64;
      #}

      #upstream revolutio_dashboard {
      #  server dashboardapp:3002;
      #}

      #upstream revolutio_datahub {
      #  server datahubapp:3003;
      #}

      upstream revolutio_saml {
        server saml:9000;
      }


      ############################################################
      # SSL DISABLED FOR CURRENT PROJECT
      ############################################################

      # server {
      #   listen 80;
      #   return 301 https://$host$request_uri;
      # }


      ############################################################
      # MAIN SERVER
      ############################################################

      server {

        if ($blockedagent) {
          return 403;
        }

        # SSL disabled
        # listen 443 ssl;
        listen 8080;

        # SSL CONFIGURATION DISABLED
        #
        # ssl_certificate /etc/ssl/ssl.crt;
        # ssl_certificate_key /etc/ssl/ssl.key;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_session_timeout 1d;
        # ssl_session_cache shared:MozSSL:10m;
        # ssl_session_tickets off;
        # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
        # ssl_prefer_server_ciphers off;


        ########################################################
        # SECURITY HEADERS
        ########################################################

        add_header X-XSS-Protection "1; mode=block";

        add_header X-Frame-Options "SAMEORIGIN";

        add_header X-Content-Type-Options "nosniff";

        # This header is normally used with HTTPS.
        # Keeping it commented while SSL is disabled.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

        add_header Referrer-Policy "no-referrer-when-downgrade";
        add_header Cache-Control "no-cache, no-store";
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header 'Permissions-Policy' 'camera=(), geolocation=(), microphone=()';
        add_header 'Cross-Origin-Embedder-Policy' 'require-corp';
        add_header 'Cross-Origin-Opener-Policy' 'same-origin';
        add_header Cross-Origin-Resource-Policy 'same-origin' always;
        # CSP from working project
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; connect-src 'self';";

        ########################################################
        # CLIENT / UPLOAD BUFFER SETTINGS
        ########################################################

        client_max_body_size 500M;
        client_body_buffer_size 500M;
        client_header_buffer_size 500M;
        client_body_timeout 10;
        client_header_timeout 10;
        large_client_header_buffers 2 600M;

        ########################################################
        # MIME
        ########################################################
        include /etc/nginx/mime.types;
        types {
          application/javascript mjs;
        }
        ########################################################
        # STATIC
        ########################################################
        #location /static/ {
        #  alias /var/www/revolutio/static/;
        #  error_page 403 = /403/;
        #  error_page 404 = /404/;
        #  error_page 400 = /403/;
        #  error_page 500 = /500/;
        #  error_page 503 = /503/;
        #  error_page 502 = /502/;
        #}
        ########################################################
        # MEDIA
        ########################################################

        location /media/ {
          alias /var/www/revolutio/media/;
          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /403/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
        }

        ########################################################
        # ASSET
        ########################################################

        location /asset/ {
          alias /var/www/asset/;
          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /403/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
        }

        ########################################################
        # WEBSOCKET
        ########################################################

        location /ws/ {
          proxy_pass http://revolutio_web;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
        }

        ########################################################
        # DASHBOARD API
        ########################################################

        #location /dashboard-api/ {
        #  proxy_pass http://micro_dashboard_api;
        #  proxy_set_header Host $http_host;
        #  proxy_set_header X-Real-IP $remote_addr;
        #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #  proxy_set_header X-Forwarded-Proto $scheme;
        #  proxy_hide_header X-Powered-By;
        #  proxy_hide_header Server;
        #  proxy_max_temp_file_size 0;
        #}

        ########################################################
        # DATAHUB API WEBSOCKET
        ########################################################

        #location /datahub-api/ws/ {
        #  proxy_pass http://datahub_api_upstream;
        #  proxy_http_version 1.1;
        #  proxy_set_header Upgrade $http_upgrade;
        #  proxy_set_header Connection "Upgrade";
        #  proxy_set_header Host $http_host;
        #}

        ########################################################
        # DATAHUB API
        ########################################################

        #location /datahub-api/ {
        #  proxy_pass http://micro_datahub_api;
        #  proxy_set_header Host $http_host;
        #  proxy_set_header X-Real-IP $remote_addr;
        #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #  proxy_set_header X-Forwarded-Proto $scheme;
        #  proxy_hide_header X-Powered-By;
        #  proxy_hide_header Server;
        #  proxy_max_temp_file_size 0;
        #}

        ########################################################
        # DASHBOARD
        ########################################################

        #location /dashboard/ {
        #  proxy_pass http://revolutio_dashboard;
        #  proxy_set_header Connection keep-alive;
        #  proxy_set_header Host $http_host;
        #  proxy_set_header X-Real-IP $remote_addr;
        #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #  proxy_set_header X-Forwarded-Proto $scheme;
        #  proxy_hide_header X-Powered-By;
        #  proxy_hide_header Server;
        #  proxy_max_temp_file_size 0;
        #}

        ########################################################
        # DATAHUB
        ########################################################

        #location ^~ /datahub/ {
        #  proxy_pass http://revolutio_datahub/datahub/;
        #  proxy_http_version 1.1;
        #  proxy_set_header Host $host;
        #  proxy_set_header X-Real-IP $remote_addr;
        #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #  proxy_set_header X-Forwarded-Proto $scheme;
        #}

        ########################################################
        # DATAHUB ASSETS
        ########################################################
        #location ^~ /datahub/assets/ {
        #  proxy_pass http://revolutio_datahub/datahub/assets/;
        #  proxy_http_version 1.1;
        #  proxy_buffering off;
        #  proxy_request_buffering off;
        #  gzip off;
        #  proxy_set_header Host $host;
        #  proxy_set_header X-Real-IP $remote_addr;
        #  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #  proxy_set_header X-Forwarded-Proto $scheme;
        #}

        ########################################################
        # SAML
        ########################################################

        location /accounts/saml/ {
          proxy_pass http://revolutio_saml;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Cookie $http_cookie;
          proxy_redirect off;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 1800;
          proxy_connect_timeout 1800;
          proxy_send_timeout 1800;
          proxy_hide_header X-Powered-By;
          proxy_hide_header Server;
          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
        }

        ########################################################
        # MAIN APPLICATION
        ########################################################

        location / {
          proxy_pass http://revolutio_web;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          ######################################################
          # UPLOAD / REQUEST HANDLING
          ######################################################
          proxy_request_buffering off;
          proxy_buffering off;
          proxy_max_temp_file_size 0;

          ######################################################
          # TIMEOUTS
          ######################################################

          proxy_read_timeout 10000;
          proxy_connect_timeout 1800;
          proxy_send_timeout 1800;
          send_timeout 1800;

          ######################################################
          # COOKIE
          ######################################################

          # SSL is disabled, but keeping this aligned with
          # the working configuration.
          #proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=strict";

          ######################################################
          # SECURITY
          ######################################################

          proxy_hide_header X-Powered-By;
          proxy_hide_header Server;

          ######################################################
          # ERROR PAGES
          ######################################################
          error_page 403 = /403/;
          error_page 404 = /404/;
          error_page 400 = /400/;
          error_page 500 = /500/;
          error_page 503 = /503/;
          error_page 502 = /502/;
          ######################################################
          # HTTP METHODS
          ######################################################
          if ($request_method ~ ^(OPTIONS)$) {
            return 403;
          }
          if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
          }
        }

      }
    }

  mime.types: |
    types {
      text/html html htm shtml;
      text/css css;
      text/xml xml;
      image/gif gif;
      image/jpeg jpeg jpg;
      application/javascript js;
      application/json json;
      image/png png;
      image/svg+xml svg;
    }


  blockuseragents.rules: |
    map $http_user_agent $blockedagent {
      default 0;
      ~*malicious 1;
      ~*bot 1;
      ~*backdoor 1;
      ~*crawler 1;
      ~*bandit 1;
    }
