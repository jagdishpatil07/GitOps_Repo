    - 1\r\n#max_pred_locks_per_page = 2            # min 0\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    VERSION AND PLATFORM COMPATIBILITY\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Previous PostgreSQL Versions -\r\n\r\n#array_nulls = on\r\n#backslash_quote
