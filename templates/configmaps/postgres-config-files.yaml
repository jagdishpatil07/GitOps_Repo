apiVersion: v1
data:
  pg_hba.conf: "# PostgreSQL Client Authentication Configuration File\r\n# ===================================================\r\n#\r\n#
    Refer to the \"Client Authentication\" section in the PostgreSQL\r\n# documentation
    for a complete description of this file.  A short\r\n# synopsis follows.\r\n#\r\n#
    This file controls: which hosts are allowed to connect, how clients\r\n# are authenticated,
    which PostgreSQL user names they can use, which\r\n# databases they can access.
    \ Records take one of these forms:\r\n#\r\n# local         DATABASE  USER  METHOD
    \ [OPTIONS]\r\n# host          DATABASE  USER  ADDRESS  METHOD  [OPTIONS]\r\n#
    hostssl       DATABASE  USER  ADDRESS  METHOD  [OPTIONS]\r\n# hostnossl     DATABASE
    \ USER  ADDRESS  METHOD  [OPTIONS]\r\n# hostgssenc    DATABASE  USER  ADDRESS
    \ METHOD  [OPTIONS]\r\n# hostnogssenc  DATABASE  USER  ADDRESS  METHOD  [OPTIONS]\r\n#\r\n#
    (The uppercase items must be replaced by actual values.)\r\n#\r\n# The first field
    is the connection type:\r\n# - \"local\" is a Unix-domain socket\r\n# - \"host\"
    is a TCP/IP socket (encrypted or not)\r\n# - \"hostssl\" is a TCP/IP socket that
    is SSL-encrypted\r\n# - \"hostnossl\" is a TCP/IP socket that is not SSL-encrypted\r\n#
    - \"hostgssenc\" is a TCP/IP socket that is GSSAPI-encrypted\r\n# - \"hostnogssenc\"
    is a TCP/IP socket that is not GSSAPI-encrypted\r\n#\r\n# DATABASE can be \"all\",
    \"sameuser\", \"samerole\", \"replication\", a\r\n# database name, or a comma-separated
    list thereof. The \"all\"\r\n# keyword does not match \"replication\". Access
    to replication\r\n# must be enabled in a separate record (see example below).\r\n#\r\n#
    USER can be \"all\", a user name, a group name prefixed with \"+\", or a\r\n#
    comma-separated list thereof.  In both the DATABASE and USER fields\r\n# you can
    also write a file name prefixed with \"@\" to include names\r\n# from a separate
    file.\r\n#\r\n# ADDRESS specifies the set of hosts the record matches.  It can
    be a\r\n# host name, or it is made up of an IP address and a CIDR mask that is\r\n#
    an integer (between 0 and 32 (IPv4) or 128 (IPv6) inclusive) that\r\n# specifies
    the number of significant bits in the mask.  A host name\r\n# that starts with
    a dot (.) matches a suffix of the actual host name.\r\n# Alternatively, you can
    write an IP address and netmask in separate\r\n# columns to specify the set of
    hosts.  Instead of a CIDR-address, you\r\n# can write \"samehost\" to match any
    of the server's own IP addresses,\r\n# or \"samenet\" to match any address in
    any subnet that the server is\r\n# directly connected to.\r\n#\r\n# METHOD can
    be \"trust\", \"reject\", \"md5\", \"password\", \"scram-sha-256\",\r\n# \"gss\",
    \"sspi\", \"ident\", \"peer\", \"pam\", \"ldap\", \"radius\" or \"cert\".\r\n#
    Note that \"password\" sends passwords in clear text; \"md5\" or\r\n# \"scram-sha-256\"
    are preferred since they send encrypted passwords.\r\n#\r\n# OPTIONS are a set
    of options for the authentication in the format\r\n# NAME=VALUE.  The available
    options depend on the different\r\n# authentication methods -- refer to the \"Client
    Authentication\"\r\n# section in the documentation for a list of which options
    are\r\n# available for which authentication methods.\r\n#\r\n# Database and user
    names containing spaces, commas, quotes and other\r\n# special characters must
    be quoted.  Quoting one of the keywords\r\n# \"all\", \"sameuser\", \"samerole\"
    or \"replication\" makes the name lose\r\n# its special character, and just match
    a database or username with\r\n# that name.\r\n#\r\n# This file is read on server
    startup and when the server receives a\r\n# SIGHUP signal.  If you edit the file
    on a running system, you have to\r\n# SIGHUP the server for the changes to take
    effect, run \"pg_ctl reload\",\r\n# or execute \"SELECT pg_reload_conf()\".\r\n#\r\n#
    Put your actual configuration here\r\n# ----------------------------------\r\n#\r\n#
    If you want to allow non-local connections, you need to add more\r\n# \"host\"
    records.  In that case you will also need to make PostgreSQL\r\n# listen on a
    non-local interface via the listen_addresses\r\n# configuration parameter, or
    via the -i or -h command line switches.\r\n\r\n# CAUTION: Configuring the system
    for local \"trust\" authentication\r\n# allows any local user to connect as any
    PostgreSQL user, including\r\n# the database superuser.  If you do not trust all
    your local users,\r\n# use another authentication method.\r\n\r\n\r\n# TYPE  DATABASE
    \       USER            ADDRESS                 METHOD\r\n\r\n# \"local\" is for
    Unix domain socket connections only\r\nlocal   all             all                                     trust\r\n#
    IPv4 local connections:\r\nhost    all             all             127.0.0.1/32
    \           trust\r\n# IPv6 local connections:\r\nhost    all             all
    \            ::1/128                 trust\r\n# Allow replication connections
    from localhost, by a user with the\r\n# replication privilege.\r\nlocal   replication
    \    all                                     trust\r\nhost    replication     all
    \            127.0.0.1/32            trust\r\nhost    replication     all             ::1/128
    \                trust\r\n\r\nhost all all all trust\r\n"
  postgresql.conf: "# -----------------------------\r\n# PostgreSQL configuration
    file\r\n# -----------------------------\r\n#\r\n# This file consists of lines
    of the form:\r\n#\r\n#   name = value\r\n#\r\n# (The \"=\" is optional.)  Whitespace
    may be used.  Comments are introduced with\r\n# \"#\" anywhere on a line.  The
    complete list of parameter names and allowed\r\n# values can be found in the PostgreSQL
    documentation.\r\n#\r\n# The commented-out settings shown in this file represent
    the default values.\r\n# Re-commenting a setting is NOT sufficient to revert it
    to the default value;\r\n# you need to reload the server.\r\n#\r\n# This file
    is read on server startup and when the server receives a SIGHUP\r\n# signal.  If
    you edit the file on a running system, you have to SIGHUP the\r\n# server for
    the changes to take effect, run \"pg_ctl reload\", or execute\r\n# \"SELECT pg_reload_conf()\".
    \ Some parameters, which are marked below,\r\n# require a server shutdown and
    restart to take effect.\r\n#\r\n# Any parameter can also be given as a command-line
    option to the server, e.g.,\r\n# \"postgres -c log_connections=on\".  Some parameters
    can be changed at run time\r\n# with the \"SET\" SQL command.\r\n#\r\n# Memory
    units:  kB = kilobytes        Time units:  ms  = milliseconds\r\n#                MB
    = megabytes                     s   = seconds\r\n#                GB = gigabytes
    \                    min = minutes\r\n#                TB = terabytes                     h
    \  = hours\r\n#                                                   d   = days\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    FILE LOCATIONS\r\n#------------------------------------------------------------------------------\r\n\r\n#
    The default values of these variables are driven from the -D command-line\r\n#
    option or PGDATA environment variable, represented here as ConfigDir.\r\n\r\n#data_directory
    = 'ConfigDir'\t\t# use data in another directory\r\n\t\t\t\t\t# (change requires
    restart)\r\n#hba_file = 'ConfigDir/pg_hba.conf'\t# host-based authentication file\r\n\t\t\t\t\t#
    (change requires restart)\r\n#ident_file = 'ConfigDir/pg_ident.conf'\t# ident
    configuration file\r\n\t\t\t\t\t# (change requires restart)\r\n\r\n# If external_pid_file
    is not explicitly set, no extra PID file is written.\r\n#external_pid_file = ''\t\t\t#
    write an extra PID file\r\n\t\t\t\t\t# (change requires restart)\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    CONNECTIONS AND AUTHENTICATION\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Connection Settings -\r\n\r\nlisten_addresses = '*'\r\n\t\t\t\t\t# comma-separated
    list of addresses;\r\n\t\t\t\t\t# defaults to 'localhost'; use '*' for all\r\n\t\t\t\t\t#
    (change requires restart)\r\n#port = 5432\t\t\t\t# (change requires restart)\r\nmax_connections
    = 500\t\t\t# (change requires restart)\r\n#superuser_reserved_connections = 3\t#
    (change requires restart)\r\n#unix_socket_directories = '/var/run/postgresql'\t#
    comma-separated list of directories\r\n\t\t\t\t\t# (change requires restart)\r\n#unix_socket_group
    = ''\t\t\t# (change requires restart)\r\n#unix_socket_permissions = 0777\t\t#
    begin with 0 to use octal notation\r\n\t\t\t\t\t# (change requires restart)\r\n#bonjour
    = off\t\t\t\t# advertise server via Bonjour\r\n\t\t\t\t\t# (change requires restart)\r\n#bonjour_name
    = ''\t\t\t# defaults to the computer name\r\n\t\t\t\t\t# (change requires restart)\r\n\r\n#
    - TCP settings -\r\n# see \"man 7 tcp\" for details\r\n\r\n#tcp_keepalives_idle
    = 0\t\t# TCP_KEEPIDLE, in seconds;\r\n\t\t\t\t\t# 0 selects the system default\r\n#tcp_keepalives_interval
    = 0\t\t# TCP_KEEPINTVL, in seconds;\r\n\t\t\t\t\t# 0 selects the system default\r\n#tcp_keepalives_count
    = 0\t\t# TCP_KEEPCNT;\r\n\t\t\t\t\t# 0 selects the system default\r\n#tcp_user_timeout
    = 0\t\t\t# TCP_USER_TIMEOUT, in milliseconds;\r\n\t\t\t\t\t# 0 selects the system
    default\r\n\r\n# - Authentication -\r\n\r\n#authentication_timeout = 1min\t\t#
    1s-600s\r\n#password_encryption = md5\t\t# md5 or scram-sha-256\r\n#db_user_namespace
    = off\r\n\r\n# GSSAPI using Kerberos\r\n#krb_server_keyfile = ''\r\n#krb_caseins_users
    = off\r\n\r\n# - SSL -\r\n\r\n#ssl = off\r\n#ssl_ca_file = ''\r\n#ssl_cert_file
    = 'server.crt'\r\n#ssl_crl_file = ''\r\n#ssl_key_file = 'server.key'\r\n#ssl_ciphers
    = 'HIGH:MEDIUM:+3DES:!aNULL' # allowed SSL ciphers\r\n#ssl_prefer_server_ciphers
    = on\r\n#ssl_ecdh_curve = 'prime256v1'\r\n#ssl_min_protocol_version = 'TLSv1'\r\n#ssl_max_protocol_version
    = ''\r\n#ssl_dh_params_file = ''\r\n#ssl_passphrase_command = ''\r\n#ssl_passphrase_command_supports_reload
    = off\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    RESOURCE USAGE (except WAL)\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Memory -\r\n\r\nshared_buffers = 128MB\t\t\t# min 128kB\r\n\t\t\t\t\t# (change
    requires restart)\r\n#huge_pages = try\t\t\t# on, off, or try\r\n\t\t\t\t\t# (change
    requires restart)\r\n#temp_buffers = 8MB\t\t\t# min 800kB\r\n#max_prepared_transactions
    = 0\t\t# zero disables the feature\r\n\t\t\t\t\t# (change requires restart)\r\n#
    Caution: it is not advisable to set max_prepared_transactions nonzero unless\r\n#
    you actively intend to use prepared transactions.\r\n#work_mem = 4MB\t\t\t\t#
    min 64kB\r\n#maintenance_work_mem = 64MB\t\t# min 1MB\r\n#autovacuum_work_mem
    = -1\t\t# min 1MB, or -1 to use maintenance_work_mem\r\n#max_stack_depth = 2MB\t\t\t#
    min 100kB\r\n#shared_memory_type = mmap\t\t# the default is the first option\r\n\t\t\t\t\t#
    supported by the operating system:\r\n\t\t\t\t\t#   mmap\r\n\t\t\t\t\t#   sysv\r\n\t\t\t\t\t#
    \  windows\r\n\t\t\t\t\t# (change requires restart)\r\ndynamic_shared_memory_type
    = posix\t# the default is the first option\r\n\t\t\t\t\t# supported by the operating
    system:\r\n\t\t\t\t\t#   posix\r\n\t\t\t\t\t#   sysv\r\n\t\t\t\t\t#   windows\r\n\t\t\t\t\t#
    \  mmap\r\n\t\t\t\t\t# (change requires restart)\r\n\r\n# - Disk -\r\n\r\n#temp_file_limit
    = -1\t\t\t# limits per-process temp file space\r\n\t\t\t\t\t# in kB, or -1 for
    no limit\r\n\r\n# - Kernel Resources -\r\n\r\n#max_files_per_process = 1000\t\t#
    min 25\r\n\t\t\t\t\t# (change requires restart)\r\n\r\n# - Cost-Based Vacuum Delay
    -\r\n\r\n#vacuum_cost_delay = 0\t\t\t# 0-100 milliseconds (0 disables)\r\n#vacuum_cost_page_hit
    = 1\t\t# 0-10000 credits\r\n#vacuum_cost_page_miss = 10\t\t# 0-10000 credits\r\n#vacuum_cost_page_dirty
    = 20\t\t# 0-10000 credits\r\n#vacuum_cost_limit = 200\t\t# 1-10000 credits\r\n\r\n#
    - Background Writer -\r\n\r\n#bgwriter_delay = 200ms\t\t\t# 10-10000ms between
    rounds\r\n#bgwriter_lru_maxpages = 100\t\t# max buffers written/round, 0 disables\r\n#bgwriter_lru_multiplier
    = 2.0\t\t# 0-10.0 multiplier on buffers scanned/round\r\n#bgwriter_flush_after
    = 512kB\t\t# measured in pages, 0 disables\r\n\r\n# - Asynchronous Behavior -\r\n\r\n#effective_io_concurrency
    = 1\t\t# 1-1000; 0 disables prefetching\r\n#max_worker_processes = 8\t\t# (change
    requires restart)\r\n#max_parallel_maintenance_workers = 2\t# taken from max_parallel_workers\r\n#max_parallel_workers_per_gather
    = 2\t# taken from max_parallel_workers\r\n#parallel_leader_participation = on\r\n#max_parallel_workers
    = 8\t\t# maximum number of max_worker_processes that\r\n\t\t\t\t\t# can be used
    in parallel operations\r\n#old_snapshot_threshold = -1\t\t# 1min-60d; -1 disables;
    0 is immediate\r\n\t\t\t\t\t# (change requires restart)\r\n#backend_flush_after
    = 0\t\t# measured in pages, 0 disables\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    WRITE-AHEAD LOG\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Settings -\r\n\r\n#wal_level = replica\t\t\t# minimal, replica, or logical\r\n\t\t\t\t\t#
    (change requires restart)\r\n#fsync = on\t\t\t\t# flush data to disk for crash
    safety\r\n\t\t\t\t\t# (turning this off can cause\r\n\t\t\t\t\t# unrecoverable
    data corruption)\r\n#synchronous_commit = on\t\t# synchronization level;\r\n\t\t\t\t\t#
    off, local, remote_write, remote_apply, or on\r\n#wal_sync_method = fsync\t\t#
    the default is the first option\r\n\t\t\t\t\t# supported by the operating system:\r\n\t\t\t\t\t#
    \  open_datasync\r\n\t\t\t\t\t#   fdatasync (default on Linux)\r\n\t\t\t\t\t#
    \  fsync\r\n\t\t\t\t\t#   fsync_writethrough\r\n\t\t\t\t\t#   open_sync\r\n#full_page_writes
    = on\t\t\t# recover from partial page writes\r\n#wal_compression = off\t\t\t#
    enable compression of full-page writes\r\n#wal_log_hints = off\t\t\t# also do
    full page writes of non-critical updates\r\n\t\t\t\t\t# (change requires restart)\r\n#wal_init_zero
    = on\t\t\t# zero-fill new WAL files\r\n#wal_recycle = on\t\t\t# recycle WAL files\r\n#wal_buffers
    = -1\t\t\t# min 32kB, -1 sets based on shared_buffers\r\n\t\t\t\t\t# (change requires
    restart)\r\n#wal_writer_delay = 200ms\t\t# 1-10000 milliseconds\r\n#wal_writer_flush_after
    = 1MB\t\t# measured in pages, 0 disables\r\n\r\n#commit_delay = 0\t\t\t# range
    0-100000, in microseconds\r\n#commit_siblings = 5\t\t\t# range 1-1000\r\n\r\n#
    - Checkpoints -\r\n\r\n#checkpoint_timeout = 5min\t\t# range 30s-1d\r\nmax_wal_size
    = 1GB\r\nmin_wal_size = 80MB\r\n#checkpoint_completion_target = 0.5\t# checkpoint
    target duration, 0.0 - 1.0\r\n#checkpoint_flush_after = 256kB\t\t# measured in
    pages, 0 disables\r\n#checkpoint_warning = 30s\t\t# 0 disables\r\n\r\n# - Archiving
    -\r\n\r\n#archive_mode = off\t\t# enables archiving; off, on, or always\r\n\t\t\t\t#
    (change requires restart)\r\n#archive_command = ''\t\t# command to use to archive
    a logfile segment\r\n\t\t\t\t# placeholders: %p = path of file to archive\r\n\t\t\t\t#
    \              %f = file name only\r\n\t\t\t\t# e.g. 'test ! -f /mnt/server/archivedir/%f
    && cp %p /mnt/server/archivedir/%f'\r\n#archive_timeout = 0\t\t# force a logfile
    segment switch after this\r\n\t\t\t\t# number of seconds; 0 disables\r\n\r\n#
    - Archive Recovery -\r\n\r\n# These are only used in recovery mode.\r\n\r\n#restore_command
    = ''\t\t# command to use to restore an archived logfile segment\r\n\t\t\t\t# placeholders:
    %p = path of file to restore\r\n\t\t\t\t#               %f = file name only\r\n\t\t\t\t#
    e.g. 'cp /mnt/server/archivedir/%f %p'\r\n\t\t\t\t# (change requires restart)\r\n#archive_cleanup_command
    = ''\t# command to execute at every restartpoint\r\n#recovery_end_command = ''\t#
    command to execute at completion of recovery\r\n\r\n# - Recovery Target -\r\n\r\n#
    Set these only when performing a targeted recovery.\r\n\r\n#recovery_target =
    ''\t\t# 'immediate' to end recovery as soon as a\r\n                                #
    consistent state is reached\r\n\t\t\t\t# (change requires restart)\r\n#recovery_target_name
    = ''\t# the named restore point to which recovery will proceed\r\n\t\t\t\t# (change
    requires restart)\r\n#recovery_target_time = ''\t# the time stamp up to which
    recovery will proceed\r\n\t\t\t\t# (change requires restart)\r\n#recovery_target_xid
    = ''\t# the transaction ID up to which recovery will proceed\r\n\t\t\t\t# (change
    requires restart)\r\n#recovery_target_lsn = ''\t# the WAL LSN up to which recovery
    will proceed\r\n\t\t\t\t# (change requires restart)\r\n#recovery_target_inclusive
    = on # Specifies whether to stop:\r\n\t\t\t\t# just after the specified recovery
    target (on)\r\n\t\t\t\t# just before the recovery target (off)\r\n\t\t\t\t# (change
    requires restart)\r\n#recovery_target_timeline = 'latest'\t# 'current', 'latest',
    or timeline ID\r\n\t\t\t\t# (change requires restart)\r\n#recovery_target_action
    = 'pause'\t# 'pause', 'promote', 'shutdown'\r\n\t\t\t\t# (change requires restart)\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    REPLICATION\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Sending Servers -\r\n\r\n# Set these on the master and on any standby that will
    send replication data.\r\n\r\n#max_wal_senders = 10\t\t# max number of walsender
    processes\r\n\t\t\t\t# (change requires restart)\r\n#wal_keep_segments = 0\t\t#
    in logfile segments; 0 disables\r\n#wal_sender_timeout = 60s\t# in milliseconds;
    0 disables\r\n\r\n#max_replication_slots = 10\t# max number of replication slots\r\n\t\t\t\t#
    (change requires restart)\r\n#track_commit_timestamp = off\t# collect timestamp
    of transaction commit\r\n\t\t\t\t# (change requires restart)\r\n\r\n# - Master
    Server -\r\n\r\n# These settings are ignored on a standby server.\r\n\r\n#synchronous_standby_names
    = ''\t# standby servers that provide sync rep\r\n\t\t\t\t# method to choose sync
    standbys, number of sync standbys,\r\n\t\t\t\t# and comma-separated list of application_name\r\n\t\t\t\t#
    from standby(s); '*' = all\r\n#vacuum_defer_cleanup_age = 0\t# number of xacts
    by which cleanup is delayed\r\n\r\n# - Standby Servers -\r\n\r\n# These settings
    are ignored on a master server.\r\n\r\n#primary_conninfo = ''\t\t\t# connection
    string to sending server\r\n\t\t\t\t\t# (change requires restart)\r\n#primary_slot_name
    = ''\t\t\t# replication slot on sending server\r\n\t\t\t\t\t# (change requires
    restart)\r\n#promote_trigger_file = ''\t\t# file name whose presence ends recovery\r\n#hot_standby
    = on\t\t\t# \"off\" disallows queries during recovery\r\n\t\t\t\t\t# (change requires
    restart)\r\n#max_standby_archive_delay = 30s\t# max delay before canceling queries\r\n\t\t\t\t\t#
    when reading WAL from archive;\r\n\t\t\t\t\t# -1 allows indefinite delay\r\n#max_standby_streaming_delay
    = 30s\t# max delay before canceling queries\r\n\t\t\t\t\t# when reading streaming
    WAL;\r\n\t\t\t\t\t# -1 allows indefinite delay\r\n#wal_receiver_status_interval
    = 10s\t# send replies at least this often\r\n\t\t\t\t\t# 0 disables\r\n#hot_standby_feedback
    = off\t\t# send info from standby to prevent\r\n\t\t\t\t\t# query conflicts\r\n#wal_receiver_timeout
    = 60s\t\t# time that receiver waits for\r\n\t\t\t\t\t# communication from master\r\n\t\t\t\t\t#
    in milliseconds; 0 disables\r\n#wal_retrieve_retry_interval = 5s\t# time to wait
    before retrying to\r\n\t\t\t\t\t# retrieve WAL after a failed attempt\r\n#recovery_min_apply_delay
    = 0\t\t# minimum delay for applying changes during recovery\r\n\r\n# - Subscribers
    -\r\n\r\n# These settings are ignored on a publisher.\r\n\r\n#max_logical_replication_workers
    = 4\t# taken from max_worker_processes\r\n\t\t\t\t\t# (change requires restart)\r\n#max_sync_workers_per_subscription
    = 2\t# taken from max_logical_replication_workers\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    QUERY TUNING\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Planner Method Configuration -\r\n\r\n#enable_bitmapscan = on\r\n#enable_hashagg
    = on\r\n#enable_hashjoin = on\r\n#enable_indexscan = on\r\n#enable_indexonlyscan
    = on\r\n#enable_material = on\r\n#enable_mergejoin = on\r\n#enable_nestloop =
    on\r\n#enable_parallel_append = on\r\n#enable_seqscan = on\r\n#enable_sort = on\r\n#enable_tidscan
    = on\r\n#enable_partitionwise_join = off\r\n#enable_partitionwise_aggregate =
    off\r\n#enable_parallel_hash = on\r\n#enable_partition_pruning = on\r\n\r\n# -
    Planner Cost Constants -\r\n\r\n#seq_page_cost = 1.0\t\t\t# measured on an arbitrary
    scale\r\n#random_page_cost = 4.0\t\t\t# same scale as above\r\n#cpu_tuple_cost
    = 0.01\t\t\t# same scale as above\r\n#cpu_index_tuple_cost = 0.005\t\t# same scale
    as above\r\n#cpu_operator_cost = 0.0025\t\t# same scale as above\r\n#parallel_tuple_cost
    = 0.1\t\t# same scale as above\r\n#parallel_setup_cost = 1000.0\t# same scale
    as above\r\n\r\n#jit_above_cost = 100000\t\t# perform JIT compilation if available\r\n\t\t\t\t\t#
    and query more expensive than this;\r\n\t\t\t\t\t# -1 disables\r\n#jit_inline_above_cost
    = 500000\t\t# inline small functions if query is\r\n\t\t\t\t\t# more expensive
    than this; -1 disables\r\n#jit_optimize_above_cost = 500000\t# use expensive JIT
    optimizations if\r\n\t\t\t\t\t# query is more expensive than this;\r\n\t\t\t\t\t#
    -1 disables\r\n\r\n#min_parallel_table_scan_size = 8MB\r\n#min_parallel_index_scan_size
    = 512kB\r\n#effective_cache_size = 4GB\r\n\r\n# - Genetic Query Optimizer -\r\n\r\n#geqo
    = on\r\n#geqo_threshold = 12\r\n#geqo_effort = 5\t\t\t# range 1-10\r\n#geqo_pool_size
    = 0\t\t\t# selects default based on effort\r\n#geqo_generations = 0\t\t\t# selects
    default based on effort\r\n#geqo_selection_bias = 2.0\t\t# range 1.5-2.0\r\n#geqo_seed
    = 0.0\t\t\t# range 0.0-1.0\r\n\r\n# - Other Planner Options -\r\n\r\n#default_statistics_target
    = 100\t# range 1-10000\r\n#constraint_exclusion = partition\t# on, off, or partition\r\n#cursor_tuple_fraction
    = 0.1\t\t# range 0.0-1.0\r\n#from_collapse_limit = 8\r\n#join_collapse_limit =
    8\t\t# 1 disables collapsing of explicit\r\n\t\t\t\t\t# JOIN clauses\r\n#force_parallel_mode
    = off\r\n#jit = on\t\t\t\t# allow JIT compilation\r\n#plan_cache_mode = auto\t\t\t#
    auto, force_generic_plan or\r\n\t\t\t\t\t# force_custom_plan\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    REPORTING AND LOGGING\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Where to Log -\r\n\r\nlog_destination = 'stderr'\t\t# Valid values are combinations
    of\r\n\t\t\t\t\t# stderr, csvlog, syslog, and eventlog,\r\n\t\t\t\t\t# depending
    on platform.  csvlog\r\n\t\t\t\t\t# requires logging_collector to be on.\r\n\r\n#
    This is used when logging to stderr:\r\nlogging_collector = off\t\t# Enable capturing
    of stderr and csvlog\r\n\t\t\t\t\t# into log files. Required to be on for\r\n\t\t\t\t\t#
    csvlogs.\r\n\t\t\t\t\t# (change requires restart)\r\n\r\n# These are only used
    if logging_collector is on:\r\nlog_directory = 'log'\t\t\t# directory where log
    files are written,\r\n\t\t\t\t\t# can be absolute or relative to PGDATA\r\n#log_filename
    = 'postgresql-%Y-%m-%d_%H%M%S.log'\t# log file name pattern,\r\n\t\t\t\t\t# can
    include strftime() escapes\r\n#log_file_mode = 0600\t\t\t# creation mode for log
    files,\r\n\t\t\t\t\t# begin with 0 to use octal notation\r\nlog_truncate_on_rotation
    = off\t\t# If on, an existing log file with the\r\n\t\t\t\t\t# same name as the
