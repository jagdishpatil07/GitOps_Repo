    = on\r\n#synchronize_seqscans = on\r\n\r\n# - Other Platforms and Clients -\r\n\r\n#transform_null_equals
    = off\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    ERROR HANDLING\r\n#------------------------------------------------------------------------------\r\n\r\n#exit_on_error
    = off\t\t\t# terminate session on any error?\r\n#restart_after_crash = on\t\t#
