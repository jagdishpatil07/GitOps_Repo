    But such truncation only occurs on\r\n\t\t\t\t\t# time-driven rotation, not on
    restarts\r\n\t\t\t\t\t# or size-driven rotation.  Default is\r\n\t\t\t\t\t# off,
    meaning append to existing files\r\n\t\t\t\t\t# in all cases.\r\nlog_rotation_age
    = 1d\t\t\t# Automatic rotation of logfiles will\r\n\t\t\t\t\t# happen after that
    time.  0 disables.\r\n#log_rotation_size = 10MB\t\t# Automatic rotation of logfiles
    will\r\n\t\t\t\t\t# happen after that much log output.\r\n\t\t\t\t\t# 0 disables.\r\n\r\n#
    These are relevant when logging to syslog:\r\n#syslog_facility = 'LOCAL0'\r\n#syslog_ident
    = 'postgres'\r\n#syslog_sequence_numbers = on\r\n#syslog_split_messages = on\r\n\r\n#
    This is only relevant when logging to eventlog (win32):\r\n# (change requires
    restart)\r\n#event_source = 'PostgreSQL'\r\n\r\n# - When to Log -\r\n\r\n#log_min_messages
    = warning\t\t# values in order of decreasing detail:\r\n\t\t\t\t\t#   debug5\r\n\t\t\t\t\t#
    \  debug4\r\n\t\t\t\t\t#   debug3\r\n\t\t\t\t\t#   debug2\r\n\t\t\t\t\t#   debug1\r\n\t\t\t\t\t#
    \  info\r\n\t\t\t\t\t#   notice\r\n\t\t\t\t\t#   warning\r\n\t\t\t\t\t#   error\r\n\t\t\t\t\t#
    \  log\r\n\t\t\t\t\t#   fatal\r\n\t\t\t\t\t#   panic\r\n\r\n#log_min_error_statement
    = error\t# values in order of decreasing detail:\r\n\t\t\t\t\t#   debug5\r\n\t\t\t\t\t#
    \  debug4\r\n\t\t\t\t\t#   debug3\r\n\t\t\t\t\t#   debug2\r\n\t\t\t\t\t#   debug1\r\n\t\t\t\t\t#
    \  info\r\n\t\t\t\t\t#   notice\r\n\t\t\t\t\t#   warning\r\n\t\t\t\t\t#   error\r\n\t\t\t\t\t#
    \  log\r\n\t\t\t\t\t#   fatal\r\n\t\t\t\t\t#   panic (effectively off)\r\n\r\n#log_min_duration_statement
    = -1\t# -1 is disabled, 0 logs all statements\r\n\t\t\t\t\t# and their durations,
    > 0 logs only\r\n\t\t\t\t\t# statements running at least this number\r\n\t\t\t\t\t#
    of milliseconds\r\n\r\n#log_transaction_sample_rate = 0.0\t# Fraction of transactions
    whose statements\r\n\t\t\t\t\t# are logged regardless of their duration. 1.0 logs
    all\r\n\t\t\t\t\t# statements from all transactions, 0.0 never logs.\r\n\r\n#
    - What to Log -\r\n\r\n#debug_print_parse = off\r\n#debug_print_rewritten = off\r\n#debug_print_plan
    = off\r\n#debug_pretty_print = on\r\n#log_checkpoints = off\r\n#log_connections
    = off\r\n#log_disconnections = off\r\n#log_duration = off\r\n#log_error_verbosity
