    \  %x = transaction ID (0 if none)\r\n\t\t\t\t\t#   %q = stop here in non-session\r\n\t\t\t\t\t#
    \       processes\r\n\t\t\t\t\t#   %% = '%'\r\n\t\t\t\t\t# e.g. '<%u%%%d> '\r\n#log_lock_waits
    = off\t\t\t# log lock waits >= deadlock_timeout\r\nlog_statement = 'all'\t\t\t#
    none, ddl, mod, all\r\n#log_replication_commands = off\r\n#log_temp_files = -1\t\t\t#
