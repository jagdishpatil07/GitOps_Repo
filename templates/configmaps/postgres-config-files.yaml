    'Etc/UTC'\r\n\r\n#------------------------------------------------------------------------------\r\n#
    PROCESS TITLE\r\n#------------------------------------------------------------------------------\r\n\r\n#cluster_name
    = ''\t\t\t# added to process titles if nonempty\r\n\t\t\t\t\t# (change requires
    restart)\r\n#update_process_title = on\r\n\r\n\r\n#------------------------------------------------------------------------------\r\n#
    STATISTICS\r\n#------------------------------------------------------------------------------\r\n\r\n#
    - Query and Index Statistics Collector -\r\n\r\n#track_activities = on\r\n#track_counts
    = on\r\n#track_io_timing = off\r\n#track_functions = none\t\t\t# none, pl, all\r\n#track_activity_query_size
