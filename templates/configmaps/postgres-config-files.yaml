    = '%m [%p] '\t\t# special values:\r\n\t\t\t\t\t#   %a = application name\r\n\t\t\t\t\t#
    \  %u = user name\r\n\t\t\t\t\t#   %d = database name\r\n\t\t\t\t\t#   %r = remote
    host and port\r\n\t\t\t\t\t#   %h = remote host\r\n\t\t\t\t\t#   %p = process
    ID\r\n\t\t\t\t\t#   %t = timestamp without milliseconds\r\n\t\t\t\t\t#   %m =
    timestamp with milliseconds\r\n\t\t\t\t\t#   %n = timestamp with milliseconds
    (as a Unix epoch)\r\n\t\t\t\t\t#   %i = command tag\r\n\t\t\t\t\t#   %e = SQL
    state\r\n\t\t\t\t\t#   %c = session ID\r\n\t\t\t\t\t#   %l = session line number\r\n\t\t\t\t\t#
