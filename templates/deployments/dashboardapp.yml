apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboardapp
  namespace: myapp
  labels:
    app: dashboardapp

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboardapp

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboardapp

    spec:
      imagePullSecrets:
        - name: acr-secret

      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboardapp

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3002
              protocol: TCP

          envFrom:
            - configMapRef:
                name: envs-production-web

            - secretRef:
                name: secrets-production-web

          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

      restartPolicy: Always
      dnsPolicy: ClusterFirst
