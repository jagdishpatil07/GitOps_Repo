apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboardapp
  namespace: myapp
  labels:
    app: dashboardapp

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboardapp

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboardapp

    spec:
      imagePullSecrets:
        - name: acr-secret

      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboardapp

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard:latest
          imagePullPolicy: Always

          # IMPORTANT:
          # Do NOT specify command/args here.
          # Allow the image's OpenBao entrypoint to run.

          ports:
            - name: http
              containerPort: 3002
              protocol: TCP

          env:
            - name: TZ
              value: "UTC"

            # OpenBao
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboardapp"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            # CHANGE THESE PATHS/KEYS IF YOUR OPENBAO
            # DASHBOARDAPP SECRETS ARE STORED DIFFERENTLY.
            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app"

          envFrom:
            - configMapRef:
                name: envs-production-web

          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: openbao-approle-dashboardapp
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

      volumes:
        - name: openbao-approle-dashboardapp
          persistentVolumeClaim:
            claimName: openbao-approle-dashboardapp-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      restartPolicy: Always
      dnsPolicy: ClusterFirst
