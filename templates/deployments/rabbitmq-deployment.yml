apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: myapp
spec:
  replicas: 1

  selector:
    matchLabels:
      app: rabbitmq

  template:
    metadata:
      labels:
        app: rabbitmq

    spec:
      containers:
      - name: rabbitmq
        image: revolutio.azurecr.io/revolutio_kubernetes/rabbitmq:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 5672

        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_DEFAULT_USER

        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_DEFAULT_PASS

        - name: RABBITMQ_ERLANG_COOKIE
          value: secretcookievalue

        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq

      volumes:
      - name: rabbitmq-storage
        persistentVolumeClaim:
          claimName: rabbitmq-pvc-1
