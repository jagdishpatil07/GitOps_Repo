# Inventory only. The existing OpenShift installation has no migrator ledger;
# applying Compose migrations here could record Docker-only work as completed.
# Review the output before creating a platform-specific migration release.
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-migrator-inventory
  namespace: myapp
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: platform-migrator-inventory
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: platform-migrator-inventory
          image: revolutio.azurecr.io/revolutio_kubernetes/platform-migrator:v0052.1
          imagePullPolicy: Always
          args: ["status"]
          volumeMounts:
            - name: scratch-state
              mountPath: /state
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: scratch-state
          emptyDir: {}
