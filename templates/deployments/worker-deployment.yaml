apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: {{ .Values.namespace }}
  labels:
    service: worker

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      service: worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: worker

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:

        # ==========================================================
        # Application storage
        # ==========================================================

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.worker.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.worker.pvc.media }}

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.worker.pvc.platformConfigs }}

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.worker.pvc.templates }}

        - name: computation-storage
          persistentVolumeClaim:
            claimName: {{ .Values.worker.pvc.computation }}

        # ==========================================================
        # OpenBao
        # ==========================================================

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ==========================================================
        # Docker tmpfs equivalents
        # ==========================================================

        - name: opt-temp
          emptyDir:
            medium: Memory
            sizeLimit: 1000Mi

        - name: app-logs
          emptyDir:
            medium: Memory
            sizeLimit: 1000Mi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1000Mi

      containers:

        - name: rqworker

          image: {{ .Values.worker.image }}
          imagePullPolicy: Always

          args:
            - /rqworker/start

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          env:

            # ========================================================
            # General
            # ========================================================

            - name: TZ
              value: "UTC"

            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: OPENBLAS_NUM_THREADS
              value: "1"

            - name: MKL_NUM_THREADS
              value: "1"

            - name: NUMEXPR_NUM_THREADS
              value: "1"

            - name: OMP_NUM_THREADS
              value: "1"

            - name: XDG_CACHE_HOME
              value: "/opt/temp"

            - name: WORKER_FORK_PER_JOB
              value: "0"

            - name: WORKER_PROCESSES
              value: "2"

            # ========================================================
            # OpenBao
            # ========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/revolutio-app/secret_id"

            - name: OPENBAO_SECRETS
              value: >-
                SECRET_KEY=django/secret_key,
                FERNET_SECRET=django/fernet_secret,
                DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,
                DJANGO_SUPERUSER_PASSWORD=django/superuser_password,
                REDIS_PASSWORD=cache/redis,
                KEYDB_PASSWORD=cache/keydb,
                POSTGRES_PASSWORD=postgres-core/platform_app

            - name: OPENBAO_URL_TEMPLATES
              value: >-
                REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,
                REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,
                REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379

            # ========================================================
            # Database
            # ========================================================

            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

          envFrom:
            - configMapRef:
                name: {{ .Values.worker.configMaps.web }}

            - configMapRef:
                name: {{ .Values.worker.configMaps.postgres }}

          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu | quote }}
              memory: {{ .Values.worker.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.worker.resources.limits.cpu | quote }}
              memory: {{ .Values.worker.resources.limits.memory | quote }}

          volumeMounts:

            # ========================================================
            # Application storage
            # ========================================================

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            # ========================================================
            # OpenBao
            # ========================================================

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # ========================================================
            # Docker tmpfs equivalents
            # ========================================================

            - name: opt-temp
              mountPath: /opt/temp

            - name: app-logs
              mountPath: /opt/revolutio/logs

            - name: tmp
              mountPath: /tmp

          # ==========================================================
          # Health checks
          # ==========================================================

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f custom-worker.py
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f custom-worker.py
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f custom-worker.py
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
