apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      imagePullSecrets:
        - name: acr-secret

      terminationGracePeriodSeconds: 30

      containers:
        - name: dashboard-api

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          # ==========================================================
          # APPLICATION CONFIG
          # ==========================================================

          envFrom:
            - configMapRef:
                name: envs-production-web

          env:
            - name: TZ
              value: "UTC"

            # ========================================================
            # OPENBAO
            # ========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/dashboard-api/secret_id"

            - name: OPENBAO_SECRETS
              value: "SECRET_KEY=django/secret_key,FERNET_SECRET=django/fernet_secret,POSTGRES_PASSWORD=postgres-core/platform_app,RABBITMQ_PASSWORD=rabbitmq/admin,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin,DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key"

            - name: OPENBAO_URL_TEMPLATES
              value: "RABBITMQ_URL=amqp://guest:$${RABBITMQ_PASSWORD}@rabbitmq:5672/,REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            # ========================================================
            # DASHBOARD APPLICATION
            # ========================================================

            - name: DATAHUB_API_BASE_URL
              value: "http://datahub-api:5003/datahub-api"

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          # ==========================================================
          # VOLUME MOUNTS
          # ==========================================================

          volumeMounts:

            # --------------------------------------------------------
            # OpenBao AppRole
            # --------------------------------------------------------

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            # --------------------------------------------------------
            # OpenBao TLS
            # --------------------------------------------------------

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # --------------------------------------------------------
            # Application storage
            # --------------------------------------------------------

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            - name: media
              mountPath: /media

            - name: assets
              mountPath: /assets

          # ==========================================================
          # STARTUP PROBE
          # ==========================================================

          startupProbe:
            tcpSocket:
              port: 5002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # ==========================================================
          # READINESS PROBE
          # ==========================================================

          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # ==========================================================
          # LIVENESS PROBE
          # ==========================================================

          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # ==========================================================
          # RESOURCES
          # ==========================================================

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      # ==============================================================
      # VOLUMES
      # ==============================================================

      volumes:

        # ------------------------------------------------------------
        # Shared OpenBao AppRole
        # ------------------------------------------------------------

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # ------------------------------------------------------------
        # Shared OpenBao TLS certificate
        # ------------------------------------------------------------

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ------------------------------------------------------------
        # Platform configuration
        # ------------------------------------------------------------

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        # ------------------------------------------------------------
        # Platform data
        # ------------------------------------------------------------

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        # ------------------------------------------------------------
        # Media
        # ------------------------------------------------------------

        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        # ------------------------------------------------------------
        # Assets
        # ------------------------------------------------------------

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

      restartPolicy: Always

      dnsPolicy: ClusterFirst
