apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboard-api

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          # ==========================================================
          # BYPASS IMAGE OPENBAO FETCH WRAPPER
          #
          # The image ENTRYPOINT is:
          # /usr/local/bin/fetch-entrypoint.sh
          #
          # This explicitly starts the application instead of allowing
          # fetch-entrypoint.sh to wait for OpenBao.
          # ==========================================================

          command:
            - /start.sh

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          # ==========================================================
          # APPLICATION CONFIG
          # ==========================================================

          envFrom:
            - configMapRef:
                name: envs-production-web

          env:

            # ========================================================
            # TIMEZONE
            # ========================================================

            - name: TZ
              value: "UTC"

            # ========================================================
            # DASHBOARD APPLICATION
            # ========================================================

            - name: DATAHUB_API_BASE_URL
              value: "http://datahub-api:5003/datahub-api"

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

            # ========================================================
            # OPENBAO CONFIG
            #
            # Kept here for application compatibility, but the image
            # fetch wrapper is NOT being executed.
            # ========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/dashboard-api/secret_id"

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

          # ==========================================================
          # VOLUME MOUNTS
          # ==========================================================

          volumeMounts:

            - name: media
              mountPath: /media

            - name: assets
              mountPath: /assets

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          # ==========================================================
          # STARTUP PROBE
          # ==========================================================

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # ==========================================================
          # READINESS PROBE
          # ==========================================================

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          # ==========================================================
          # LIVENESS PROBE
          # ==========================================================

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ==========================================================
          # RESOURCES
          # ==========================================================

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      # ==============================================================
      # VOLUMES
      # ==============================================================

      volumes:

        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      dnsPolicy: ClusterFirst
