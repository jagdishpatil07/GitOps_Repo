apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      imagePullSecrets:
        - name: acr-secret

      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboard-api

          # IMPORTANT:
          # Do NOT specify command/args here.
          #
          # Docker image provides:
          # ENTRYPOINT=/usr/local/bin/fetch-entrypoint.sh
          # CMD=/start.sh
          #
          # The OpenBao wrapper must execute first.
          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          env:
            - name: TZ
              value: "UTC"

            # OpenBao
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            # IMPORTANT:
            # fetch-entrypoint.sh uses this to retrieve secrets.
            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            # Application
            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          envFrom:
            - configMapRef:
                name: envs-production-web

          volumeMounts:
            - name: media
              mountPath: /media

            - name: assets
              mountPath: /assets

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            # OpenBao AppRole secret_id
            - name: openbao-approle-dashboard-api
              mountPath: /openbao-approle
              readOnly: true

            # OpenBao CA certificate
            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          # Dashboard API must be able to establish its database
          # connection before becoming ready.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          # Restart if API stops listening.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Give Kubernetes enough time for Python/API startup.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        - name: openbao-approle-dashboard-api
          persistentVolumeClaim:
            claimName: openbao-approle-dashboard-api-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      restartPolicy: Always
      dnsPolicy: ClusterFirst
