apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      restartPolicy: Always

      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboard-api

          # ==========================================================
          # IMAGE
          # ==========================================================
          #
          # IMPORTANT:
          # Do NOT specify command or args here.
          #
          # The image provides:
          #
          # ENTRYPOINT=/usr/local/bin/fetch-entrypoint.sh
          # CMD=/start.sh
          #
          # Therefore startup becomes:
          #
          # fetch-entrypoint.sh /start.sh
          #
          # fetch-entrypoint.sh obtains secrets from OpenBao and then
          # starts /start.sh.
          # ==========================================================

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          # ==========================================================
          # APPLICATION CONFIG
          # ==========================================================

          envFrom:
            - configMapRef:
                name: envs-production-web

          env:

            # --------------------------------------------------------
            # TIMEZONE
            # --------------------------------------------------------

            - name: TZ
              value: "UTC"

            # --------------------------------------------------------
            # DATAHUB
            # --------------------------------------------------------

            - name: DATAHUB_API_BASE_URL
              value: "http://datahub-api:5003/datahub-api"

            # --------------------------------------------------------
            # OPENBAO
            # --------------------------------------------------------

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            # Shared OpenBao AppRole PVC:
            #
            # /openbao/approle-secrets/dashboard-api/secret_id
            #
            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/dashboard-api/secret_id"

            # --------------------------------------------------------
            # OPENBAO SECRET MAPPINGS
            # --------------------------------------------------------
            #
            # These are the same mappings used by Docker Compose.
            #
            # NO passwords are stored in this Deployment.
            # fetch-entrypoint.sh retrieves them from OpenBao.
            #

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            # --------------------------------------------------------
            # OPENBAO URL TEMPLATES
            # --------------------------------------------------------

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            # --------------------------------------------------------
            # PLATFORM DATA
            # --------------------------------------------------------

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          # ==========================================================
          # STORAGE
          # ==========================================================

          volumeMounts:

            # --------------------------------------------------------
            # Media
            # --------------------------------------------------------

            - name: media
              mountPath: /media

            # --------------------------------------------------------
            # Assets
            # --------------------------------------------------------

            - name: assets
              mountPath: /assets

            # --------------------------------------------------------
            # Platform configuration
            # --------------------------------------------------------

            - name: platform-configs
              mountPath: /app/Platform_Configs

            # --------------------------------------------------------
            # Platform data
            # --------------------------------------------------------

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            # --------------------------------------------------------
            # OpenBao AppRole
            # --------------------------------------------------------
            #
            # PVC:
            # openbao-approle-shared-pvc-1
            #
            # Expected file:
            #
            # /openbao/approle-secrets/dashboard-api/secret_id
            #

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            # --------------------------------------------------------
            # OpenBao TLS certificate
            # --------------------------------------------------------

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          # ==========================================================
          # STARTUP PROBE
          # ==========================================================

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # ==========================================================
          # READINESS PROBE
          # ==========================================================

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          # ==========================================================
          # LIVENESS PROBE
          # ==========================================================

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ==========================================================
          # RESOURCES
          # ==========================================================

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      # ============================================================
      # VOLUMES
      # ============================================================

      volumes:

        # ------------------------------------------------------------
        # Media
        # ------------------------------------------------------------

        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        # ------------------------------------------------------------
        # Assets
        # ------------------------------------------------------------

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        # ------------------------------------------------------------
        # Platform configuration
        # ------------------------------------------------------------

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        # ------------------------------------------------------------
        # Platform data
        # ------------------------------------------------------------

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        # ------------------------------------------------------------
        # Shared OpenBao AppRole
        # ------------------------------------------------------------
        #
        # Expected NFS structure:
        #
        # /data/nfs/openbao-approle-shared/
        # └── dashboard-api/
        #     └── secret_id
        #

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # ------------------------------------------------------------
        # Shared OpenBao TLS
        # ------------------------------------------------------------

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      dnsPolicy: ClusterFirst
