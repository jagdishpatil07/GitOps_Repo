apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api-compose-test
  namespace: myapp
  labels:
    app: dashboard-api-compose-test

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dashboard-api-compose-test

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: dashboard-api-compose-test

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: dashboard-api

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          # Docker Compose:
          # command:
          #   - /start.sh
          #
          # Image ENTRYPOINT remains:
          # /usr/local/bin/fetch-entrypoint.sh
          #
          # Effective:
          # fetch-entrypoint.sh /start.sh
          command:
            - /start.sh

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          # ==========================================================
          # Docker Compose env_file: .env
          #
          # Kubernetes equivalent.
          # ==========================================================

          envFrom:
            - configMapRef:
                name: envs-production-web

          # ==========================================================
          # Explicit Docker Compose environment
          # ==========================================================

          env:

            - name: TZ
              value: "UTC"

            - name: DATAHUB_API_BASE_URL
              value: "http://datahub-api:5003/datahub-api"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            # EXACT Docker Compose path
            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          # ==========================================================
          # Same Docker Compose resource limits
          # ==========================================================

          resources:
            limits:
              cpu: "2"
              memory: "4Gi"

          # ==========================================================
          # NO probes for this comparison deployment.
          #
          # Docker Compose dashboard-api does not define probes.
          # ==========================================================

          # ==========================================================
          # VOLUME MOUNTS
          # Exactly the volumes used by Docker Compose.
          # ==========================================================

          volumeMounts:

            # Docker:
            # media -> /media
            - name: media
              mountPath: /media

            # Docker:
            # assets -> /assets
            - name: assets
              mountPath: /assets

            # Docker:
            # Platform_Configs -> /app/Platform_Configs
            - name: platform-configs
              mountPath: /app/Platform_Configs

            # Docker:
            # Platform_Data -> /app/Platform_Data
            # read_only: true
            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            # Docker:
            # openbao-approle-dashboard-api -> /openbao-approle
            - name: openbao-approle-dashboard-api
              mountPath: /openbao-approle
              readOnly: true

            # Docker:
            # shared-certs -> /openbao-certs
            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

      # ============================================================
      # VOLUMES
      # ============================================================

      volumes:

        # Docker:
        # media -> /media
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        # Docker:
        # assets -> /assets
        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        # Docker:
        # Platform_Configs -> /app/Platform_Configs
        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        # Docker:
        # Platform_Data -> /app/Platform_Data
        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        # ==========================================================
        # Docker:
        #
        # openbao-approle-dashboard-api:
        #   -> /openbao-approle
        #
        # K8s shared PVC:
        # openbao-approle-shared-pvc-1
        #
        # Mount only dashboard-api subdirectory.
        # ==========================================================

        - name: openbao-approle-dashboard-api
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # Docker:
        # shared-certs -> /openbao-certs
        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

---
apiVersion: v1
kind: Service

metadata:
  name: dashboard-api-compose-test
  namespace: myapp
  labels:
    app: dashboard-api-compose-test

spec:
  type: ClusterIP

  selector:
    app: dashboard-api-compose-test

  ports:
    - name: http
      port: 5002
      targetPort: 5002
      protocol: TCP
