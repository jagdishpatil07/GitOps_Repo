apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: dashboard-api
          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          command:
            - /start.sh

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          env:
            - name: TZ
              value: "UTC"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/dashboard-api/secret_id"

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          envFrom:
            - configMapRef:
                name: envs-production-web

          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: media
              mountPath: /media

            - name: assets
              mountPath: /assets

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            - name: openbao-approle-dashboard-api
              mountPath: /openbao/approle-secrets/dashboard-api
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        - name: openbao-approle-dashboard-api
          persistentVolumeClaim:
            claimName: openbao-approle-dashboard-api-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
