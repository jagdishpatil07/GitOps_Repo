apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:

      imagePullSecrets:
        - name: acr-secret

      restartPolicy: Always

      terminationGracePeriodSeconds: 30

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      volumes:

        # ============================================================
        # Application persistent storage
        # ============================================================

        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        # ============================================================
        # OpenBao
        #
        # Same mounting model as the working WEB deployment
        # ============================================================

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      containers:

        - name: dashboard-api

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest

          imagePullPolicy: Always

          # ==========================================================
          # EXACT Docker Compose startup
          #
          # Docker:
          #
          # command:
          #   - /start.sh
          # ==========================================================

          command:
            - /start.sh

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          # ==========================================================
          # Docker .env / existing Kubernetes ConfigMap
          # ==========================================================

          envFrom:
            - configMapRef:
                name: envs-production-web

          # ==========================================================
          # Docker Compose explicit environment
          # ==========================================================

          env:

            - name: TZ
              value: "UTC"

            # ========================================================
            # DataHub
            # ========================================================

            - name: DATAHUB_API_BASE_URL
              value: "http://datahub-api:5003/datahub-api"

            # ========================================================
            # OpenBao
            # ========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            # Same shared-PVC directory structure as WEB
            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/dashboard-api/secret_id"

            # ========================================================
            # EXACT Docker Compose secret mappings
            # ========================================================

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            # ========================================================
            # EXACT Docker Compose URL template
            # ========================================================

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            # ========================================================
            # Platform data
            # ========================================================

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          # ==========================================================
          # Docker Compose resources
          # ==========================================================

          resources:

            limits:
              cpu: "2"
              memory: "4Gi"

          # ==========================================================
          # Volume mounts
          # ==========================================================

          volumeMounts:

            - name: media
              mountPath: /media

            - name: assets
              mountPath: /assets

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            # ========================================================
            # OpenBao AppRole
            # ========================================================

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            # ========================================================
            # OpenBao CA
            # ========================================================

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true
