apiVersion: apps/v1
kind: Deployment

metadata:
  name: dashboard-api
  namespace: myapp
  labels:
    app: dashboard-api

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: dashboard-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: dashboard-api

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: dashboard-api

          # ==========================================================
          # IMAGE
          #
          # Do NOT override command/args.
          #
          # Image:
          # ENTRYPOINT = /usr/local/bin/fetch-entrypoint.sh
          # CMD        = /start.sh
          #
          # OpenBao fetch wrapper must execute first.
          # ==========================================================

          image: revolutio.azurecr.io/revolutio_kubernetes/dashboard-api:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 5002
              protocol: TCP

          env:

            # ========================================================
            # TIMEZONE
            # ========================================================

            - name: TZ
              value: "UTC"

            # ========================================================
            # OPENBAO
            # ========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "dashboard-api"

            # Shared AppRole PVC:
            #
            # /openbao-approle/
            #   dashboard-api/
            #     secret_id
            #
            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            # ========================================================
            # OPENBAO SECRETS
            # ========================================================
            #
            # These values are fetched at container startup.
            # No passwords are stored in this Deployment.
            #

            - name: OPENBAO_SECRETS
              value: "POSTGRES_PASSWORD=postgres-core/platform_app,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin"

            # ========================================================
            # OPENBAO URL TEMPLATES
            # ========================================================

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

            # ========================================================
            # APPLICATION
            # ========================================================

            - name: PLATFORM_DATA_PATH
              value: "/app/Platform_Data"

          # ==========================================================
          # APPLICATION CONFIG
          # ==========================================================

          envFrom:
            - configMapRef:
                name: envs-production-web

          # ==========================================================
          # VOLUMES
          # ==========================================================

          volumeMounts:

            # --------------------------------------------------------
            # Application storage
            # --------------------------------------------------------

            - name: media
              mountPath: /media

            - name: assets
              mountPath: /assets

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: platform-data
              mountPath: /app/Platform_Data
              readOnly: true

            # --------------------------------------------------------
            # OpenBao AppRole
            #
            # PVC:
            # openbao-approle-shared-pvc-1
            #
            # NFS:
            # /data/nfs/openbao-approle-shared/dashboard-api/secret_id
            #
            # Container:
            # /openbao-approle/secret_id
            # --------------------------------------------------------

            - name: openbao-approle-shared
              mountPath: /openbao-approle
              subPath: dashboard-api
              readOnly: true

            # --------------------------------------------------------
            # OpenBao TLS CA
            # --------------------------------------------------------

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          # ==========================================================
          # STARTUP PROBE
          # ==========================================================
          #
          # Allows up to 5 minutes for application startup.
          #

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          # ==========================================================
          # READINESS PROBE
          # ==========================================================
          #
          # Pod receives traffic only after API listens on 5002.
          #

          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

          # ==========================================================
          # LIVENESS PROBE
          # ==========================================================
          #
          # Restart container if API stops listening.
          #

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ==========================================================
          # RESOURCES
          # ==========================================================

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"

            limits:
              cpu: "2"
              memory: "4Gi"

      # ==============================================================
      # VOLUMES
      # ==============================================================

      volumes:

        # ------------------------------------------------------------
        # Application media
        # ------------------------------------------------------------

        - name: media
          persistentVolumeClaim:
            claimName: media-pvc-1

        # ------------------------------------------------------------
        # Application assets
        # ------------------------------------------------------------

        - name: assets
          persistentVolumeClaim:
            claimName: assets-pvc-1

        # ------------------------------------------------------------
        # Platform configuration
        # ------------------------------------------------------------

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        # ------------------------------------------------------------
        # Platform data
        # ------------------------------------------------------------

        - name: platform-data
          persistentVolumeClaim:
            claimName: platform-data-pvc-1

        # ------------------------------------------------------------
        # Shared OpenBao AppRole PVC
        # ------------------------------------------------------------
        #
        # NFS:
        # /data/nfs/openbao-approle-shared/
        #
        # This Deployment uses:
        # /data/nfs/openbao-approle-shared/dashboard-api/secret_id
        #
        # because of:
        # subPath: dashboard-api
        #

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # ------------------------------------------------------------
        # Shared OpenBao TLS certificate
        # ------------------------------------------------------------

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      dnsPolicy: ClusterFirst
