apiVersion: apps/v1
kind: Deployment
metadata:
  name: rqscheduler
  namespace: {{ .Values.namespace }}
  labels:
    service: rqscheduler

spec:
  replicas: {{ .Values.rqscheduler.replicaCount }}

  selector:
    matchLabels:
      service: rqscheduler

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: rqscheduler

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      # Docker Compose:
      # init: true
      #
      # Keep this enabled so Kubernetes provides the equivalent
      # init-process behavior.
      shareProcessNamespace: false

      securityContext: {}

      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      dnsPolicy: ClusterFirst

      volumes:

        # --------------------------------
        # Existing application volumes
        # --------------------------------
        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.rqscheduler.pvc.static }}

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.rqscheduler.pvc.templates }}

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.rqscheduler.pvc.platformConfigs }}

        # --------------------------------
        # OpenBao AppRole
        # --------------------------------
        - name: openbao-approle
          persistentVolumeClaim:
            claimName: {{ .Values.rqscheduler.pvc.openbaoApprole }}

        # --------------------------------
        # OpenBao TLS certificate
        # --------------------------------
        - name: shared-certs
          persistentVolumeClaim:
            claimName: {{ .Values.rqscheduler.pvc.sharedCerts }}

        # --------------------------------
        # Docker tmpfs:
        # /opt/temp
        # --------------------------------
        - name: temp-storage
          emptyDir:
            medium: Memory

      containers:
        - name: rqscheduler

          image: "{{ .Values.rqscheduler.image }}"
          imagePullPolicy: Always

          # Do NOT set command.
          #
          # The image ENTRYPOINT must remain active so that
          # OpenBao secret injection happens before /app/start.
          #
          # Docker Compose:
          #   command: /app/start
          #
          args:
            - /app/start

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true

          # Docker Compose:
          #   read_only: true
          #
          # Kubernetes equivalent.
          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          env:

            # --------------------------------
            # General
            # --------------------------------
            - name: TZ
              value: "UTC"

            # --------------------------------
            # OpenBao
            # --------------------------------
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "rqscheduler"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: "REDIS_PASSWORD=cache/redis"

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1"

          envFrom:
            - configMapRef:
                name: {{ .Values.rqscheduler.configMap }}

          ports:
            - name: rqscheduler
              containerPort: 8899
              protocol: TCP

          volumeMounts:

            # --------------------------------
            # Application storage
            # --------------------------------
            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            # --------------------------------
            # OpenBao AppRole
            # --------------------------------
            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            # --------------------------------
            # OpenBao TLS
            # --------------------------------
            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # --------------------------------
            # Docker tmpfs
            # --------------------------------
            - name: temp-storage
              mountPath: /opt/temp

          # --------------------------------
          # Docker healthcheck:
          #
          # pidof -x rqscheduler
          # --------------------------------
          startupProbe:
            exec:
              command:
                - pidof
                - -x
                - rqscheduler
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - pidof
                - -x
                - rqscheduler
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - pidof
                - -x
                - rqscheduler
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
