apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: myapp
spec:
  replicas: 1

  selector:
    matchLabels:
      app: zookeeper

  template:
    metadata:
      labels:
        app: zookeeper

    spec:
      containers:
      - name: zookeeper
        image: revolutio.azurecr.io/revolutio_kubernetes/zookeeper:bod-stable-2026.10.3
        imagePullPolicy: Always

        ports:
        - containerPort: 2181

        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
