apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer1-new
  namespace: myapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pgbouncer1-new

  template:
    metadata:
      labels:
        app: pgbouncer1-new

    spec:
      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: pgbouncer

          image: revolutio.azurecr.io/revolutio_kubernetes/pgbouncer:latest

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRESQL_HOST
              value: "postgres-core"

            - name: DB_HOST
              value: "postgres-core"

            - name: DB_USER
              value: "platform_app"

            - name: AUTH_TYPE
              value: "scram-sha-256"

            - name: POOL_MODE
              value: "transaction"

            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"

            - name: IGNORE_STARTUP_PARAMETERS
              value: "options,extra_float_digits"

            - name: DEFAULT_POOL_SIZE
              value: "35"

            - name: MIN_POOL_SIZE
              value: "20"

            - name: RESERVE_POOL_SIZE
              value: "5"

            - name: RESERVE_POOL_TIMEOUT
              value: "3"

            - name: MAX_CLIENT_CONN
              value: "1000"

            - name: SERVER_CONNECT_TIMEOUT
              value: "5"

            - name: SERVER_LOGIN_RETRY
              value: "2"

            - name: QUERY_WAIT_TIMEOUT
              value: "30"

            - name: SERVER_IDLE_TIMEOUT
              value: "600"

            - name: SERVER_LIFETIME
              value: "1800"

            - name: CLIENT_IDLE_TIMEOUT
              value: "0"

            - name: IDLE_TRANSACTION_TIMEOUT
              value: "60"

            - name: MAX_PREPARED_STATEMENTS
              value: "0"

            - name: SERVER_TLS_SSLMODE
              value: "disable"

            - name: SERVER_CHECK_QUERY
              value: "SELECT 1"

            - name: STATS_USERS
              value: "platform_app"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "pgbouncer1-new"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: "DB_PASSWORD=postgres-core/platform_app"

          volumeMounts:
            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 20

      volumes:
        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-pgbouncer1-new-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1
