apiVersion: apps/v1
kind: Deployment

metadata:
  name: pgbouncer1-new
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.pgbouncer.replicaCount }}

  selector:
    matchLabels:
      app: pgbouncer1-new

  template:
    metadata:
      labels:
        app: pgbouncer1-new

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      containers:
        - name: pgbouncer

          image: {{ .Values.pgbouncer.image }}
          imagePullPolicy: Always

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            # ======================================================
            # PostgreSQL
            # ======================================================

            - name: POSTGRESQL_HOST
              value: "postgres-core"

            - name: DB_HOST
              value: "postgres-core"

            - name: DB_USER
              value: "platform_app"

            # ======================================================
            # PgBouncer
            # ======================================================

            - name: AUTH_TYPE
              value: "scram-sha-256"

            - name: POOL_MODE
              value: "transaction"

            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"

            - name: IGNORE_STARTUP_PARAMETERS
              value: "options,extra_float_digits"

            - name: DEFAULT_POOL_SIZE
              value: "35"

            - name: MIN_POOL_SIZE
              value: "20"

            - name: RESERVE_POOL_SIZE
              value: "5"

            - name: RESERVE_POOL_TIMEOUT
              value: "3"

            - name: MAX_CLIENT_CONN
              value: "1000"

            - name: SERVER_CONNECT_TIMEOUT
              value: "5"

            - name: SERVER_LOGIN_RETRY
              value: "2"

            - name: QUERY_WAIT_TIMEOUT
              value: "30"

            - name: SERVER_IDLE_TIMEOUT
              value: "600"

            - name: SERVER_LIFETIME
              value: "1800"

            - name: CLIENT_IDLE_TIMEOUT
              value: "0"

            - name: IDLE_TRANSACTION_TIMEOUT
              value: "60"

            - name: MAX_PREPARED_STATEMENTS
              value: "0"

            - name: SERVER_TLS_SSLMODE
              value: "disable"

            - name: SERVER_CHECK_QUERY
              value: "SELECT 1"

            - name: STATS_USERS
              value: "platform_app"

            # ======================================================
            # OpenBao
            # ======================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "pgbouncer1-new"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/pgbouncer1-new/secret_id"

            - name: OPENBAO_SECRETS
              value: "DB_PASSWORD=postgres-core/platform_app"

          volumeMounts:

            # ======================================================
            # PgBouncer writable configuration
            # ======================================================

            - name: pgbouncer-config
              mountPath: /etc/pgbouncer

            # ======================================================
            # OpenBao AppRole
            # ======================================================

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            # ======================================================
            # OpenBao CA
            # ======================================================

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # ======================================================
            # Runtime directories
            # ======================================================

            - name: pgbouncer-run
              mountPath: /var/run/pgbouncer

            - name: pgbouncer-log
              mountPath: /var/log/pgbouncer

            - name: tmp
              mountPath: /tmp

          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          resources:
            requests:
              cpu: {{ .Values.pgbouncer.resources.requests.cpu | quote }}
              memory: {{ .Values.pgbouncer.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.pgbouncer.resources.limits.cpu | quote }}
              memory: {{ .Values.pgbouncer.resources.limits.memory | quote }}

      volumes:

        # ==========================================================
        # /etc/pgbouncer
        # ==========================================================

        - name: pgbouncer-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        # ==========================================================
        # /var/run/pgbouncer
        # ==========================================================

        - name: pgbouncer-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        # ==========================================================
        # /var/log/pgbouncer
        # ==========================================================

        - name: pgbouncer-log
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        # ==========================================================
        # /tmp
        # ==========================================================

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        # ==========================================================
        # OpenBao AppRole Secret ID
        # ==========================================================

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # ==========================================================
        # OpenBao CA certificate
        # ==========================================================

        - name: shared-certs
          persistentVolumeClaim:
            claimName: {{ .Values.pgbouncer.pvc.sharedCerts }}
