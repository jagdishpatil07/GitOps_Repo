apiVersion: apps/v1
kind: Deployment
metadata:
  name: sockets
  namespace: {{ .Values.namespace }}
  labels:
    service: sockets

spec:
  replicas: {{ .Values.sockets.replicaCount }}

  selector:
    matchLabels:
      service: sockets

  template:
    metadata:
      labels:
        service: sockets

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:
        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.sockets.pvc.static }}

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.sockets.pvc.templates }}

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.sockets.pvc.platformConfigs }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.sockets.pvc.media }}

        - name: computation-storage
          persistentVolumeClaim:
            claimName: {{ .Values.sockets.pvc.computation }}

      containers:
        - name: sockets
          image: "{{ .Values.sockets.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070

          resources:
            limits:
              cpu: "4"
              memory: 16Gi
            requests:
              cpu: "2"
              memory: 8Gi

          ports:
            - name: uvicorn
              containerPort: 5000

          readinessProbe:
            httpGet:
              path: /readiness
              port: uvicorn
            initialDelaySeconds: 120
            periodSeconds: 20

          livenessProbe:
            httpGet:
              path: /healthy
              port: uvicorn
            initialDelaySeconds: 120
            periodSeconds: 30

          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

          envFrom:
            - configMapRef:
                name: {{ .Values.sockets.configMaps.web }}
            - configMapRef:
                name: {{ .Values.sockets.configMaps.postgres }}
            - secretRef:
                name: {{ .Values.sockets.secrets.web }}
            - secretRef:
                name: {{ .Values.sockets.secrets.postgres }}

          volumeMounts:
            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

          ########################################################
          # ✅ SINGLE WORKER FIX (SAME AS WEB)
          ########################################################
          command:
            - /bin/sh
          args:
            - -c
            - |
              echo "====== SOCKETS BOOTSTRAP START ======"

              # Start original bootstrap script
              /Installation_ref/scripts/start &

              # Wait for initialization
              sleep 20

              echo "====== SWITCHING TO SINGLE WORKER ======"

              # Kill existing multi-workers
              pkill -f uvicorn || true

              # Start single worker
              exec uvicorn config.asgi:application \
                --host 0.0.0.0 \
                --port 5000 \
                --workers 1 \
                --lifespan off \
                --timeout-keep-alive 60 \
                --log-level info

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst

  strategy:
    type: RollingUpdate
