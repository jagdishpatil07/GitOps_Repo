apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-app-migration
  namespace: {{ .Values.namespace }}
  labels:
    service: worker-app-migration

spec:
  replicas: {{ .Values.workerAppMigration.replicaCount }}

  selector:
    matchLabels:
      service: worker-app-migration

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  template:
    metadata:
      labels:
        service: worker-app-migration

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerAppMigration.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerAppMigration.pvc.media }}

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerAppMigration.pvc.platformConfigs }}

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerAppMigration.pvc.templates }}

        - name: computation-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerAppMigration.pvc.computation }}

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerAppMigration.pvc.assets }}

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        - name: opt-temp
          emptyDir:
            medium: Memory
            sizeLimit: 1000Mi

        - name: app-logs
          emptyDir:
            medium: Memory
            sizeLimit: 1000Mi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1000Mi

      containers:
        - name: rqworker

          image: {{ .Values.workerAppMigration.image }}
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          args:
            - /rqworker/start-app-migration

          env:

            - name: TZ
              value: "UTC"

            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: OPENBLAS_NUM_THREADS
              value: "1"

            - name: MKL_NUM_THREADS
              value: "1"

            - name: NUMEXPR_NUM_THREADS
              value: "1"

            - name: OMP_NUM_THREADS
              value: "1"

            - name: XDG_CACHE_HOME
              value: "/opt/temp"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: >-
                SECRET_KEY=django/secret_key,
                FERNET_SECRET=django/fernet_secret,
                DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,
                DJANGO_SUPERUSER_PASSWORD=django/superuser_password,
                REDIS_PASSWORD=cache/redis,
                KEYDB_PASSWORD=cache/keydb,
                POSTGRES_PASSWORD=postgres-core/platform_app

            - name: OPENBAO_URL_TEMPLATES
              value: >-
                REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,
                REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,
                REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379

          envFrom:
            - configMapRef:
                name: {{ .Values.workerAppMigration.configMaps.web }}

            - configMapRef:
                name: {{ .Values.workerAppMigration.configMaps.postgres }}

          resources:
            requests:
              cpu: {{ .Values.workerAppMigration.resources.requests.cpu | quote }}
              memory: {{ .Values.workerAppMigration.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.workerAppMigration.resources.limits.cpu | quote }}
              memory: {{ .Values.workerAppMigration.resources.limits.memory | quote }}

          volumeMounts:

            - name: assets-storage
              mountPath: /opt/revolutio/assets

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            - name: opt-temp
              mountPath: /opt/temp

            - name: app-logs
              mountPath: /opt/revolutio/logs

            - name: tmp
              mountPath: /tmp

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "custom-worker.py"
            periodSeconds: 30
            failureThreshold: 10

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "custom-worker.py"
            periodSeconds: 30

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pgrep -f "custom-worker.py"
            periodSeconds: 30
