apiVersion: apps/v1
kind: Deployment

metadata:
  name: web
  namespace: {{ .Values.namespace }}
  labels:
    service: web

spec:
  replicas: {{ .Values.web.replicaCount }}

  selector:
    matchLabels:
      service: web

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: web

    spec:

      # ============================================================
      # Docker equivalent:
      # imagePullSecrets / private registry
      # ============================================================

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      # Docker:
      # stop_grace_period: 15s
      # ============================================================

      terminationGracePeriodSeconds: 15

      # ============================================================
      # Docker container runs as UID 70070
      # ============================================================

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      # ============================================================
      # Volumes
      # ============================================================

      volumes:

        # ----------------------------------------------------------
        # Docker:
        # static
        # ----------------------------------------------------------

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.static }}

        # ----------------------------------------------------------
        # Docker:
        # media
        # ----------------------------------------------------------

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.media }}

        # ----------------------------------------------------------
        # Docker:
        # assets
        # ----------------------------------------------------------

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.assets }}

        # ----------------------------------------------------------
        # Docker:
        # Platform_Configs
        # ----------------------------------------------------------

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.platformConfigs }}

        # ----------------------------------------------------------
        # Docker:
        # user_defined_template
        # ----------------------------------------------------------

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.templates }}

        # ----------------------------------------------------------
        # Docker:
        # computation_storage
        # ----------------------------------------------------------

        - name: computation-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.computation }}

        # ----------------------------------------------------------
        # OpenBao AppRole
        # Docker:
        # openbao-approle-revolutio-app
        # ----------------------------------------------------------

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        # ----------------------------------------------------------
        # OpenBao TLS
        # Docker:
        # shared-certs
        # ----------------------------------------------------------

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ==========================================================
        # Docker tmpfs equivalents
        # ==========================================================

        - name: opt-temp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: revolutio-logs
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: gunicorn-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi

      # ============================================================
      # WEB CONTAINER
      # ============================================================

      containers:

        - name: web

          image: {{ .Values.web.image }}

          imagePullPolicy: Always

          # ========================================================
          # Docker:
          #
          # command: bash -c
          # 'gunicorn config.asgi:application
          #  --bind 0.0.0.0:5000
          #  --workers ${WEB_WORKERS:-1}
          #  --worker-class uvicorn.workers.UvicornWorker
          #  --timeout 120
          #  --graceful-timeout 10'
          #
          # ========================================================

          args:
            - bash
            - -c
            - >-
              gunicorn config.asgi:application
              --bind 0.0.0.0:5000
              --workers ${WEB_WORKERS:-1}
              --worker-class uvicorn.workers.UvicornWorker
              --timeout 120
              --graceful-timeout 10

          # ========================================================
          # Port
          # ========================================================

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          # ========================================================
          # ENVIRONMENT
          # ========================================================

          env:

            # ------------------------------------------------------
            # Docker environment
            # ------------------------------------------------------

            - name: TZ
              value: "UTC"

            - name: PUBLISH_STATIC
              value: "1"

            - name: RUN_BOOTSTRAP
              value: "1"

            - name: XDG_CACHE_HOME
              value: "/opt/temp"

            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: GRPC_DNS_RESOLVER
              value: "native"

            # ------------------------------------------------------
            # Docker .env equivalent
            #
            # Docker .env contains:
            #
            # REDIS_HOST = redis
            # REDIS_PORT = 6379
            #
            # DO NOT put REDIS_URL / passwords here.
            # ------------------------------------------------------

            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            # ------------------------------------------------------
            # OpenBao
            # ------------------------------------------------------

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            # ------------------------------------------------------
            # Secrets pulled from OpenBao
            # ------------------------------------------------------

            - name: OPENBAO_SECRETS
              value: >-
                SECRET_KEY=django/secret_key,
                FERNET_SECRET=django/fernet_secret,
                DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,
                DJANGO_SUPERUSER_PASSWORD=django/superuser_password,
                REDIS_PASSWORD=cache/redis,
                KEYDB_PASSWORD=cache/keydb,
                POSTGRES_PASSWORD=postgres-core/platform_app

            # ------------------------------------------------------
            # IMPORTANT:
            #
            # These are generated from OpenBao secrets.
            #
            # Docker exact configuration:
            #
            # REDIS_URL:
            # redis://:$${REDIS_PASSWORD}@redis:6379/0
            #
            # REDIS_URL_SCHEDULER:
            # redis://:$${REDIS_PASSWORD}@redis:6379/1
            #
            # REDIS_CACHE_LOCATION:
            # redis://:$${KEYDB_PASSWORD}@keydb:6379
            # ------------------------------------------------------

            - name: OPENBAO_URL_TEMPLATES
              value: >-
                REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,
                REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,
                REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379

          # ========================================================
          # ConfigMaps
          #
          # envs-production-web should contain the non-secret
          # Docker .env-style values.
          #
          # It should NOT override:
          # REDIS_URL
          # REDIS_URL_SCHEDULER
          # REDIS_CACHE_LOCATION
          # REDIS_PASSWORD
          # KEYDB_PASSWORD
          # ========================================================

          envFrom:

            - configMapRef:
                name: {{ .Values.web.configMaps.web }}

            - configMapRef:
                name: {{ .Values.web.configMaps.postgres }}

          # ========================================================
          # Resources
          #
          # Docker:
          # cpus: ${WEB_CPUS:-1}
          # memory: ${WEB_MEMORY:-3G}
          #
          # Values are controlled through Helm.
          # ========================================================

          resources:

            requests:
              cpu: {{ .Values.web.resources.requests.cpu | quote }}
              memory: {{ .Values.web.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.web.resources.limits.cpu | quote }}
              memory: {{ .Values.web.resources.limits.memory | quote }}

          # ========================================================
          # Docker:
          #
          # healthcheck:
          #   interval: 30s
          #   retries: 5
          #   start_period: 360s
          #   timeout: 30s
          #
          # ========================================================

          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/revolutio/healthcheck.sh 5000

            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 12

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/revolutio/healthcheck.sh 5000

            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/revolutio/healthcheck.sh 5000

            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
            successThreshold: 1

          # ========================================================
          # Docker:
          #
          # read_only: true
          #
          # ========================================================

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ========================================================
          # Volume mounts
          # ========================================================

          volumeMounts:

            # ------------------------------------------------------
            # Docker:
            # static -> /opt/revolutio/static
            # ------------------------------------------------------

            - name: static-storage
              mountPath: /opt/revolutio/static

            # ------------------------------------------------------
            # Docker:
            # media -> /opt/revolutio/Core/media
            # ------------------------------------------------------

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            # ------------------------------------------------------
            # Docker:
            # assets -> /opt/revolutio/assets
            # ------------------------------------------------------

            - name: assets-storage
              mountPath: /opt/revolutio/assets

            # ------------------------------------------------------
            # Docker:
            # Platform_Configs
            # ------------------------------------------------------

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            # ------------------------------------------------------
            # Docker:
            # user_defined_template
            # ------------------------------------------------------

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            # ------------------------------------------------------
            # Docker:
            # computation_storage
            # ------------------------------------------------------

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            # ------------------------------------------------------
            # OpenBao AppRole
            # ------------------------------------------------------

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            # ------------------------------------------------------
            # OpenBao TLS
            # ------------------------------------------------------

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # ------------------------------------------------------
            # Docker tmpfs:
            #
            # /opt/temp
            # ------------------------------------------------------

            - name: opt-temp
              mountPath: /opt/temp

            # ------------------------------------------------------
            # Docker tmpfs:
            #
            # /opt/revolutio/logs
            # ------------------------------------------------------

            - name: revolutio-logs
              mountPath: /opt/revolutio/logs

            # ------------------------------------------------------
            # Docker tmpfs:
            #
            # /tmp
            # ------------------------------------------------------

            - name: tmp
              mountPath: /tmp

            # ------------------------------------------------------
            # Docker tmpfs:
            #
            # /home/revolutio/.gunicorn
            # ------------------------------------------------------

            - name: gunicorn-runtime
              mountPath: /home/revolutio/.gunicorn
