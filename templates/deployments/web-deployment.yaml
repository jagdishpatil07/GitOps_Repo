apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: myapp
  labels:
    service: web

spec:
  replicas: 1

  selector:
    matchLabels:
      service: web

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: web

    spec:
      imagePullSecrets:
        - name: acr-secret

      terminationGracePeriodSeconds: 15

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:

        # ============================================
        # Application persistent storage
        # ============================================

        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc-1

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: assets-storage
          persistentVolumeClaim:
            claimName: assets-pvc-1

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: templates-storage
          persistentVolumeClaim:
            claimName: user-defined-template-pvc-2

        - name: computation-storage
          persistentVolumeClaim:
            claimName: computation-storage-pvc-1

        # ============================================
        # OpenBao AppRole
        # Docker:
        # /openbao-approle/secret_id
        # ============================================

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        # ============================================
        # OpenBao TLS certificate
        # Docker:
        # /openbao-certs/tls.crt
        # ============================================

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ============================================
        # Docker tmpfs equivalents
        # ============================================

        - name: opt-temp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: revolutio-logs
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: gunicorn-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi

      containers:

        - name: web

          image: revolutio.azurecr.io/revolutio_kubernetes/revolutio:latest
          imagePullPolicy: Always

          # IMPORTANT:
          # Do NOT specify "command".
          #
          # Docker image ENTRYPOINT is:
          # /usr/local/bin/fetch-entrypoint.sh
          #
          # This entrypoint performs the OpenBao login and
          # exports the required secrets before executing args.

          args:
            - bash
            - -c
            - >-
              gunicorn config.asgi:application
              --bind 0.0.0.0:5000
              --workers 4
              --worker-class uvicorn.workers.UvicornWorker
              --timeout 120
              --graceful-timeout 10

          ports:
            - name: uvicorn
              containerPort: 5000
              protocol: TCP

          env:

            # ========================================
            # Application configuration
            # ========================================

            - name: TZ
              value: "UTC"

            - name: PUBLISH_STATIC
              value: "1"

            - name: RUN_BOOTSTRAP
              value: "1"

            - name: XDG_CACHE_HOME
              value: "/opt/temp"

            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: GRPC_DNS_RESOLVER
              value: "native"

            # ========================================
            # Redis
            #
            # Explicitly define these so Kubernetes
            # Service environment variables cannot
            # replace REDIS_PORT with:
            #
            # tcp://<cluster-ip>:6379
            # ========================================

            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            # ========================================
            # OpenBao
            # ========================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: >-
                SECRET_KEY=django/secret_key,
                FERNET_SECRET=django/fernet_secret,
                DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,
                DJANGO_SUPERUSER_PASSWORD=django/superuser_password,
                REDIS_PASSWORD=cache/redis,
                KEYDB_PASSWORD=cache/keydb,
                POSTGRES_PASSWORD=postgres-core/platform_app

            # IMPORTANT:
            # $$ becomes a literal $ for the OpenBao
            # entrypoint, allowing it to expand the
            # fetched secret values.
            #
            # These match the healthy Docker container.

            - name: OPENBAO_URL_TEMPLATES
              value: >-
                REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,
                REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,
                REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379

          # ==========================================
          # Existing application ConfigMaps
          #
          # Non-secret configuration can continue
          # coming from these ConfigMaps.
          #
          # OpenBao entrypoint overwrites the secret
          # variables listed in OPENBAO_SECRETS.
          # ==========================================

          envFrom:
            - configMapRef:
                name: envs-production-web

            - configMapRef:
                name: envs-production-postgres-core

          # ==========================================
          # Resources
          # ==========================================

          resources:
            requests:
              cpu: "2"
              memory: "8Gi"

            limits:
              cpu: "8"
              memory: "32Gi"

          # ==========================================
          # Health checks
          # ==========================================

          readinessProbe:
            httpGet:
              path: /
              port: 5000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /
              port: 5000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
            successThreshold: 1

          # ==========================================
          # Security
          # ==========================================

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ==========================================
          # Persistent mounts
          # ==========================================

          volumeMounts:

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: assets-storage
              mountPath: /opt/revolutio/assets

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            # ========================================
            # OpenBao mounts
            # ========================================

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # ========================================
            # Docker tmpfs equivalents
            # ========================================

            - name: opt-temp
              mountPath: /opt/temp

            - name: revolutio-logs
              mountPath: /opt/revolutio/logs

            - name: tmp
              mountPath: /tmp

            - name: gunicorn-runtime
              mountPath: /home/revolutio/.gunicorn
