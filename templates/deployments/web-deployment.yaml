apiVersion: apps/v1
kind: Deployment

metadata:
  name: web
  namespace: {{ .Values.namespace }}
  labels:
    service: web

spec:
  replicas: {{ .Values.web.replicaCount }}

  selector:
    matchLabels:
      service: web

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: web

    spec:

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 15

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:

        # ============================================================
        # Application persistent storage
        # ============================================================

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.media }}

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.assets }}

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.platformConfigs }}

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.templates }}

        - name: computation-storage
          persistentVolumeClaim:
            claimName: {{ .Values.web.pvc.computation }}

        # ============================================================
        # OpenBao
        # ============================================================

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ============================================================
        # Docker tmpfs equivalents
        # ============================================================

        - name: opt-temp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: revolutio-logs
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: gunicorn-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi

      containers:

        - name: web

          image: {{ .Values.web.image }}

          imagePullPolicy: Always

          # DO NOT specify command.
          # Docker image ENTRYPOINT remains:
          # /usr/local/bin/fetch-entrypoint.sh
          #
          # Startup:
          # fetch-entrypoint.sh
          #   -> OpenBao
          #   -> /Installation_ref/scripts/entrypoint
          #   -> bootstrap/migrations
          #   -> gunicorn

          args:
            - bash
            - -c
            - >-
              gunicorn config.asgi:application
              --bind 0.0.0.0:5000
              --workers ${WEB_WORKERS:-1}
              --worker-class uvicorn.workers.UvicornWorker
              --timeout 120
              --graceful-timeout 10

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          # ============================================================
          # Explicit Docker Compose environment
          # ============================================================

          env:

            - name: TZ
              value: "UTC"

            - name: PUBLISH_STATIC
              value: "1"

            - name: RUN_BOOTSTRAP
              value: "1"

            - name: XDG_CACHE_HOME
              value: "/opt/temp"

            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: GRPC_DNS_RESOLVER
              value: "native"

            # ==========================================================
            # Redis base configuration
            # ==========================================================

            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            # ==========================================================
            # OpenBao
            # ==========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/revolutio-app/secret_id"

            # ==========================================================
            # Docker-compatible OpenBao mappings
            #
            # IMPORTANT:
            # DJANGO_SUPERUSER_PASSWORD is intentionally NOT listed.
            #
            # Docker did not inject this variable into Web.
            # Therefore Django uses:
            #
            # env("DJANGO_SUPERUSER_PASSWORD",
            #     default="Revadmin@2023")
            # ==========================================================

            - name: OPENBAO_SECRETS
              value: >-
                SECRET_KEY=django/secret_key,
                FERNET_SECRET=django/fernet_secret,
                DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,
                REDIS_PASSWORD=cache/redis,
                KEYDB_PASSWORD=cache/keydb,
                POSTGRES_PASSWORD=postgres-core/platform_app

            # ==========================================================
            # EXACT Docker generated URL templates
            # ==========================================================

            - name: OPENBAO_URL_TEMPLATES
              value: >-
                REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,
                REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,
                REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379

          # ============================================================
          # Non-secret Docker .env values
          # ============================================================

          envFrom:

            - configMapRef:
                name: {{ .Values.web.configMaps.web }}

            - configMapRef:
                name: {{ .Values.web.configMaps.postgres }}

          # ============================================================
          # Resources
          # ============================================================

          resources:

            requests:
              cpu: {{ .Values.web.resources.requests.cpu | quote }}
              memory: {{ .Values.web.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.web.resources.limits.cpu | quote }}
              memory: {{ .Values.web.resources.limits.memory | quote }}

          # ============================================================
          # Startup probe
          # ============================================================

          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/revolutio/healthcheck.sh 5000

            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 12

          # ============================================================
          # Readiness
          # ============================================================

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/revolutio/healthcheck.sh 5000

            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
            successThreshold: 1

          # ============================================================
          # Liveness
          # ============================================================

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/revolutio/healthcheck.sh 5000

            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 5
            successThreshold: 1

          # ============================================================
          # Docker read_only=true
          # ============================================================

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          # ============================================================
          # Volume mounts
          # ============================================================

          volumeMounts:

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: assets-storage
              mountPath: /opt/revolutio/assets

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            # ==========================================================
            # OpenBao AppRole Secret ID
            # ==========================================================

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            # ==========================================================
            # OpenBao CA certificate
            # ==========================================================

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # ==========================================================
            # Docker tmpfs equivalents
            # ==========================================================

            - name: opt-temp
              mountPath: /opt/temp

            - name: revolutio-logs
              mountPath: /opt/revolutio/logs

            - name: tmp
              mountPath: /tmp

            - name: gunicorn-runtime
              mountPath: /home/revolutio/.gunicorn
