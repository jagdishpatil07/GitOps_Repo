apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scheduler
  namespace: myapp
  labels:
    app: worker-scheduler

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker-scheduler

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  template:
    metadata:
      labels:
        app: worker-scheduler

    spec:
      imagePullSecrets:
        - name: acr-secret

      securityContext: {}

      containers:
        - name: worker-scheduler

          image: revolutio.azurecr.io/revolutio_kubernetes/revolutio:latest
          imagePullPolicy: Always

          args:
            - /rqworker/start-scheduler

          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            - name: REDIS_URL
              value: "$(REDIS_URL)"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/shared-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/revolutio-app/secret_id"

            - name: OPENBAO_SECRETS
              value: >-
                DJANGO_SECRET_KEY=django/secret_key,
                DJANGO_FERNET_SECRET=django/fernet_secret,
                DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,
                DJANGO_SUPERUSER_PASSWORD=django/superuser_password,
                POSTGRES_PASSWORD=postgres-core/platform_app,
                REDIS_PASSWORD=cache/redis,
                KEYDB_PASSWORD=cache/keydb,
                COUCHDB_PASSWORD=couchdb/admin

            - name: OPENBAO_URL_TEMPLATES
              value: >-
                REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,
                REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,
                REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379

          envFrom:
            - configMapRef:
                name: envs-production-web

            - configMapRef:
                name: envs-production-postgres-core

          volumeMounts:
            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: openbao-approle-revolutio-app
              mountPath: /openbao/approle-secrets/revolutio-app
              readOnly: true

            - name: shared-certs
              mountPath: /shared-certs
              readOnly: true

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc-1

        - name: templates-storage
          persistentVolumeClaim:
            claimName: user-defined-template-pvc-2

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: computation-storage
          persistentVolumeClaim:
            claimName: computation-storage-pvc-1

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: openbao-approle-revolutio-app
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
