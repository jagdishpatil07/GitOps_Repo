apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-scheduler
  namespace: {{ .Values.namespace }}
  labels:
    app: worker-scheduler

spec:
  replicas: {{ .Values.workerScheduler.replicaCount }}

  selector:
    matchLabels:
      app: worker-scheduler

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: worker-scheduler

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      # OpenShift safe
      securityContext: {}

      containers:
        - name: worker-scheduler
          image: "{{ .Values.workerScheduler.image }}"
          imagePullPolicy: Always

          args:
            - /rqworker/start-scheduler

          resources:
            requests:
              cpu: {{ .Values.workerScheduler.resources.requests.cpu }}
              memory: {{ .Values.workerScheduler.resources.requests.memory }}
            limits:
              cpu: {{ .Values.workerScheduler.resources.limits.cpu }}
              memory: {{ .Values.workerScheduler.resources.limits.memory }}

          env:
            - name: DATABASE_URL
              value: {{ .Values.workerScheduler.databaseUrl | quote }}
            - name: REDIS_URL
              value: {{ .Values.workerScheduler.redisUrl | quote }}

          envFrom:
            - configMapRef:
                name: {{ .Values.workerScheduler.configMaps.web }}
            - configMapRef:
                name: {{ .Values.workerScheduler.configMaps.postgres }}
            - secretRef:
                name: {{ .Values.workerScheduler.secrets.web }}
            - secretRef:
                name: {{ .Values.workerScheduler.secrets.postgres }}

          volumeMounts:
            - name: static-storage
              mountPath: /opt/revolutio/static
            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template
            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs
            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage
            - name: media-storage
              mountPath: /opt/revolutio/Core/media

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerScheduler.pvc.static }}

        - name: templates-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerScheduler.pvc.templates }}

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerScheduler.pvc.platformConfigs }}

        - name: computation-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerScheduler.pvc.computation }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.workerScheduler.pvc.media }}

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst