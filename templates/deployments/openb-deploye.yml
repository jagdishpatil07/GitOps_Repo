apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: myapp
  labels:
    app: openbao
    component: secrets-management

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: openbao

  # OpenBao should never have two instances using the same single-node
  # persistent storage during an update.
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: openbao
        component: secrets-management

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst

      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: openbao

          image: revolutio.azurecr.io/revolutio_kubernetes/openbao:latest
          imagePullPolicy: Always

          env:
            - name: TZ
              value: "UTC"

          ports:
            - name: api
              containerPort: 8200
              protocol: TCP

            - name: cluster
              containerPort: 8201
              protocol: TCP

          # Docker equivalent:
          #
          # cap_add:
          #   - IPC_LOCK
          #
          securityContext:
            capabilities:
              add:
                - IPC_LOCK

          volumeMounts:

            # ============================================================
            # OpenBao persistent storage
            # ============================================================

            - name: openbao-data
              mountPath: /openbao/data

            # ============================================================
            # OpenBao bootstrap/init data
            # ============================================================

            - name: openbao-init
              mountPath: /openbao/init

            # ============================================================
            # TLS
            # ============================================================

            - name: openbao-tls
              mountPath: /openbao/tls
              readOnly: true

            # ============================================================
            # Shared certificates
            # ============================================================

            - name: shared-certs
              mountPath: /shared-certs

            # ============================================================
            # AppRole secret volumes
            #
            # Keep paths EXACTLY aligned with Docker Compose.
            # ============================================================

            - name: approle-postgres-core
              mountPath: /openbao/approle-secrets/postgres-core

            - name: approle-redis
              mountPath: /openbao/approle-secrets/redis

            - name: approle-keydb
              mountPath: /openbao/approle-secrets/keydb

            - name: approle-couchdb
              mountPath: /openbao/approle-secrets/couchdb

            - name: approle-revolutio-app
              mountPath: /openbao/approle-secrets/revolutio-app

            - name: approle-pgbouncer1-new
              mountPath: /openbao/approle-secrets/pgbouncer1-new

            - name: approle-pgbouncer1-app
              mountPath: /openbao/approle-secrets/pgbouncer1-app

            - name: approle-dashboard-api
              mountPath: /openbao/approle-secrets/dashboard-api

            - name: approle-datahub-api
              mountPath: /openbao/approle-secrets/datahub-api

            - name: approle-rls-api
              mountPath: /openbao/approle-secrets/rls-api

            - name: approle-postgres-backup
              mountPath: /openbao/approle-secrets/postgres-backup

            - name: approle-pgbackrest
              mountPath: /openbao/approle-secrets/pgbackrest

            - name: approle-rqscheduler
              mountPath: /openbao/approle-secrets/rqscheduler

            - name: approle-kong
              mountPath: /openbao/approle-secrets/kong

            - name: approle-rabbitmq
              mountPath: /openbao/approle-secrets/rabbitmq

            - name: approle-oracle-app
              mountPath: /openbao/approle-secrets/oracle-app

            - name: approle-web-builder-api
              mountPath: /openbao/approle-secrets/web-builder-api

            - name: approle-clickhouse
              mountPath: /openbao/approle-secrets/clickhouse

            - name: approle-otel-collector
              mountPath: /openbao/approle-secrets/otel-collector

            - name: approle-pgbouncer-exporter
              mountPath: /openbao/approle-secrets/pgbouncer-exporter

            - name: approle-observability-api
              mountPath: /openbao/approle-secrets/observability-api

            - name: approle-platform-migrator
              mountPath: /openbao/approle-secrets/platform-migrator

            - name: approle-benchmark-runner
              mountPath: /openbao/approle-secrets/benchmark-runner

          # ============================================================
          # Resources
          #
          # Matches Docker:
          #   CPUs: 1
          #   memory: 512M
          # ============================================================

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "512Mi"

          # ============================================================
          # STARTUP PROBE
          #
          # Only checks that the OpenBao server process is listening.
          #
          # We intentionally DO NOT require .bootstrap-complete here.
          # Otherwise Kubernetes can repeatedly kill OpenBao while
          # bootstrap is still being performed.
          # ============================================================

          startupProbe:
            tcpSocket:
              port: api

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
            successThreshold: 1

          # ============================================================
          # READINESS PROBE
          #
          # This reproduces the important part of Docker healthcheck:
          #
          # test -f /openbao/init/.bootstrap-complete
          # AND
          # bao status -> Sealed false
          #
          # Pod is NOT Ready until bootstrap has completed and
          # OpenBao is unsealed.
          # ============================================================

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -f /openbao/init/.bootstrap-complete

                  export BAO_ADDR="https://127.0.0.1:8200"
                  export BAO_CACERT="/openbao/tls/tls.crt"

                  bao status 2>/dev/null | grep -q '^Sealed[[:space:]]*false'

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
            successThreshold: 1

          # ============================================================
          # LIVENESS PROBE
          #
          # Do NOT make liveness depend on bootstrap/unseal state.
          #
          # If OpenBao becomes sealed, restarting it continuously is not
          # useful and could create a restart loop.
          #
          # Liveness only verifies that the server process is alive.
          # ============================================================

          livenessProbe:
            tcpSocket:
              port: api

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

      # ================================================================
      # VOLUMES
      # ================================================================

      volumes:

        # ============================================================
        # Core OpenBao persistence
        # ============================================================

        - name: openbao-data
          persistentVolumeClaim:
            claimName: openbao-data-pvc-1
            
        - name: openbao-init
          persistentVolumeClaim:
            claimName: openbao-init-pvc-1

        - name: openbao-tls
          persistentVolumeClaim:
            claimName: openbao-tls-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ============================================================
        # AppRole persistence
        # ============================================================

        - name: approle-postgres-core
          persistentVolumeClaim:
            claimName: openbao-approle-postgres-core-pvc-1

        - name: approle-redis
          persistentVolumeClaim:
            claimName: openbao-approle-redis-pvc-1

        - name: approle-keydb
          persistentVolumeClaim:
            claimName: openbao-approle-keydb-pvc-1

        - name: approle-couchdb
          persistentVolumeClaim:
            claimName: openbao-approle-couchdb-pvc-1

        - name: approle-revolutio-app
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        - name: approle-pgbouncer1-new
          persistentVolumeClaim:
            claimName: openbao-approle-pgbouncer1-new-pvc-1

        - name: approle-pgbouncer1-app
          persistentVolumeClaim:
            claimName: openbao-approle-pgbouncer1-app-pvc-1

        - name: approle-dashboard-api
          persistentVolumeClaim:
            claimName: openbao-approle-dashboard-api-pvc-1

        - name: approle-datahub-api
          persistentVolumeClaim:
            claimName: openbao-approle-datahub-api-pvc-1

        - name: approle-rls-api
          persistentVolumeClaim:
            claimName: openbao-approle-rls-api-pvc-1

        - name: approle-postgres-backup
          persistentVolumeClaim:
            claimName: openbao-approle-postgres-backup-pvc-1

        - name: approle-pgbackrest
          persistentVolumeClaim:
            claimName: openbao-approle-pgbackrest-pvc-1

        - name: approle-rqscheduler
          persistentVolumeClaim:
            claimName: openbao-approle-rqscheduler-pvc-1

        - name: approle-kong
          persistentVolumeClaim:
            claimName: openbao-approle-kong-pvc-1

        - name: approle-rabbitmq
          persistentVolumeClaim:
            claimName: openbao-approle-rabbitmq-pvc-1

        - name: approle-oracle-app
          persistentVolumeClaim:
            claimName: openbao-approle-oracle-app-pvc-1

        - name: approle-web-builder-api
          persistentVolumeClaim:
            claimName: openbao-approle-web-builder-api-pvc-1

        - name: approle-clickhouse
          persistentVolumeClaim:
            claimName: openbao-approle-clickhouse-pvc-1

        - name: approle-otel-collector
          persistentVolumeClaim:
            claimName: openbao-approle-otel-collector-pvc-1

        - name: approle-pgbouncer-exporter
          persistentVolumeClaim:
            claimName: openbao-approle-pgbouncer-exporter-pvc-1

        - name: approle-observability-api
          persistentVolumeClaim:
            claimName: openbao-approle-observability-api-pvc-1

        - name: approle-platform-migrator
          persistentVolumeClaim:
            claimName: openbao-approle-platform-migrator-pvc-1

        - name: approle-benchmark-runner
          persistentVolumeClaim:
            claimName: openbao-approle-benchmark-runner-pvc-1
