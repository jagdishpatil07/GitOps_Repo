apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  namespace: myapp
  labels:
    app: openbao
    component: secrets-management

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: openbao

  # Single OpenBao instance using persistent single-node Raft storage.
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: openbao
        component: secrets-management

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      dnsPolicy: ClusterFirst

      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: openbao

          image: revolutio.azurecr.io/revolutio_kubernetes/openbao:latest
          imagePullPolicy: Always

          env:
            - name: TZ
              value: "UTC"

          ports:
            - name: api
              containerPort: 8200
              protocol: TCP

            - name: cluster
              containerPort: 8201
              protocol: TCP

          # Docker equivalent:
          # cap_add:
          #   - IPC_LOCK
          securityContext:
            capabilities:
              add:
                - IPC_LOCK

          volumeMounts:

            # ============================================================
            # OpenBao file storage
            #
            # Used by the bootstrap/migration process.
            # ============================================================

            - name: openbao-data
              mountPath: /openbao/data

            # ============================================================
            # OpenBao Raft storage
            #
            # IMPORTANT:
            # config.hcl uses:
            #
            # storage "raft" {
            #   path = "/openbao/raft"
            # }
            #
            # Therefore this PVC MUST be mounted exactly here.
            # ============================================================

            - name: openbao-raft
              mountPath: /openbao/raft

            # ============================================================
            # OpenBao bootstrap/init data
            # ============================================================

            - name: openbao-init
              mountPath: /openbao/init

            # ============================================================
            # TLS
            # ============================================================

            - name: openbao-tls
              mountPath: /openbao/tls
              readOnly: true

            # ============================================================
            # Shared certificates
            # ============================================================

            - name: shared-certs
              mountPath: /shared-certs

            # ============================================================
            # AppRole secret volumes
            # ============================================================

            - name: approle-postgres-core
              mountPath: /openbao/approle-secrets/postgres-core

            - name: approle-redis
              mountPath: /openbao/approle-secrets/redis

            - name: approle-keydb
              mountPath: /openbao/approle-secrets/keydb

            - name: approle-couchdb
              mountPath: /openbao/approle-secrets/couchdb

            - name: approle-revolutio-app
              mountPath: /openbao/approle-secrets/revolutio-app

            - name: approle-pgbouncer1-new
              mountPath: /openbao/approle-secrets/pgbouncer1-new

            - name: approle-pgbouncer1-app
              mountPath: /openbao/approle-secrets/pgbouncer1-app

            - name: approle-dashboard-api
              mountPath: /openbao/approle-secrets/dashboard-api

            - name: approle-datahub-api
              mountPath: /openbao/approle-secrets/datahub-api

            - name: approle-postgres-backup
              mountPath: /openbao/approle-secrets/postgres-backup

            - name: approle-pgbackrest
              mountPath: /openbao/approle-secrets/pgbackrest

            - name: approle-rqscheduler
              mountPath: /openbao/approle-secrets/rqscheduler

            - name: approle-kong
              mountPath: /openbao/approle-secrets/kong

            - name: approle-rabbitmq
              mountPath: /openbao/approle-secrets/rabbitmq

            - name: approle-platform-migrator
              mountPath: /openbao/approle-secrets/platform-migrator

          # ============================================================
          # Resources
          # ============================================================

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "512Mi"

          # ============================================================
          # STARTUP PROBE
          #
          # Only verifies that OpenBao is listening.
          # ============================================================

          startupProbe:
            tcpSocket:
              port: api

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
            successThreshold: 1

          # ============================================================
          # READINESS PROBE
          #
          # OpenBao becomes Ready only after bootstrap is complete
          # and the server is unsealed.
          # ============================================================

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -f /openbao/init/.bootstrap-complete

                  export BAO_ADDR="https://127.0.0.1:8200"
                  export BAO_CACERT="/openbao/tls/tls.crt"

                  bao status 2>/dev/null | grep -q '^Sealed[[:space:]]*false'

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
            successThreshold: 1

          # ============================================================
          # LIVENESS PROBE
          #
          # Only verifies that the OpenBao server is listening.
          # It does not depend on bootstrap/unseal state.
          # ============================================================

          livenessProbe:
            tcpSocket:
              port: api

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1

      # ================================================================
      # VOLUMES
      # ================================================================

      volumes:

        # ============================================================
        # OpenBao file storage
        # ============================================================

        - name: openbao-data
          persistentVolumeClaim:
            claimName: openbao-data-pvc-1

        # ============================================================
        # OpenBao integrated Raft storage
        #
        # This is the critical new persistent volume.
        # ============================================================

        - name: openbao-raft
          persistentVolumeClaim:
            claimName: openbao-raft-pvc-1

        # ============================================================
        # Bootstrap/init persistence
        # ============================================================

        - name: openbao-init
          persistentVolumeClaim:
            claimName: openbao-init-pvc-1

        # ============================================================
        # TLS
        # ============================================================

        - name: openbao-tls
          persistentVolumeClaim:
            claimName: openbao-tls-pvc-1

        # ============================================================
        # Shared certificates
        # ============================================================

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # ============================================================
        # AppRole persistence
        # ============================================================

        - name: approle-postgres-core
          persistentVolumeClaim:
            claimName: openbao-approle-postgres-core-pvc-1

        - name: approle-redis
          persistentVolumeClaim:
            claimName: openbao-approle-redis-pvc-1

        - name: approle-keydb
          persistentVolumeClaim:
            claimName: openbao-approle-keydb-pvc-1

        - name: approle-couchdb
          persistentVolumeClaim:
            claimName: openbao-approle-couchdb-pvc-1

        - name: approle-revolutio-app
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        - name: approle-pgbouncer1-new
          persistentVolumeClaim:
            claimName: openbao-approle-pgbouncer1-new-pvc-1

        - name: approle-pgbouncer1-app
          persistentVolumeClaim:
            claimName: openbao-approle-pgbouncer1-app-pvc-1

        - name: approle-dashboard-api
          persistentVolumeClaim:
            claimName: openbao-approle-dashboard-api-pvc-1
          #emptyDir: {}

        - name: approle-datahub-api
          persistentVolumeClaim:
            claimName: openbao-approle-datahub-api-pvc-1
          #emptyDir: {}

        - name: approle-postgres-backup
          persistentVolumeClaim:
            claimName: openbao-approle-postgres-backup-pvc-1

        - name: approle-pgbackrest
          persistentVolumeClaim:
            claimName: openbao-approle-pgbackrest-pvc-1

        - name: approle-rqscheduler
          persistentVolumeClaim:
            claimName: openbao-approle-rqscheduler-pvc-1

        - name: approle-kong
          persistentVolumeClaim:
            claimName: openbao-approle-kong-pvc-1

        - name: approle-rabbitmq
          persistentVolumeClaim:
            claimName: openbao-approle-rabbitmq-pvc-1

        - name: approle-platform-migrator
          persistentVolumeClaim:
            claimName: openbao-approle-platform-migrator-pvc-1

