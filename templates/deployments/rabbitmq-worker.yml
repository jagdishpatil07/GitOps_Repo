apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-worker
  namespace: myapp
  labels:
    app: rabbitmq-worker

spec:
  replicas: 1
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: rabbitmq-worker

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: rabbitmq-worker

    spec:
      imagePullSecrets:
        - name: acr-secret

      terminationGracePeriodSeconds: 30

      containers:
        - name: rabbitmq-worker

          image: revolutio.azurecr.io/revolutio_kubernetes/datahub-api:latest
          imagePullPolicy: Always

          # IMPORTANT:
          # Keep the image ENTRYPOINT so OpenBao secrets are fetched.
          # These become arguments to fetch-entrypoint.sh, which then
          # executes /wait-for-rabbit.sh.
          args:
            - bash
            - /wait-for-rabbit.sh

          env:

            # -------------------------
            # General
            # -------------------------
            - name: TZ
              value: "UTC"

            # -------------------------
            # PostgreSQL
            # -------------------------
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: envs-production-web
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: envs-production-web
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: envs-production-web
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: envs-production-web
                  key: POSTGRES_USER

            # -------------------------
            # OpenBao
            # -------------------------
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "datahub-api"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: "SECRET_KEY=django/secret_key,FERNET_SECRET=django/fernet_secret,POSTGRES_PASSWORD=postgres-core/platform_app,RABBITMQ_PASSWORD=rabbitmq/admin,REDIS_PASSWORD=cache/redis,COUCHDB_PASSWORD=couchdb/admin,DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key"

            - name: OPENBAO_URL_TEMPLATES
              value: "RABBITMQ_URL=amqp://guest:$${RABBITMQ_PASSWORD}@rabbitmq:5672/,REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0"

          volumeMounts:

            - name: openbao-approle-datahub-api
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            - name: platform-configs
              mountPath: /app/Platform_Configs

            - name: assets
              mountPath: /app/assets

      restartPolicy: Always

      volumes:

        - name: openbao-approle-datahub-api
          persistentVolumeClaim:
            claimName: openbao-approle-datahub-api-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: assets
          persistentVolumeClaim:
            claimName: static-pvc-1
