apiVersion: apps/v1
kind: Deployment
metadata:
  name: saml
  namespace: {{ .Values.global.namespace }}
  labels:
    service: saml

spec:
  replicas: 1

  selector:
    matchLabels:
      service: saml

  template:
    metadata:
      labels:
        service: saml

    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName }}

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      volumes:
        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.platformConfigs }}

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.media }}

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.assets }}

      containers:
        - name: saml
          image: "{{ .Values.saml.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: {{ .Values.saml.resources.requests.cpu }}
              memory: {{ .Values.saml.resources.requests.memory }}

            limits:
              cpu: {{ .Values.saml.resources.limits.cpu }}
              memory: {{ .Values.saml.resources.limits.memory }}

          ports:
            - name: uvicorn
              containerPort: 9000
              protocol: TCP

          env:
            - name: TZ
              value: "UTC"

            - name: DJANGO_SETTINGS_MODULE
              value: "saml.settings"

            - name: GRPC_DNS_RESOLVER
              value: "native"

            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

          envFrom:
            - configMapRef:
                name: {{ .Values.saml.configMaps.web }}

            - configMapRef:
                name: {{ .Values.saml.configMaps.postgres }}

            - secretRef:
                name: {{ .Values.saml.secrets.web }}

            - secretRef:
                name: {{ .Values.saml.secrets.postgres }}

          volumeMounts:
            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: assets-storage
              mountPath: /opt/revolutio/assets

          command:
            - /bin/bash

          args:
            - -c
            - |
              exec uvicorn saml.asgi:application \
                --host 0.0.0.0 \
                --port 9000 \
                --workers 1

          readinessProbe:
            httpGet:
              path: /accounts/saml/health/
              port: uvicorn
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /accounts/saml/health/
              port: uvicorn
              scheme: HTTP
            initialDelaySeconds: 120
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 5

          terminationMessagePath: /tmp/web-log
          terminationMessagePolicy: File

      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
