apiVersion: apps/v1
kind: Deployment
metadata:
  name: saml
  namespace: {{ .Values.namespace }}
  labels:
    service: saml

spec:
  replicas: 1

  selector:
    matchLabels:
      service: saml

  template:
    metadata:
      labels:
        service: saml

    spec:
      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      volumes:
        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.platformConfigs }}

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.media }}

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.assets }}

        - name: tmp-storage
          emptyDir: {}

        - name: temp-storage
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: logs-storage
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

      containers:
        - name: saml
          image: "{{ .Values.saml.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070

          ports:
            - name: uvicorn
              containerPort: 9000

          ########################################################
          # ✅ ENV FIXES
          ########################################################
          env:
            - name: TZ
              value: "UTC"

            - name: DJANGO_SETTINGS_MODULE
              value: "saml.settings"

            - name: GRPC_DNS_RESOLVER
              value: "native"

            - name: NUMBA_CACHE_DIR
              value: /tmp

            - name: XDG_CACHE_HOME
              value: /tmp/.cache

            - name: FONTCONFIG_PATH
              value: /etc/fonts

            - name: FONTCONFIG_FILE
              value: /etc/fonts/fonts.conf

            # ✅ force single worker
            - name: WEB_CONCURRENCY
              value: "1"

          envFrom:
            - configMapRef:
                name: {{ .Values.saml.configMaps.web }}
            - configMapRef:
                name: {{ .Values.saml.configMaps.postgres }}
            - secretRef:
                name: {{ .Values.saml.secrets.web }}
            - secretRef:
                name: {{ .Values.saml.secrets.postgres }}

          volumeMounts:
            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: assets-storage
              mountPath: /opt/revolutio/assets

            - name: tmp-storage
              mountPath: /tmp

            - name: temp-storage
              mountPath: /opt/temp

            - name: logs-storage
              mountPath: /opt/revolutio/logs

          ########################################################
          # ✅ BOOTSTRAP + SINGLE WORKER
          ########################################################
          command:
            - /bin/bash
          args:
            - -c
            - |
              echo "====== SAML BOOTSTRAP START ======"

              if [ -f /Installation_ref/scripts/start ]; then
                /Installation_ref/scripts/start &
              fi

              sleep 20

              echo "====== STARTING SAML SINGLE WORKER ======"

              pkill -f uvicorn || true
              pkill -f gunicorn || true

              exec uvicorn saml.asgi:application \
                --host 0.0.0.0 \
                --port 9000 \
                --workers 1 \
                --lifespan off \
                --timeout-keep-alive 60 \
                --log-level info

          ########################################################
          # ✅ PRODUCTION-GRADE PROBES (HTTP - BEST PRACTICE)
          ########################################################
          readinessProbe:
            httpGet:
              path: /
              port: uvicorn
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: uvicorn
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5

      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst

  strategy:
    type: RollingUpdate
