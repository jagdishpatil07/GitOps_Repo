apiVersion: apps/v1
kind: Deployment
metadata:
  name: saml
  namespace: myapp

spec:
  replicas: 1

  selector:
    matchLabels:
      service: saml

  template:
    metadata:
      labels:
        service: saml

    spec:
      serviceAccountName: default

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      terminationGracePeriodSeconds: 3

      containers:
        - name: saml

          image: revolutio.azurecr.io/revolutio_kubernetes/revolutio:latest

          command:
            - /usr/local/bin/fetch-entrypoint.sh

          args:
            - bash
            - -c
            - >-
              gunicorn saml.asgi:application
              --bind 0.0.0.0:9000
              --workers 1
              --worker-class uvicorn.workers.UvicornWorker

          ports:
            - containerPort: 9000
              protocol: TCP

          env:
            - name: DJANGO_SETTINGS_MODULE
              value: "saml.settings"

            - name: GRPC_DNS_RESOLVER
              value: "native"

            - name: MALLOC_ARENA_MAX
              value: "2"

            - name: TZ
              value: "UTC"

            - name: POSTGRES_USER
              value: "platform_app"

            - name: POSTGRES_HOST
              value: "pgbouncer1-new"

            - name: POSTGRES_DB
              value: "Platform_DB"

            - name: POSTGRES_PORT
              value: "5432"

            - name: DATABASE_TYPE
              value: "PostgreSQL"

            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: "6379"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "revolutio-app"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: "SECRET_KEY=django/secret_key,FERNET_SECRET=django/fernet_secret,DATABASE_CREDENTIAL_MASTER_KEY=django/database_credential_master_key,DJANGO_SUPERUSER_PASSWORD=django/superuser_password,REDIS_PASSWORD=cache/redis,KEYDB_PASSWORD=cache/keydb,POSTGRES_PASSWORD=postgres-core/platform_app"

            - name: OPENBAO_URL_TEMPLATES
              value: "REDIS_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0,REDIS_URL_SCHEDULER=redis://:$${REDIS_PASSWORD}@redis:6379/1,REDIS_CACHE_LOCATION=redis://:$${KEYDB_PASSWORD}@keydb:6379"

          envFrom:
            - configMapRef:
                name: envs-production-web

            - configMapRef:
                name: envs-production-postgres-core

          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

          volumeMounts:
            - name: platform-configs
              mountPath: /opt/revolutio/Platform_Configs

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            - name: temp
              mountPath: /opt/temp

            - name: logs
              mountPath: /opt/revolutio/logs

            - name: tmp
              mountPath: /tmp

            - name: gunicorn
              mountPath: /home/revolutio/.gunicorn

          startupProbe:
            exec:
              command:
                - /bin/bash
                - /opt/revolutio/healthcheck_saml.sh
                - "9000"
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - /opt/revolutio/healthcheck_saml.sh
                - "9000"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - /opt/revolutio/healthcheck_saml.sh
                - "9000"
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          terminationMessagePath: /tmp/web-log

      volumes:
        - name: platform-configs
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        - name: temp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: logs
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi

        - name: gunicorn
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
