apiVersion: apps/v1
kind: Deployment
metadata:
  name: saml
  namespace: {{ .Values.namespace }}
  labels:
    service: saml

spec:
  replicas: 1

  selector:
    matchLabels:
      service: saml

  template:
    metadata:
      labels:
        service: saml

    spec:
      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      volumes:
        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.platformConfigs }}

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.media }}

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.assets }}

      containers:
        - name: saml
          image: "{{ .Values.saml.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070

          resources:
            requests:
              cpu: {{ .Values.saml.resources.requests.cpu }}
              memory: {{ .Values.saml.resources.requests.memory }}
            limits:
              cpu: {{ .Values.saml.resources.limits.cpu }}
              memory: {{ .Values.saml.resources.limits.memory }}

          ports:
            - name: uvicorn
              containerPort: 9000

          ########################################################
          # ✅ SAME PROBES AS WEB
          ########################################################
          readinessProbe:
            httpGet:
              path: /
              port: uvicorn
            initialDelaySeconds: 120
            periodSeconds: 20

          livenessProbe:
            httpGet:
              path: /
              port: uvicorn
            initialDelaySeconds: 120
            periodSeconds: 30

          ########################################################
          # ✅ SAME ENV (NO EXTRA ADDED)
          ########################################################
          env:
            - name: DATABASE_URL
              value: {{ .Values.web.databaseUrl | quote }}

          envFrom:
            - configMapRef:
                name: {{ .Values.web.configMaps.web }}
            - configMapRef:
                name: {{ .Values.web.configMaps.postgres }}
            - secretRef:
                name: {{ .Values.web.secrets.web }}
            - secretRef:
                name: {{ .Values.web.secrets.postgres }}

          ########################################################
          # ✅ SAME VOLUMES
          ########################################################
          volumeMounts:
            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: assets-storage
              mountPath: /opt/revolutio/assets

          ########################################################
          # ✅ SAME START LOGIC (SINGLE WORKER)
          ########################################################
          command:
            - /bin/bash
          args:
            - -c
            - |
              echo "====== BOOTSTRAP START ======"

              # run bootstrap
              /Installation_ref/scripts/start &

              sleep 20

              echo "====== SWITCHING TO SINGLE WORKER ======"

              # kill multi workers
              pkill -f uvicorn || true

              # start single worker SAML
              exec uvicorn saml.asgi:application \
                --host 0.0.0.0 \
                --port 9000 \
                --workers 1 \
                --lifespan off \
                --timeout-keep-alive 60 \
                --log-level info

      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst

  strategy:
    type: RollingUpdate
