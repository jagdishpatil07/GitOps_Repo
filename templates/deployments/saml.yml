apiVersion: apps/v1
kind: Deployment
metadata:
  name: saml
  namespace: {{ .Values.namespace }}
  labels:
    service: saml

spec:
  replicas: 1

  selector:
    matchLabels:
      service: saml

  template:
    metadata:
      labels:
        service: saml

    spec:
      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      ########################################################
      # ✅ VOLUMES
      ########################################################
      volumes:
        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.platformConfigs }}

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.media }}

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.saml.pvc.assets }}

        - name: tmp-storage
          emptyDir: {}

      ########################################################
      # ✅ CONTAINER
      ########################################################
      containers:
        - name: saml
          image: "{{ .Values.saml.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070

          ports:
            - name: uvicorn
              containerPort: 9000

          ########################################################
          # ✅ ENV
          ########################################################
          env:
            - name: TZ
              value: "UTC"

            - name: DJANGO_SETTINGS_MODULE
              value: "saml.settings"

            - name: WEB_CONCURRENCY
              value: "1"

          envFrom:
            - configMapRef:
                name: {{ .Values.saml.configMaps.web }}
            - configMapRef:
                name: {{ .Values.saml.configMaps.postgres }}
            - secretRef:
                name: {{ .Values.saml.secrets.web }}
            - secretRef:
                name: {{ .Values.saml.secrets.postgres }}

          ########################################################
          # ✅ VOLUME MOUNTS
          ########################################################
          volumeMounts:
            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: assets-storage
              mountPath: /opt/revolutio/assets

            - name: tmp-storage
              mountPath: /tmp

          ########################################################
          # ✅ DIRECT UVICORN (SINGLE WORKER ✅)
          ########################################################
          command: ["uvicorn"]
          args:
            - "saml.asgi:application"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9000"
            - "--workers"
            - "1"
            - "--lifespan"
            - "off"

          ########################################################
          # ✅ STABLE PROBES ✅
          ########################################################
          readinessProbe:
            httpGet:
              path: /
              port: uvicorn
            initialDelaySeconds: 120
            periodSeconds: 20

          livenessProbe:
            httpGet:
              path: /
              port: uvicorn
            initialDelaySeconds: 120
            periodSeconds: 30

      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst

  strategy:
    type: RollingUpdate
