apiVersion: apps/v1
kind: Deployment

metadata:
  name: tenancy
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    service: tenancy

spec:
  replicas: 1

  selector:
    matchLabels:
      service: tenancy

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: tenancy

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

      containers:

        - name: tenancy

          image: revolutio.azurecr.io/revolutio_kubernetes/tenancy:bod-stable-2026.10.3
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:

            - name: TZ
              value: "UTC"

            - name: TENANCY_CONFIG_PATH
              value: "/app/Platform_Configs/"

            # ==========================================================
            # OpenBao
            # ==========================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ENV_FILE
              value: "/tmp/openbao-env.sh"

            - name: OPENBAO_ROLE_ID
              value: "tenancy"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRETS
              value: "TENANCY_DB_PASSWORD=tenancy/db,TENANCY_TOKEN_IDAM=tenancy/caller_idam,TENANCY_TOKEN_DATAHUBAPI=tenancy/caller_datahubapi,TENANCY_TOKEN_DASHBOARDAPI=tenancy/caller_dashboardapi,TENANCY_TOKEN_VANTAGE=tenancy/caller_vantage,TENANCY_TOKEN_RELAY=tenancy/caller_relay,TENANCY_TOKEN_QUASAR=tenancy/caller_quasar"

            - name: OPENBAO_URL_TEMPLATES
              value: "TENANCY_DSN=postgresql://tenancy_app:$${TENANCY_DB_PASSWORD}@postgres-core:5432/$${PLATFORM_DB_NAME}"

          envFrom:

            - configMapRef:
                name: envs-production-web

            - configMapRef:
                name: envs-production-postgres-core

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

          volumeMounts:

            - name: platformconfig-storage
              mountPath: /app/Platform_Configs
              readOnly: true

            - name: openbao-approle-shared
              mountPath: /openbao-approle
              subPath: tenancy
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            - name: tmp
              mountPath: /tmp
