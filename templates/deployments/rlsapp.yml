apiVersion: apps/v1
kind: Deployment

metadata:
  name: rlsapp
  namespace: {{ .Values.namespace }}
  labels:
    service: rlsapp

spec:
  replicas: 1

  selector:
    matchLabels:
      service: rlsapp

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: rlsapp

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: registry-cred

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      terminationGracePeriodSeconds: 30

      containers:
        - name: rlsapp

          image: revolutio.azurecr.io/revolutio_kubernetes/rls-app:bod-stable-2026.10.3
          imagePullPolicy: Always

          stdin: true
          tty: true

          ports:
            - name: http
              containerPort: 3004
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"

            - name: CHOKIDAR_USEPOLLING
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "2Gi"

          startupProbe:
            tcpSocket:
              port: 3004
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 3004
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 3004
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: node-modules
              mountPath: /rls-app/node_modules

      volumes:
        - name: node-modules
          emptyDir: {}
