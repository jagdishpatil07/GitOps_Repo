apiVersion: apps/v1
kind: Deployment

metadata:
  name: rlsapp
  namespace: {{ .Values.namespace }}
  labels:
    service: rlsapp

spec:
  replicas: 1

  selector:
    matchLabels:
      service: rlsapp

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: rlsapp

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: registry-cred

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      terminationGracePeriodSeconds: 30

      containers:
        - name: rlsapp

          image: revolutio.azurecr.io/revolutio_kubernetes/rls-app:bod-stable-2026.10.3
          imagePullPolicy: Always

          stdin: true
          tty: true

          env:
            - name: NODE_ENV
              value: "production"

            - name: CHOKIDAR_USEPOLLING
              value: "true"

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: node-modules
              mountPath: /rls-app/node_modules

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /run

            - name: nginx-run
              mountPath: /var/run

            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "2Gi"

      volumes:
        - name: node-modules
          emptyDir: {}

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
