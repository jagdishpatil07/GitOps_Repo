apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-tenant
  namespace: myapp
  labels:
    app: worker-tenant

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker-tenant

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: worker-tenant

    spec:
      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: worker-tenant
          image: revolutio.azurecr.io/revolutio_kubernetes/web:latest
          imagePullPolicy: Always

          args:
            - /rqworker/start-tenant

          env:
            - name: DATABASE_URL
              value: "postgresql://platform_app:<password>@pgbouncer-service:5432/platform"

            - name: REDIS_URL
              value: "redis://redis:6379/0"

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/shared-certs/tls.crt"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/revolutio-app/secret_id"

          envFrom:
            - configMapRef:
                name: web-config

            - configMapRef:
                name: postgres-config

            - secretRef:
                name: web-secret

            - secretRef:
                name: postgres-secret

          volumeMounts:
            - name: static-storage
              mountPath: /opt/revolutio/static

            - name: templates-storage
              mountPath: /opt/revolutio/Core/templates/user_defined_template

            - name: platformconfig-storage
              mountPath: /opt/revolutio/Platform_Configs

            - name: computation-storage
              mountPath: /opt/revolutio/Computation_Temp_Storage

            - name: media-storage
              mountPath: /opt/revolutio/Core/media

            - name: openbao-approle-revolutio-app
              mountPath: /openbao/approle-secrets/revolutio-app
              readOnly: true

            - name: shared-certs
              mountPath: /shared-certs
              readOnly: true

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc-1

        - name: templates-storage
          persistentVolumeClaim:
            claimName: user-defined-template-pvc-2

        - name: platformconfig-storage
          persistentVolumeClaim:
            claimName: platform-configs-pvc-1

        - name: computation-storage
          persistentVolumeClaim:
            claimName: computation-storage-pvc-1

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: openbao-approle-revolutio-app
          persistentVolumeClaim:
            claimName: openbao-approle-revolutio-app-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
