apiVersion: batch/v1
kind: Job
metadata:
  name: init-file-copy
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: OnFailure

      containers:
      - name: helper
        image: alpine/git
        command: ["/bin/sh", "-c"]

        args:
          - |
            set -e

            echo "Cloning repo..."
            git clone https://github.com/jagdishpatil07/GitOps_Repo.git /repo

            cd /repo/FILES

            ###################################
            # NGINX FILES (CLEAN + CORRECT)
            ###################################
            echo "Copying nginx configs..."

            # Clean wrong/old files
            rm -f /nginx/blockuseragents.rules || true
            rm -f /nginx/*.bkp || true

            mkdir -p /nginx/conf.d

            # Copy correctly
            cp -f nginx/nginx.conf /nginx/nginx.conf
            cp -f nginx/mime.types /nginx/mime.types
            cp -f nginx/blockuseragents.rules /nginx/conf.d/blockuseragents.rules

            ###################################
            # PLATFORM CONFIGS
            ###################################
            echo "Copying platform configs..."

            mkdir -p /platform

            cp -f platform/*.json /platform/ || true
            cp -f platform/allowed_host.txt /platform/ || true

            ###################################
            # POSTGRES CONFIGS (SAFE + EXACT)
            ###################################
            echo "Copying postgres configs..."

            PGDATA="/postgres/pgdata"

            mkdir -p $PGDATA

            # ONLY replace config files (do NOT touch data dirs)
            cp -f postgres/postgresql.conf $PGDATA/postgresql.conf
            cp -f postgres/pg_hba.conf $PGDATA/pg_hba.conf

            chmod 600 $PGDATA/postgresql.conf || true
            chmod 600 $PGDATA/pg_hba.conf || true

            ###################################
            # DEBUG
            ###################################
            echo "NGINX STRUCTURE:"
            ls -R /nginx

            echo "PLATFORM STRUCTURE:"
            ls -l /platform

            echo "POSTGRES STRUCTURE:"
            ls -l $PGDATA

            echo "File copy completed successfully"

            sleep 5

        volumeMounts:

        - name: nginx-pvc
          mountPath: /nginx

        - name: platform-pvc
          mountPath: /platform

        - name: postgres-pvc
          mountPath: /postgres

      volumes:

      - name: nginx-pvc
        persistentVolumeClaim:
          claimName: nginx-conf-pvc-1

      - name: platform-pvc
        persistentVolumeClaim:
          claimName: platform-configs-pvc-1

      - name: postgres-pvc
        persistentVolumeClaim:
          claimName: postgresql-data-new-pvc-11
