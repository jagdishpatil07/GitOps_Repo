apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: myapp
  labels:
    service: redis

spec:
  replicas: 1

  selector:
    matchLabels:
      service: redis

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: redis

    spec:
      imagePullSecrets:
        - name: acr-secret

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      restartPolicy: Always
      terminationGracePeriodSeconds: 3
      dnsPolicy: ClusterFirst

      containers:
        - name: redis

          image: revolutio.azurecr.io/revolutio_kubernetes/redis:latest
          imagePullPolicy: Always

          # Keep the image ENTRYPOINT.
          #
          # Docker Compose:
          # command: docker-entrypoint.sh redis-server --maxmemory 512mb --maxmemory-policy noeviction
          #
          # Kubernetes passes the same command as arguments.
          args:
            - docker-entrypoint.sh
            - redis-server
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - noeviction

          env:

            # -------------------------
            # OpenBao
            # -------------------------
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "redis"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRET_PATH
              value: "cache/redis"

            # -------------------------
            # General
            # -------------------------
            - name: TZ
              value: "UTC"

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "1Gi"

          volumeMounts:

            # -------------------------
            # OpenBao AppRole
            # -------------------------
            - name: openbao-approle-redis
              mountPath: /openbao-approle
              readOnly: true

            # -------------------------
            # OpenBao TLS certificate
            # -------------------------
            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # -------------------------
            # Redis data
            # -------------------------
            - name: redis-data
              mountPath: /data

          # -------------------------
          # Docker healthcheck:
          # redis-cli ping
          # -------------------------
          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 50

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:

        # -------------------------
        # OpenBao AppRole
        # -------------------------
        - name: openbao-approle-redis
          persistentVolumeClaim:
            claimName: openbao-approle-redis-pvc-1

        # -------------------------
        # OpenBao TLS
        # -------------------------
        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

        # -------------------------
        # Redis /data
        # -------------------------
        - name: redis-data
          emptyDir: {}
