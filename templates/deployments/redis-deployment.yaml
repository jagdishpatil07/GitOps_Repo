apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    service: redis

spec:
  replicas: {{ .Values.redis.replicaCount }}

  selector:
    matchLabels:
      service: redis

  template:
    metadata:
      labels:
        service: redis

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      # ✅ REQUIRED (matches OpenShift behavior)
      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      containers:
        - name: redis
          image: "{{ .Values.redis.image }}"
          imagePullPolicy: IfNotPresent

          command:
            - redis-server

          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            - "--stop-writes-on-bgsave-error"
            - "no"

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: REDIS_PASSWORD

          ports:
            - containerPort: 6379
              protocol: TCP

          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600