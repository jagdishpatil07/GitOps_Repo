apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    service: redis

spec:
  replicas: {{ .Values.redis.replicaCount }}

  selector:
    matchLabels:
      service: redis

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: redis

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      restartPolicy: Always

      terminationGracePeriodSeconds: 3

      dnsPolicy: ClusterFirst

      containers:
        - name: redis

          image: {{ .Values.redis.image }}
          imagePullPolicy: Always

          # Keep the image ENTRYPOINT.
          # Docker Compose command is passed as arguments.
          args:
            - docker-entrypoint.sh
            - redis-server
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - noeviction

          env:

            # ==================================================
            # OpenBao
            # ==================================================

            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "redis"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao/approle-secrets/redis/secret_id"

            - name: OPENBAO_SECRET_PATH
              value: "cache/redis"

            # ==================================================
            # General
            # ==================================================

            - name: TZ
              value: "UTC"

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu | quote }}
              memory: {{ .Values.redis.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.redis.resources.limits.cpu | quote }}
              memory: {{ .Values.redis.resources.limits.memory | quote }}

          volumeMounts:

            # ==================================================
            # OpenBao AppRole
            # ==================================================

            - name: openbao-approle-shared
              mountPath: /openbao/approle-secrets/
              readOnly: true

            # ==================================================
            # OpenBao TLS certificate
            # ==================================================

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

            # ==================================================
            # Redis data
            # ==================================================

            - name: redis-data
              mountPath: /data

          # ====================================================
          # Redis health checks
          # ====================================================

          startupProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 50

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:

        # ======================================================
        # OpenBao AppRole
        # ======================================================

        - name: openbao-approle-shared
          persistentVolumeClaim:
            claimName: openbao-approle-shared-pvc-1

        # ======================================================
        # OpenBao TLS
        # ======================================================

        - name: shared-certs
          persistentVolumeClaim:
            claimName: {{ .Values.redis.pvc.sharedCerts }}

        # ======================================================
        # Redis /data
        # ======================================================

        - name: redis-data
          emptyDir: {}
