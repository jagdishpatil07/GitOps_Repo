apiVersion: batch/v1
kind: Job
metadata:
  name: platform-migrator-docker
  namespace: myapp
spec:
  backoffLimit: 1

  template:
    spec:
      restartPolicy: Never

      imagePullSecrets:
        - name: acr-secret

      containers:
        - name: platform-migrator-docker
          image: revolutio.azurecr.io/revolutio_kubernetes/platform-migrator:v0011
          imagePullPolicy: Always

          env:
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "platform-migrator"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: PM_DOCKER
              value: "1"

            - name: TZ
              value: "UTC"

          volumeMounts:
            - name: platform-migrator-state
              mountPath: /state

            - name: docker-sock
              mountPath: /var/run/docker.sock

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

      volumes:
        - name: platform-migrator-state
          persistentVolumeClaim:
            claimName: platform-migrator-state-pvc

        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-platform-migrator-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1
