apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: myapp
  labels:
    service: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      service: nginx

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000

      volumes:

        # Existing NGINX PVC
        - name: nginx-conf-storage
          persistentVolumeClaim:
            claimName: nginx-conf-pvc-1

        # Existing ConfigMap
        - name: nginx-config-cm
          configMap:
            name: nginx-config

        # NGINX cache
        - name: nginx-cache
          emptyDir: {}

        # NGINX runtime
        - name: nginx-run
          emptyDir: {}

        # Static files
        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc-1

        # Media files
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-1

      containers:

        - name: nginx

          image: "revolutio.azurecr.io/revolutio_kubernetes/nginx:latest"

          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true

          ports:

            - name: http
              containerPort: 8080
              protocol: TCP

            - name: https
              containerPort: 443
              protocol: TCP

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "========================================"
              echo "NGINX STARTUP"
              echo "========================================"

              echo "Checking SSL files..."

              if [ -f /etc/ssl/revolutio/ssl.crt ] && \
                 [ -f /etc/ssl/revolutio/ssl.key ]; then

                echo "SSL certificate found:"
                ls -lh /etc/ssl/revolutio/ssl.crt

                echo "SSL key found:"
                ls -lh /etc/ssl/revolutio/ssl.key

              else

                echo "ERROR: SSL files not found!"

                echo "Expected:"
                echo "  /etc/ssl/revolutio/ssl.crt"
                echo "  /etc/ssl/revolutio/ssl.key"

                echo "Actual directory:"
                ls -lah /etc/ssl/revolutio/ || true

                exit 1

              fi

              echo
              echo "Testing nginx configuration..."

              nginx -t

              echo
              echo "Starting nginx..."

              exec nginx -g "daemon off;"

          volumeMounts:

            # Existing NGINX PVC
            - name: nginx-conf-storage
              mountPath: /etc/nginx
              readOnly: true

            # SSL files from:
            # /data/nfs/nginx-conf-pvc-1/ssl/
            #
            # Inside container:
            # /etc/ssl/revolutio/ssl.crt
            # /etc/ssl/revolutio/ssl.key
            - name: nginx-conf-storage
              mountPath: /etc/ssl/revolutio
              subPath: ssl
              readOnly: true

            # Existing ConfigMap - nginx.conf
            - name: nginx-config-cm
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

            # Existing ConfigMap - mime.types
            - name: nginx-config-cm
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
              readOnly: true

            # Existing ConfigMap - blockuseragents.rules
            - name: nginx-config-cm
              mountPath: /etc/nginx/conf.d/blockuseragents.rules
              subPath: blockuseragents.rules
              readOnly: true

            # Existing ConfigMap - generated/default configuration
            - name: nginx-config-cm
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

            # NGINX cache
            - name: nginx-cache
              mountPath: /var/cache/nginx

            # NGINX runtime
            - name: nginx-run
              mountPath: /var/run

            # Static
            - name: static-storage
              mountPath: /var/www/revolutio/static

            # Media
            - name: media-storage
              mountPath: /var/www/revolutio/media

      terminationGracePeriodSeconds: 30

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600
