apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.global.namespace }}
  labels:
    service: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      service: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      serviceAccountName: {{ .Values.global.serviceAccountName }}

      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      terminationGracePeriodSeconds: 30

      containers:
        - name: nginx

          image: "{{ .Values.nginx.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          command:
            - nginx

          args:
            - -g
            - daemon off;

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

            - name: https
              containerPort: 443
              protocol: TCP

          env:
            - name: SERVER_NAME
              value: "_"

          volumeMounts:

            # Main nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

            # Rules file
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/blockuseragents.rules
              subPath: blockuseragents.rules
              readOnly: true

            # Mime types
            - name: nginx-config
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
              readOnly: true

            # SSL certificates
            - name: nginx-ssl
              mountPath: /etc/ssl/revolutio
              subPath: ssl
              readOnly: true

            # Static files
            - name: static-storage
              mountPath: /var/www/revolutio/static

            # Media files
            - name: media-storage
              mountPath: /var/www/revolutio/media

            # Assets
            - name: assets-storage
              mountPath: /var/www/asset

            # NGINX cache
            - name: nginx-cache
              mountPath: /var/cache/nginx

            # Runtime files
            - name: nginx-run
              mountPath: /run

            - name: nginx-run
              mountPath: /var/run

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:

        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0644

        - name: nginx-ssl
          persistentVolumeClaim:
            claimName: nginx-conf-pvc

        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc

        - name: assets-storage
          persistentVolumeClaim:
            claimName: assets-pvc

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
