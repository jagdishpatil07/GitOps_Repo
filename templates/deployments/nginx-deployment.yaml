apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: myapp
  labels:
    service: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      service: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000

      containers:
        - name: nginx
          image: revolutio.azurecr.io/revolutio_kubernetes/nginx:latest
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          command:
            - nginx

          args:
            - -g
            - daemon off;

          ports:
            - name: http
              containerPort: 8080

            - name: https
              containerPort: 443

          env:
            - name: SERVER_NAME
              value: "_"

          volumeMounts:

            # Main nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

            # Rules
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/blockuseragents.rules
              subPath: blockuseragents.rules
              readOnly: true

            # Mime types
            - name: nginx-config
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
              readOnly: true

            # SSL
            - name: nginx-ssl
              mountPath: /etc/ssl/revolutio
              subPath: ssl
              readOnly: true

            # Static
            - name: static-storage
              mountPath: /var/www/revolutio/static

            # Media
            - name: media-storage
              mountPath: /var/www/revolutio/media

            # Cache
            - name: nginx-cache
              mountPath: /var/cache/nginx

            # Runtime
            - name: nginx-run
              mountPath: /run

            - name: nginx-run
              mountPath: /var/run

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:

        - name: nginx-config
          configMap:
            name: nginx-config

        - name: nginx-ssl
          persistentVolumeClaim:
            claimName: nginx-conf-pvc-1

        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc-1

        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-1

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
