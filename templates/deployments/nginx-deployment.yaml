apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.global.namespace }}
  labels:
    service: nginx

spec:
  replicas: {{ .Values.nginx.replicaCount }}

  selector:
    matchLabels:
      service: nginx

  template:
    metadata:
      labels:
        service: nginx

    spec:
      serviceAccountName: {{ .Values.global.serviceAccountName }}

      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000

      volumes:
        - name: nginx-conf-storage
          persistentVolumeClaim:
            claimName: nginx-conf-pvc-1

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.media }}

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.static }}

        - name: nginx-cache
          emptyDir: {}

        - name: nginx-run
          emptyDir: {}

      containers:
        - name: nginx
          image: "{{ .Values.nginx.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070

          ports:
            - name: http
              containerPort: {{ .Values.nginx.port }}
              protocol: TCP

          volumeMounts:
            - name: nginx-conf-storage
              mountPath: /etc/nginx/

            - name: media-storage
              mountPath: /var/www/revolutio/media

            - name: static-storage
              mountPath: /var/www/revolutio/static

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /var/run

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      restartPolicy: Always
`
