apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    service: nginx

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      service: nginx

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000
        seccompProfile:
          type: RuntimeDefault

      volumes:

        ######################################################
        # NGINX CONFIG
        ######################################################

        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0444

        ######################################################
        # NGINX WRITABLE RUNTIME DIRECTORIES
        ######################################################

        - name: nginx-conf-d
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        ######################################################
        # APPLICATION STORAGE
        ######################################################

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.static }}

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.media }}

        ######################################################
        # ASSETS
        ######################################################
        # IMPORTANT:
        # Keep this only if nginx.pvc.assets exists in values.yaml.
        # Otherwise remove this volume and its mount.

        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.assets }}

      containers:

        - name: nginx

          image: "{{ .Values.nginx.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

            - name: https
              containerPort: 8443
              protocol: TCP

          env:
            - name: SERVER_NAME
              value: "_"

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"

          ####################################################
          # START NGINX
          ####################################################

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -eu

              echo "========================================"
              echo "Starting NGINX"
              echo "========================================"

              echo "NGINX version:"
              nginx -v

              echo "Checking configuration..."

              nginx -t

              echo "Starting NGINX..."

              exec nginx -g 'daemon off;'

          ####################################################
          # CONFIGURATION
          ####################################################

          volumeMounts:

            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

            - name: nginx-config
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
              readOnly: true

            - name: nginx-config
              mountPath: /etc/nginx/blockuseragents.rules
              subPath: blockuseragents.rules
              readOnly: true

            ##################################################
            # Writable conf.d because root filesystem is RO
            ##################################################

            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d

            ##################################################
            # Runtime
            ##################################################

            - name: nginx-run
              mountPath: /run

            - name: nginx-cache
              mountPath: /var/cache/nginx

            ##################################################
            # Static
            ##################################################

            - name: static-storage
              mountPath: /var/www/revolutio/static
              readOnly: true

            ##################################################
            # Media
            ##################################################

            - name: media-storage
              mountPath: /var/www/revolutio/media

            ##################################################
            # Assets
            ##################################################

            - name: assets-storage
              mountPath: /var/www/asset
              readOnly: true

          ####################################################
          # PROBES
          ####################################################

          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
