apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    service: nginx

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      service: nginx

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 30

      ########################################################
      # POD SECURITY
      ########################################################
      securityContext:
        runAsNonRoot: true
        runAsUser: 70070
        fsGroup: 1000860000
        seccompProfile:
          type: RuntimeDefault

      ########################################################
      # VOLUMES
      ########################################################
      volumes:

        # NGINX configuration supplied by ConfigMap
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0444

        # Docker-compose equivalent:
        # /etc/nginx/conf.d -> tmpfs
        - name: nginx-conf-d
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        # Docker-compose equivalent:
        # /run -> tmpfs
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        # Docker-compose equivalent:
        # /var/cache/nginx -> tmpfs
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        # Static files
        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.static }}

        # Media files
        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.media }}

        # Asset files
        - name: assets-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.assets }}

        # SSL certificate/key
        - name: nginx-ssl
          secret:
            secretName: {{ .Values.nginx.ssl.secretName }}
            defaultMode: 0440

      ########################################################
      # CONTAINER
      ########################################################
      containers:
        - name: nginx

          image: "{{ .Values.nginx.image }}"
          imagePullPolicy: Always

          ####################################################
          # CONTAINER SECURITY
          ####################################################
          securityContext:
            runAsNonRoot: true
            runAsUser: 70070
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ####################################################
          # PORTS
          ####################################################
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

            - name: https
              containerPort: 8443
              protocol: TCP

          ####################################################
          # ENVIRONMENT
          ####################################################
          env:
            - name: SERVER_NAME
              value: "{{ .Values.nginx.serverName | default "_" }}"

          ####################################################
          # RESOURCES
          ####################################################
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"

          ####################################################
          # NGINX COMMAND
          ####################################################
          command:
            - /bin/sh
            - -c

          args:
            - |
              set -eu

              echo "========================================"
              echo "Starting NGINX"
              echo "========================================"

              echo "Preparing blockuseragents.rules..."

              if [ -f /etc/nginx/blockuseragents.rules ]; then
                cp /etc/nginx/blockuseragents.rules \
                   /etc/nginx/conf.d/blockuseragents.rules
              fi

              echo "Generating NGINX configuration..."

              if command -v docker-gen >/dev/null 2>&1; then
                docker-gen \
                  -endpoint unix:///tmp/docker.sock \
                  /etc/docker-gen/templates/nginx.tmpl \
                  /etc/nginx/conf.d/default.conf \
                  || true
              fi

              echo "Testing NGINX configuration..."

              nginx -t

              echo "Starting NGINX..."

              exec nginx -g 'daemon off;'

          ####################################################
          # CONFIGURATION MOUNTS
          ####################################################
          volumeMounts:

            # nginx.conf
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

            # mime.types
            - name: nginx-config
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
              readOnly: true

            # blockuseragents.rules
            #
            # IMPORTANT:
            # This is mounted outside conf.d because conf.d
            # itself is writable emptyDir.
            - name: nginx-config
              mountPath: /etc/nginx/blockuseragents.rules
              subPath: blockuseragents.rules
              readOnly: true

            # docker-gen generated configuration
            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d

            # NGINX runtime
            - name: nginx-run
              mountPath: /run

            # NGINX cache
            - name: nginx-cache
              mountPath: /var/cache/nginx

            # Application static files
            - name: static-storage
              mountPath: /var/www/revolutio/static
              readOnly: true

            # Application media
            - name: media-storage
              mountPath: /var/www/revolutio/media

            # Application assets
            - name: assets-storage
              mountPath: /var/www/asset
              readOnly: true

            # SSL certificates
            - name: nginx-ssl
              mountPath: /etc/ssl/revolutio
              readOnly: true

          ####################################################
          # HEALTHCHECK
          ####################################################
          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
