apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: myapp
  labels:
    app: nginx
    service: nginx
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx
      service: nginx

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        app: nginx
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: acr-secret

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000
        fsGroupChangePolicy: OnRootMismatch

      terminationGracePeriodSeconds: 30

      containers:
        - name: nginx

          image: revolutio.azurecr.io/revolutio_kubernetes/nginx:latest

          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -e

              echo "========================================"
              echo "NGINX Kubernetes startup"
              echo "========================================"

              echo
              echo "===== NGINX VERSION ====="
              nginx -v

              echo
              echo "===== COPYING BLOCK USER AGENTS RULE ====="

              if [ -f /etc/nginx/blockuseragents.rules ]; then
                cp /etc/nginx/blockuseragents.rules /etc/nginx/conf.d/blockuseragents.rules
                echo "blockuseragents.rules copied successfully"
              else
                echo "ERROR: /etc/nginx/blockuseragents.rules not found"
                exit 1
              fi

              echo
              echo "===== SSL FILES ====="

              if [ -f /etc/ssl/revolutio/ssl.crt ] && [ -f /etc/ssl/revolutio/ssl.key ]; then
                echo "SSL certificate found"
                echo "SSL key found"
              else
                echo "WARNING: SSL certificate/key not found"
              fi

              echo
              echo "===== NGINX CONFIGURATION TEST ====="

              nginx -t

              echo
              echo "===== NGINX CONFIGURATION TEST PASSED ====="

              echo
              echo "===== STARTING NGINX ====="

              exec nginx -g 'daemon off;'

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

            - name: https
              containerPort: 443
              protocol: TCP

          env:
            - name: SERVER_NAME
              value: "_"

          volumeMounts:

            # -------------------------------------------------
            # NGINX generated/static configuration
            # -------------------------------------------------
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

            # -------------------------------------------------
            # SSL certificate and key
            #
            # PVC:
            # nginx-conf-pvc-1
            #
            # PVC directory:
            # ssl/
            #
            # Container:
            # /etc/ssl/revolutio/
            #
            # Files:
            # /etc/ssl/revolutio/ssl.crt
            # /etc/ssl/revolutio/ssl.key
            # -------------------------------------------------
            - name: nginx-ssl
              mountPath: /etc/ssl/revolutio
              subPath: ssl
              readOnly: true

            # -------------------------------------------------
            # Static files
            # -------------------------------------------------
            - name: static-storage
              mountPath: /var/www/revolutio/static

            # -------------------------------------------------
            # Media files
            # -------------------------------------------------
            - name: media-storage
              mountPath: /var/www/revolutio/media

            # -------------------------------------------------
            # NGINX cache
            # Replaces Docker tmpfs /var/cache/nginx
            # -------------------------------------------------
            - name: nginx-cache
              mountPath: /var/cache/nginx

            # -------------------------------------------------
            # NGINX runtime directory
            # Replaces Docker tmpfs /run
            # -------------------------------------------------
            - name: nginx-run
              mountPath: /run

            # nginx.conf uses /var/run/nginx.pid
            - name: nginx-run
              mountPath: /var/run

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      volumes:

        # -----------------------------------------------------
        # ONLY default.conf comes from ConfigMap.
        #
        # nginx.conf
        # mime.types
        # blockuseragents.rules
        #
        # remain from the NGINX image.
        # -----------------------------------------------------
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0644

        # -----------------------------------------------------
        # Existing PVC containing:
        #
        # nginx-conf-pvc-1/
        # └── ssl/
        #     ├── ssl.crt
        #     └── ssl.key
        # -----------------------------------------------------
        - name: nginx-ssl
          persistentVolumeClaim:
            claimName: nginx-conf-pvc-1

        # -----------------------------------------------------
        # Existing static PVC
        # -----------------------------------------------------
        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc-1

        # -----------------------------------------------------
        # Existing media PVC
        # -----------------------------------------------------
        - name: media-storage
          persistentVolumeClaim:
            claimName: media-pvc-1

        # -----------------------------------------------------
        # Docker tmpfs equivalent
        # -----------------------------------------------------
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

        # -----------------------------------------------------
        # Docker /run tmpfs equivalent
        # -----------------------------------------------------
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi
