apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    service: nginx

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      service: nginx

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000
        seccompProfile:
          type: RuntimeDefault

      volumes:

        # ==================================================
        # NGINX CONFIGURATION
        # ==================================================

        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 0444

        # ==================================================
        # NGINX /etc/nginx/conf.d
        # Docker tmpfs equivalent
        # ==================================================

        - name: nginx-conf-d
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        # ==================================================
        # NGINX /run
        # Docker tmpfs equivalent
        # ==================================================

        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        # ==================================================
        # NGINX CACHE
        # Docker tmpfs equivalent
        # ==================================================

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi

        # ==================================================
        # STATIC
        # ==================================================

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.static }}

        # ==================================================
        # MEDIA
        # ==================================================

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.media }}

        # ==================================================
        # SSL
        # ==================================================
        # Secret must contain:
        #
        # ssl.crt
        # ssl.key
        #
        # Created from:
        # /App/Revolutio/nginx/ssl/ssl.crt
        # /App/Revolutio/nginx/ssl/ssl.key
        # ==================================================

        - name: nginx-ssl
          secret:
            secretName: nginx-ssl
            defaultMode: 0440

      containers:

        - name: nginx

          image: "{{ .Values.nginx.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:

            # HTTP
            - name: http
              containerPort: 8080
              protocol: TCP

            # HTTPS
            #
            # Your nginx.conf must listen on this port
            # if using 8443.
            #
            - name: https
              containerPort: 8443
              protocol: TCP

          env:

            - name: SERVER_NAME
              value: "_"

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"

          # =================================================
          # START NGINX
          # =================================================

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -eu

              echo "========================================"
              echo "Starting NGINX"
              echo "========================================"

              echo "NGINX version:"
              nginx -v

              echo "Checking SSL files..."

              if [ -f /etc/ssl/revolutio/ssl.crt ]; then
                echo "SSL certificate found."
              else
                echo "WARNING: /etc/ssl/revolutio/ssl.crt not found."
              fi

              if [ -f /etc/ssl/revolutio/ssl.key ]; then
                echo "SSL private key found."
              else
                echo "WARNING: /etc/ssl/revolutio/ssl.key not found."
              fi

              echo "Checking NGINX configuration..."

              nginx -t

              echo "Starting NGINX..."

              exec nginx -g 'daemon off;'

          # =================================================
          # VOLUME MOUNTS
          # =================================================

          volumeMounts:

            # ------------------------------------------------
            # nginx.conf
            # ------------------------------------------------

            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true

            # ------------------------------------------------
            # mime.types
            # ------------------------------------------------

            - name: nginx-config
              mountPath: /etc/nginx/mime.types
              subPath: mime.types
              readOnly: true

            # ------------------------------------------------
            # blockuseragents.rules
            # ------------------------------------------------

            - name: nginx-config
              mountPath: /etc/nginx/blockuseragents.rules
              subPath: blockuseragents.rules
              readOnly: true

            # ------------------------------------------------
            # Writable conf.d
            # ------------------------------------------------

            - name: nginx-conf-d
              mountPath: /etc/nginx/conf.d

            # ------------------------------------------------
            # /run
            # ------------------------------------------------

            - name: nginx-run
              mountPath: /run

            # ------------------------------------------------
            # NGINX cache
            # ------------------------------------------------

            - name: nginx-cache
              mountPath: /var/cache/nginx

            # ------------------------------------------------
            # Static files
            # ------------------------------------------------

            - name: static-storage
              mountPath: /var/www/revolutio/static
              readOnly: true

            # ------------------------------------------------
            # Media files
            # ------------------------------------------------

            - name: media-storage
              mountPath: /var/www/revolutio/media

            # ------------------------------------------------
            # SSL
            # ------------------------------------------------

            - name: nginx-ssl
              mountPath: /etc/ssl/revolutio
              readOnly: true

          # =================================================
          # STARTUP PROBE
          # =================================================

          startupProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          # =================================================
          # READINESS PROBE
          # =================================================

          readinessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          # =================================================
          # LIVENESS PROBE
          # =================================================

          livenessProbe:
            httpGet:
              path: /healthy
              port: 8080
              scheme: HTTP
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
