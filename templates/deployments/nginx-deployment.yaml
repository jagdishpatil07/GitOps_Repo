apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: {{ .Values.namespace }}
  labels:
    service: nginx

spec:
  replicas: {{ .Values.nginx.replicaCount }}

  selector:
    matchLabels:
      service: nginx

  template:
    metadata:
      labels:
        service: nginx

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      ########################################################
      # SECURITY
      ########################################################
      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 1000860000

      ########################################################
      # ✅ INIT CONTAINER (FINAL)
      ########################################################
      initContainers:
        - name: init-nginx-config
          image: alpine/git
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              echo "Cloning repo into /tmp..."
              git clone --depth=1 https://github.com/jagdishpatil07/GitOps_Repo.git /tmp/repo

              echo "Checking repo contents..."
              ls -R /tmp/repo

              echo "Preparing nginx directory..."
              mkdir -p /nginx/conf.d

              echo "Cleaning old files..."
              rm -f /nginx/nginx.conf || true
              rm -f /nginx/mime.types || true

              echo "Copying nginx configs..."

              cp -v /tmp/repo/FILES/nginx/nginx.conf /nginx/nginx.conf
              cp -v /tmp/repo/FILES/nginx/mime.types /nginx/mime.types
              cp -v /tmp/repo/FILES/nginx/blockuseragents.rules /nginx/conf.d/ 2>/dev/null || true

              echo "Final nginx files:"
              ls -l /nginx

              echo "✅ Init container completed successfully"

          volumeMounts:
            - name: nginx-conf-storage
              mountPath: /nginx

      ########################################################
      # VOLUMES
      ########################################################
      volumes:
        - name: nginx-conf-storage
          persistentVolumeClaim:
            claimName: nginx-conf-pvc-1

        - name: media-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.media }}

        - name: static-storage
          persistentVolumeClaim:
            claimName: {{ .Values.nginx.pvc.static }}

        - name: nginx-cache
          emptyDir: {}

        - name: nginx-run
          emptyDir: {}

      ########################################################
      # MAIN NGINX CONTAINER
      ########################################################
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image }}"
          imagePullPolicy: Always

          securityContext:
            runAsUser: 70070

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          ########################################################
          # VOLUME MOUNTS
          ########################################################
          volumeMounts:
            - name: nginx-conf-storage
              mountPath: /etc/nginx/

            - name: media-storage
              mountPath: /var/www/revolutio/media

            - name: static-storage
              mountPath: /var/www/revolutio/static

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /var/run

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
