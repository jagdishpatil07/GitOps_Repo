apiVersion: apps/v1
kind: Deployment
metadata:
  name: keydb
  namespace: {{ .Values.namespace }}
  labels:
    service: keydb

spec:
  replicas: {{ .Values.keydb.replicaCount }}

  selector:
    matchLabels:
      service: keydb

  template:
    metadata:
      labels:
        service: keydb

    spec:
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecrets.name }}

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      volumes:
        - name: keydb-data
          persistentVolumeClaim:
            claimName: {{ .Values.keydb.pvcName }}

        - name: openbao-approle
          persistentVolumeClaim:
            claimName: openbao-approle-keydb-pvc-1

        - name: shared-certs
          persistentVolumeClaim:
            claimName: shared-certs-pvc-1

      containers:
        - name: keydb

          image: "{{ .Values.keydb.image }}"
          imagePullPolicy: Always

          # Do NOT use command:
          # Docker Compose command must be passed as arguments
          # so the image ENTRYPOINT is preserved.

          args:
            - tini
            - --
            - docker-entrypoint.sh
            - keydb-server
            - --server-threads
            - "1"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru

          env:
            - name: OPENBAO_ADDR
              value: "https://openbao:8200"

            - name: OPENBAO_CACERT
              value: "/openbao-certs/tls.crt"

            - name: OPENBAO_ROLE_ID
              value: "keydb"

            - name: OPENBAO_SECRET_ID_FILE
              value: "/openbao-approle/secret_id"

            - name: OPENBAO_SECRET_PATH
              value: "cache/keydb"

            - name: TZ
              value: "UTC"

          volumeMounts:
            - name: keydb-data
              mountPath: /data

            - name: openbao-approle
              mountPath: /openbao-approle
              readOnly: true

            - name: shared-certs
              mountPath: /openbao-certs
              readOnly: true

          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - keydb-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 50

          livenessProbe:
            exec:
              command:
                - keydb-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 30
            failureThreshold: 5

      restartPolicy: Always

      terminationGracePeriodSeconds: 3

      dnsPolicy: ClusterFirst

  strategy:
    type: RollingUpdate

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600
