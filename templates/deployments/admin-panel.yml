apiVersion: apps/v1
kind: Deployment

metadata:
  name: admin-panel
  namespace: {{ .Values.namespace }}
  labels:
    service: admin-panel

spec:
  replicas: 1

  selector:
    matchLabels:
      service: admin-panel

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%

  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

  template:
    metadata:
      labels:
        service: admin-panel

    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: registry-cred

      securityContext:
        runAsUser: 70070
        runAsNonRoot: true
        fsGroup: 70070

      terminationGracePeriodSeconds: 30

      containers:
        - name: admin-panel

          image: revolutio.azurecr.io/revolutio_kubernetes/admin-panel:bod-stable-2026.10.3
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"

            - name: CHOKIDAR_USEPOLLING
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "1"
              memory: "2Gi"

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 5

          securityContext:
            runAsUser: 70070
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: node-modules
              mountPath: /apps/web/frontend/admin_panel/node_modules

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /run

            - name: nginx-run
              mountPath: /var/run

            - name: tmp
              mountPath: /tmp

      volumes:

        - name: node-modules
          emptyDir: {}

        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 10Mi

        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi
