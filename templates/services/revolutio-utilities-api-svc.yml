apiVersion: v1
kind: Service

metadata:
  name: revolutio-utilities-api
  namespace: {{ .Values.namespace }}

spec:
  selector:
    service: revolutio-utilities-api

  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP

    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP

  type: ClusterIP
